            ${escapeHtml(g.name)}
          </label>`).join('')}
        </div>` : '';
  root.innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3>Convidar pessoa</h3>
        <input id="inviteEmail" type="email" placeholder="E-mail da pessoa" />
        <input id="invitePass" type="text" placeholder="Senha temporária" value="${generateTempPassword()}" />
        <p style="font-size:11px;color:var(--ink-soft);margin:-6px 0 12px;">A pessoa vai precisar trocar essa senha no primeiro acesso. Abas sem restrição já aparecem para ela automaticamente.</p>
        ${groupRows}
        <div class="login-error" id="inviteError"></div>
        <div class="actions">
          <button class="cancel" id="cancelInvite">Cancelar</button>
          <button class="confirm" id="confirmInvite">Criar acesso</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelInvite').onclick = () => root.innerHTML = '';
  document.getElementById('modalBg').onclick = e => { if(e.target.id === 'modalBg') root.innerHTML = ''; };
  document.getElementById('confirmInvite').onclick = async () => {
    const btn = document.getElementById('confirmInvite');
    const email = document.getElementById('inviteEmail').value.trim();
    const pass = document.getElementById('invitePass').value;
    const groups = [...document.querySelectorAll('.invite-group-check:checked')].map(el => el.value);
    const errEl = document.getElementById('inviteError');
    errEl.textContent = '';
    if(!email || pass.length < 6){ errEl.textContent = 'Preencha o e-mail e uma senha com pelo menos 6 caracteres.'; return; }
    btn.disabled = true;

    // 1) cria o login (num app secundário, para não deslogar o admin)
    let cred;
    try{
      cred = await secondaryAuth.createUserWithEmailAndPassword(email, pass);
    } catch(err){
      btn.disabled = false;
      if(err.code === 'auth/email-already-in-use'){
        root.innerHTML = '';
        showReactivateAccess(email);
        return;
      }
      errEl.textContent = traduzErro(err.code) === 'Não foi possível entrar. Verifique os dados.'
        ? errMsg(err)
        : traduzErro(err.code);
      return;
    }

    // 2) grava o cadastro da pessoa no painel
    const newUid = cred.user.uid;
    const newEmail = cred.user.email || email;
    try{
      await db.collection('users').doc(newUid).set({
        email: newEmail, mustChangePassword: true, groups,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } catch(err){
      // o login JÁ foi criado — não adianta convidar de novo; o cadastro é refeito no primeiro acesso
      try{ await secondaryAuth.signOut(); } catch(e){}
      btn.disabled = false;
      logActivity('criou o login (cadastro no painel pendente) de', newEmail);
      errEl.textContent = `O login de ${newEmail} foi criado, mas o cadastro no painel falhou: ${errMsg(err)} Não convide de novo: a pessoa já consegue entrar com a senha temporária (peça para ela trocar a senha) e o cadastro é refeito no primeiro acesso.`;
      return;
    }
    try{ await secondaryAuth.signOut(); } catch(e){}
    logActivity('convidou a pessoa', newEmail);
    root.innerHTML = '';
    alert(`Conta criada para ${newEmail}. Envie o e-mail e a senha temporária "${pass}" para a pessoa.`);
  };
}

// e-mail já cadastrado: reativa o acesso e envia link para a pessoa criar nova senha
// (o Firebase não deixa definir outra senha para alguém direto pelo navegador)
function showReactivateAccess(email){
  const root = document.getElementById('modalRoot');
  const existing = allUsers.find(u => (u.email || '').toLowerCase() === email.toLowerCase());
  root.innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3>Esse e-mail já tem acesso</h3>
        <p style="font-size:12.5px;color:var(--ink);margin:0 0 8px;"><b>${escapeHtml(email)}</b> já está cadastrado${existing && existing.blocked ? ' (e está <b>bloqueado</b>)' : ''}.</p>
        <p style="font-size:12px;color:var(--ink-soft);margin:0 0 12px;">Por segurança, o Firebase não permite definir outra senha para alguém pelo navegador. Ao reativar, o acesso é desbloqueado e a pessoa recebe um <b>e-mail com link para criar uma nova senha</b> (peça pra ela conferir a caixa de spam).</p>
        <div class="login-error" id="reactError"></div>
        <div class="actions">
          <button class="cancel" id="cancelReact">Cancelar</button>
          <button class="confirm" id="confirmReact">Reativar e enviar link</button>
        </div>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('cancelReact').onclick = close;
  document.getElementById('modalBg').onclick = e => { if(e.target.id === 'modalBg') close(); };
  document.getElementById('confirmReact').onclick = async () => {
    const errEl = document.getElementById('reactError');
    errEl.textContent = '';
    try{
      if(existing){
        await db.collection('users').doc(existing.uid).set({ blocked: false }, { merge: true });
      }
      await auth.sendPasswordResetEmail(email);
      logActivity('reativou o acesso e enviou link de nova senha para', email);
      close();
      alert(`Acesso reativado. ${email} recebeu um e-mail com link para criar a nova senha.`);
    } catch(e){
      errEl.textContent = 'Erro ao reativar: ' + errMsg(e);
    }
  };
}

function generateTempPassword(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let s = '';
  for(let i = 0; i < 8; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

    db.collection('groups').add({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(() => { logActivity('criou o grupo de acesso', name); input.value = ''; })
      .catch(e => { document.getElementById('groupError').textContent = 'Erro ao criar grupo: ' + errMsg(e); });
  };
  document.getElementById('createGroupBtn').onclick = create;
  input.onkeydown = e => { if(e.key === 'Enter') create(); };
  renderGroupsList();
}

function cleanGroupName(v){ return String(v || '').trim().replace(/\s+/g, ' ').slice(0, 30); }

function validateGroupName(name, ignoreId){
  if(name.length < 2) return 'Digite um nome com pelo menos 2 letras.';
  const dup = allGroups.find(g => g.id !== ignoreId && g.name.toLowerCase() === name.toLowerCase());
  if(dup) return 'Já existe um grupo com esse nome.';
  return '';
}

function renameGroup(gid){
  const g = allGroups.find(x => x.id === gid);
  if(!g) return;
  const novo = prompt('Novo nome do grupo:', g.name);
  if(novo === null) return;
  const name = cleanGroupName(novo);
  const err = validateGroupName(name, gid);
  if(err){ alert(err); return; }
  db.collection('groups').doc(gid).update({ name })
    .then(() => logActivity('renomeou o grupo de acesso', `${g.name} → ${name}`))
    .catch(e => alert('Erro ao renomear grupo: ' + errMsg(e)));
}

function showGroupMembersModal(gid){
  const g = allGroups.find(x => x.id === gid);
  if(!g) return;
  const root = document.getElementById('modalRoot');
  const users = allUsers.filter(u => u.uid !== myUid)
    .sort((a, b) => displayNameFor(a).toLowerCase().localeCompare(displayNameFor(b).toLowerCase()));
  const rows = users.length ? users.map(u => `
    <label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;color:var(--ink);cursor:pointer;">
      <input type="checkbox" class="group-member-check" value="${escapeAttr(u.uid)}" ${(u.groups || []).includes(gid) ? 'checked' : ''} style="width:auto;margin:0;" />
      <span>${escapeHtml(u.chatName ? u.chatName + ' — ' + u.email : u.email)}${u.blocked ? ' <span style="color:var(--danger);font-size:11px;">(bloqueado)</span>' : ''}</span>
    </label>`).join('') : '<div style="font-size:12px;color:var(--ink-soft);padding:8px 0;">Nenhum outro usuário cadastrado ainda.</div>';
  root.innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal" style="max-width:400px;">
        <h3>Pessoas do grupo "${escapeHtml(g.name)}"</h3>
        <div style="max-height:320px;overflow-y:auto;border-top:1px solid var(--paper-dim);border-bottom:1px solid var(--paper-dim);margin-bottom:14px;">${rows}</div>
        <div class="login-error" id="groupMembersError"></div>
        <div class="actions">
          <button class="cancel" id="cancelMembers">Voltar</button>
          <button class="confirm" id="confirmMembers">Salvar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelMembers').onclick = showGroupsModal;
  document.getElementById('modalBg').onclick = e => { if(e.target.id === 'modalBg') showGroupsModal(); };
  document.getElementById('confirmMembers').onclick = () => {
    const checked = new Set([...document.querySelectorAll('.group-member-check:checked')].map(el => el.value));
    const batch = db.batch();
    let changes = 0;
    users.forEach(u => {
      const was = (u.groups || []).includes(gid);
      const now = checked.has(u.uid);
      if(was === now) return;
      changes++;
      batch.set(db.collection('users').doc(u.uid), {
        groups: now ? firebase.firestore.FieldValue.arrayUnion(gid) : firebase.firestore.FieldValue.arrayRemove(gid)
      }, { merge: true });
    });
    if(!changes){ showGroupsModal(); return; }
    batch.commit()
      .then(() => { logActivity('alterou as pessoas do grupo', g.name); showGroupsModal(); })
      .catch(e => { document.getElementById('groupMembersError').textContent = 'Erro ao salvar: ' + errMsg(e); });
  };
}

function deleteGroup(gid){
  const g = allGroups.find(x => x.id === gid);
  if(!g) return;
  const usedBy = categories.filter(c => (c.allowedGroups || []).includes(gid));
  // aba que só era liberada por este grupo NÃO pode virar pública sem querer: mantemos a restrição
  // (fica visível só para administradores até o admin escolher quem pode ver)
  const onlyThisGroup = usedBy.filter(c => !(c.allowedUsers || []).length && (c.allowedGroups || []).every(x => x === gid));
  const others = usedBy.filter(c => !onlyThisGroup.includes(c));
  const members = allUsers.filter(u => (u.groups || []).includes(gid));
  let msg = `Excluir o grupo "${g.name}"? As ${members.length} pessoa(s) do grupo deixam de fazer parte dele.`;
  if(onlyThisGroup.length){
    msg += `\n\nAs abas abaixo só eram liberadas para este grupo. Elas continuam restritas (só administradores vão ver) até você escolher quem pode vê-las:\n- ${onlyThisGroup.map(c => c.name).join('\n- ')}`;
  }
  if(!confirm(msg)) return;
  const batch = db.batch();
  batch.delete(db.collection('groups').doc(gid));
  others.forEach(c => batch.update(db.collection('categories').doc(c.id), { allowedGroups: firebase.firestore.FieldValue.arrayRemove(gid) }));
  members.forEach(u => batch.set(db.collection('users').doc(u.uid), { groups: firebase.firestore.FieldValue.arrayRemove(gid) }, { merge: true }));
  batch.commit()
    .then(() => logActivity('excluiu o grupo de acesso', g.name))
    .catch(e => alert('Erro ao excluir grupo: ' + errMsg(e)));
}

function fmtDateTime(ms){
  if(!ms) return '—';
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function resetErrorMsg(err){

    'auth/user-not-found': 'não existe login com esse e-mail (o cadastro pode ser antigo ou duplicado).',
    'auth/invalid-email': 'o e-mail é inválido.',
    'auth/too-many-requests': 'muitas tentativas seguidas — aguarde alguns minutos e tente de novo.'

// remove só o CADASTRO da pessoa no painel (coleção "users"). O login em si (Firebase Authentication)
// só pode ser apagado no Console do Firebase. Se a pessoa ainda usa o login, o cadastro é recriado quando ela entrar.
async function deleteUserRecord(uid, email){
  const touched = categories.filter(c => (c.allowedUsers || []).includes(uid));
  // se esta pessoa era a ÚNICA liberada em uma aba, não removemos o id dela de lá: senão a aba viraria pública
  const keep = touched.filter(c => (c.allowedUsers || []).every(x => x === uid) && !(c.allowedGroups || []).length);
  const clean = touched.filter(c => !keep.includes(c));
  const batch = db.batch();
  batch.delete(db.collection('users').doc(uid));
  clean.forEach(c => batch.update(db.collection('categories').doc(c.id), { allowedUsers: firebase.firestore.FieldValue.arrayRemove(uid) }));
  try{
    await batch.commit();
    logActivity('excluiu o cadastro de', email);
    showManageUsersModal();
  } catch(err){
    alert('Erro ao excluir cadastro: ' + errMsg(err));
  }
}

function renderUsersMgmtList(adminUids){
  const list = document.getElementById('usersMgmtList');
  if(!list) return;
  lastAdminUids = adminUids;
  const prevScroll = list.scrollTop;
  const others = allUsers.filter(u => u.uid !== myUid);
  if(!others.length){
    list.innerHTML = '<div style="color:var(--ink-soft);font-size:12px;padding:8px 0;">Nenhum outro usuário cadastrado ainda.</div>';
    return;
  }
  // e-mails que aparecem em mais de um cadastro (acontece quando a conta é apagada e recriada no Firebase)
  const emailCount = {};
  others.forEach(u => { const k = (u.email || '').toLowerCase(); emailCount[k] = (emailCount[k] || 0) + 1; });
  const hasDup = Object.values(emailCount).some(n => n > 1);
  const sorted = [...others].sort((a, b) => {
    const ka = (a.email || '').toLowerCase(), kb = (b.email || '').toLowerCase();
    if(ka !== kb) return ka.localeCompare(kb);
    return (b.lastLogin || 0) - (a.lastLogin || 0);
  });
  const groupName = id => (allGroups.find(g => g.id === id) || {}).name;

  list.innerHTML = (hasDup ? `<div style="background:#fff7e6;border:1px solid var(--amber);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--ink);margin-bottom:6px;">Há e-mails com mais de um cadastro (marcados com <b>duplicado</b>). Em geral o de acesso mais recente é o da conta atual — o mais antigo pode ser excluído.</div>` : '') +
  sorted.map(u => {
    const isUserAdmin = adminUids.has(u.uid);
    const blocked = u.blocked;
    const dup = emailCount[(u.email || '').toLowerCase()] > 1;
    const gnames = (u.groups || []).map(groupName).filter(Boolean);
    const tags = [];
    if(isUserAdmin) tags.push('Admin');
    if(blocked) tags.push('<span style="color:var(--danger);">Bloqueado</span>');
    else if(!isUserAdmin) tags.push('Ativo');
    if(dup) tags.push('<span style="color:var(--danger);font-weight:700;">duplicado</span>');
    return `
    <div style="padding:10px 0;border-bottom:1px solid var(--paper-dim);">
      <div style="font-size:13px;color:var(--ink);word-break:break-word;font-weight:600;">${u.chatName ? escapeHtml(u.chatName) : escapeHtml(u.email)}</div>
      <div style="font-size:10.5px;color:var(--ink-soft);word-break:break-word;">${u.chatName ? escapeHtml(u.email) + ' · ' : ''}${tags.join(' · ')} · último acesso: ${fmtDateTime(u.lastLogin)}</div>
      ${gnames.length ? `<div style="font-size:10.5px;color:var(--ink-soft);">Grupos: ${escapeHtml(gnames.join(', '))}</div>` : ''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;">
        <button class="mini-btn" data-editname="${escapeAttr(u.uid)}">Editar nome</button>
        <button class="mini-btn" data-resetemail="${escapeAttr(u.email)}" title="Envia ao e-mail da pessoa um link para ela criar uma nova senha">Redefinir senha</button>
        ${!isUserAdmin ? `<button class="mini-btn ${blocked ? '' : 'danger'}" data-blockuid="${escapeAttr(u.uid)}" data-blocked="${blocked ? '1' : '0'}">${blocked ? 'Desbloquear' : 'Bloquear'}</button>` : ''}
        ${!blocked ? `<button class="mini-btn" data-adminuid="${escapeAttr(u.uid)}" data-isadmin="${isUserAdmin ? '1' : '0'}">${isUserAdmin ? 'Remover admin' : 'Tornar admin'}</button>` : ''}
        ${!isUserAdmin ? `<button class="mini-btn danger" data-deluser="${escapeAttr(u.uid)}" title="Remove o cadastro desta pessoa no painel">Excluir cadastro</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const userByUid = uid => allUsers.find(x => x.uid === uid);
  list.querySelectorAll('[data-editname]').forEach(btn => {
    btn.onclick = () => {
      const u = userByUid(btn.getAttribute('data-editname'));
      if(!u) return;
      const novo = prompt(`Nome de exibição para ${u.email}:`, u.chatName || '');
      if(novo !== null) setUserChatNameAsAdmin(u.uid, novo);
    };
  });
  list.querySelectorAll('[data-blockuid]').forEach(btn => {
    btn.onclick = () => {
      const uid = btn.getAttribute('data-blockuid');
      const currentlyBlocked = btn.getAttribute('data-blocked') === '1';
      const u = userByUid(uid);
      const email = u ? u.email : uid;
      const msg = currentlyBlocked ? `Desbloquear ${email}?` : `Bloquear ${email}? A pessoa será desconectada e não vai conseguir mais acessar o painel até ser desbloqueada.`;
      if(confirm(msg)) toggleBlockUser(uid, currentlyBlocked, email);
    };
  });
  list.querySelectorAll('[data-resetemail]').forEach(btn => {
    btn.onclick = () => {
      const email = btn.getAttribute('data-resetemail');
      if(confirm(`Enviar para ${email} um e-mail com link para criar uma nova senha?\n\nA pessoa precisa conseguir abrir esse e-mail (confira também o spam).`)) resetUserPassword(email);
    };
  });
  list.querySelectorAll('[data-adminuid]').forEach(btn => {
    btn.onclick = () => {
      const uid = btn.getAttribute('data-adminuid');
      const isAdm = btn.getAttribute('data-isadmin') === '1';
      const u = userByUid(uid);
      const email = u ? u.email : uid;
      const msg = isAdm
        ? `Remover o acesso de administrador de ${email}? Ela volta a ser usuário comum e só verá as abas liberadas.`
        : `Tornar ${email} administrador?\n\nEla poderá criar, editar e excluir abas e links, convidar e bloquear pessoas, gerenciar grupos e ver as demandas de todos.`;
      if(confirm(msg)) toggleAdminRole(uid, !isAdm, email);
    };
  });
  list.querySelectorAll('[data-deluser]').forEach(btn => {
    btn.onclick = () => {
      const uid = btn.getAttribute('data-deluser');
      const u = userByUid(uid);
      const email = u ? u.email : uid;
      const msg = `Excluir o cadastro de ${email} no painel?\n\nIsso NÃO apaga o login dela no Firebase (isso só é possível no Console do Firebase). Se ela ainda usa esse login, o cadastro é recriado quando ela entrar — mas as liberações de abas e grupos se perdem.`;
      if(confirm(msg)) deleteUserRecord(uid, email);
    };
  });
  list.scrollTop = prevScroll;
}

function listenConversations(){
  if(unsubConversations) unsubConversations();
  unsubConversations = db.collection('conversations')
    .where('participants', 'array-contains', myUid)
    .onSnapshot(snap => {
      // _pending: conversa recém-criada por mim ainda não confirmada no servidor
      // (ler as mensagens antes disso pode ser recusado pelas regras)
      // (só conta como "nova" se ainda não tem data de mensagem confirmada; mudanças como silenciar/arquivar não contam)
      myConversations = snap.docs.map(d => {
        const data = d.data();
        return { id: d.id, ...data, _pending: d.metadata.hasPendingWrites && !data.lastMessageAt };
      });
      myConversations.sort((a, b) => {
        const at = a.lastMessageAt ? a.lastMessageAt.toMillis() : 0;
        const bt = b.lastMessageAt ? b.lastMessageAt.toMillis() : 0;
        return bt - at;
      });
      checkForNewMessageNotifications(myConversations);
      updateMessagesBadge();
      renderConversationList();
      consumeDeepLink();
      if(chatView && chatView.type === 'thread'){
        ensureThreadListener();
        updateThreadDocUI();
        autoMarkOpenThreadRead();
      }
    }, err => reportListenError('conversas', err));
}

function checkForNewMessageNotifications(convs){
  convs.forEach(c => {
    const t = c.lastMessageAt ? c.lastMessageAt.toMillis() : 0;
    const prev = prevConvTimestamps[c.id] || 0;
    if(prev !== 0 && t > prev && c.lastSenderUid && c.lastSenderUid !== myUid){
      const muted = c.muted && c.muted[myUid];
      const threadOpenAndFocused = section === 'chats' && (mainOpen || !isMobile()) &&
        chatView && chatView.type === 'thread' && chatView.convId === c.id && document.visibilityState === 'visible';
      if(!muted && !threadOpenAndFocused){
        const otherUser = allUsers.find(u => u.uid === c.lastSenderUid);
        const name = displayNameFor(otherUser);
        const text = c.lastMessage || 'Nova mensagem';
        showMsnToast(name, text, c.id);
        playMessageSound();
        // notificação do sistema quando o painel não está em primeiro plano (no Android só funciona pelo service worker)
        if(document.visibilityState !== 'visible' || !document.hasFocus()) showSystemNotification(name, text, c.id);
      }
    }
    prevConvTimestamps[c.id] = t;
  });
}

function showMsnToast(name, text, convId){
  const container = document.getElementById('msnToastContainer');
  if(!container) return;
  // evita empilhar vários toasts da mesma conversa ao mesmo tempo
  const existing = container.querySelector(`[data-toast-conv="${convId}"]`);
  if(existing) existing.remove();
  // no máximo 4 toasts visíveis por vez — remove o mais antigo
  while(container.children.length >= 4) container.removeChild(container.firstChild);

  const initials = (name || '?').trim().slice(0, 1).toUpperCase();
  const toast = document.createElement('div');
  toast.className = 'msn-toast';
  toast.setAttribute('data-toast-conv', convId);
  toast.innerHTML = `
    <div class="msn-avatar">${escapeHtml(initials)}</div>
    <div class="msn-body">
      <div class="msn-name">${escapeHtml(name)}</div>
      <div class="msn-text">${escapeHtml(text)}</div>
    </div>
    <button class="msn-close" title="Fechar">✕</button>`;
  const remove = () => {
    toast.classList.add('leaving');
    setTimeout(() => toast.remove(), 260);
  };
  toast.querySelector('.msn-close').onclick = e => { e.stopPropagation(); remove(); };
  toast.onclick = () => {
    remove();
    // antes abria a conversa sem saber quem era o outro participante (nome "undefined" e envio falhava)
    openThreadByConv(convId);
  };
  container.appendChild(toast);
  setTimeout(remove, 6000);
}

function sendMessage(convId, otherUid, text){

  // mensagem: a regra de segurança da mensagem lê esse documento pra
  // confirmar quem são os participantes, e numa conversa nova (1ª mensagem
  // pra alguém) ele ainda não existe — por isso é feito em duas etapas
  // (não num batch só), senão dá "missing or insufficient permissions"
  convRef.set({
    participants: [myUid, otherUid].sort(),
    lastMessage: trimmed,
    lastMessageAt: now,
    lastSenderUid: myUid,
    archived: { [myUid]: false, [otherUid]: false },
    unread: { [otherUid]: firebase.firestore.FieldValue.increment(1), [myUid]: 0 }
  }, { merge: true }).then(() => {
    return convRef.collection('messages').add({ senderUid: myUid, text: trimmed, createdAt: now });
  }).then(() => { if(typeof pushNotifyMessage === 'function') pushNotifyMessage(convId); })
  .catch(err => alert('Erro ao enviar mensagem: ' + errMsg(err)));
}

function statusLabel(s){

}

function priorityLabel(p){

function priorityColor(p){

}

function listenDemands(){
  if(unsubDemands) unsubDemands();
  if(unsubDemandsCreated) unsubDemandsCreated();
  if(unsubDemandsAssigned) unsubDemandsAssigned();

  if(isAdmin){
    unsubDemands = db.collection('demands').onSnapshot(snap => {
      myDemands = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      sortAndRenderDemands();
    }, err => reportListenError('demandas', err));
    return;
  }

  let createdDocs = {}, assignedDocs = {};
  const merge = () => {
    const merged = {};
    Object.values(createdDocs).forEach(d => { merged[d.id] = d; });
    Object.values(assignedDocs).forEach(d => { merged[d.id] = d; });
    myDemands = Object.values(merged);
    sortAndRenderDemands();
  };
  unsubDemandsCreated = db.collection('demands').where('createdBy', '==', myUid).onSnapshot(snap => {
    createdDocs = {};
    snap.docs.forEach(d => { createdDocs[d.id] = { id: d.id, ...d.data() }; });
    merge();
  }, err => reportListenError('demandas', err));
  unsubDemandsAssigned = db.collection('demands').where('assignedTo', 'array-contains', myUid).onSnapshot(snap => {
    assignedDocs = {};
    snap.docs.forEach(d => { assignedDocs[d.id] = { id: d.id, ...d.data() }; });
    merge();
  }, err => reportListenError('demandas', err));
}

function sortAndRenderDemands(){
  // fixadas primeiro, depois ordem de chegada (mais antiga primeiro)
  myDemands.sort((a, b) => {
    const ap = (a.pinned && a.pinned[myUid]) ? 1 : 0;
    const bp = (b.pinned && b.pinned[myUid]) ? 1 : 0;
    if(ap !== bp) return bp - ap;
    const at = a.createdAt ? a.createdAt.toMillis() : 0;
    const bt = b.createdAt ? b.createdAt.toMillis() : 0;
    return at - bt;
  });
  updateDemandsBadge();
  renderDemandsList();
  if(demandView && demandView.type === 'detail'){
    // a demanda aberta foi excluída/reatribuída por outra pessoa → fecha
    if(section === 'demands' && !myDemands.find(x => x.id === demandView.id)){ demandView = null; renderDemandModal(); }
    else { refreshDemandDetail(); autoMarkOpenDemandRead(); }
  }
  if(section === 'admin') renderAdminMain();
}

function isDemandOverdue(d){
  if(!d.deadline || d.status === 'concluida' || d.status === 'cancelada') return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dl = new Date(d.deadline + 'T00:00:00');
  return dl < today;
}

function isDemandDueSoon(d){
  if(!d.deadline || d.status === 'concluida' || d.status === 'cancelada' || isDemandOverdue(d)) return false;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dl = new Date(d.deadline + 'T00:00:00');
  const diffDays = Math.round((dl - today) / 86400000);
  return diffDays === 0 || diffDays === 1;
}

function getMyOverdueDemands(){
  return myDemands.filter(d => isMyAssignee(d) && isDemandOverdue(d));
}

function playAlertSound(){
  if(!soundsOn()) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1046].forEach((freq, i) => {
      setTimeout(() => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
        o.start();
        o.stop(ctx.currentTime + 0.4);
      }, i * 180);
    });
  } catch(e){}
}

// som curto e discreto (uma nota só) para mensagem/toast — diferente do alarme de demanda vencida
function playMessageSound(){
  if(!soundsOn()) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.value = 660;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
    o.start();
    o.stop(ctx.currentTime + 0.25);
  } catch(e){}
}

// data de hoje no fuso do aparelho (AAAA-MM-DD) — toISOString usaria UTC e viraria o dia à noite no Brasil
function hojeLocalISO(){
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
}

function createDemand(title, description, deadline, assignedToArr, priority, recurrenceFreq){
  // prazo não pode ser anterior a hoje (o campo já bloqueia, aqui garante se alguém digitar à mão)
  if(deadline && deadline < hojeLocalISO()){ alert('O prazo não pode ser uma data que já passou. Escolha hoje ou uma data futura.'); return; }
  const targets = assignedToArr.map(uid => allUsers.find(u => u.uid === uid)).filter(Boolean);
  const now = firebase.firestore.FieldValue.serverTimestamp();
  db.collection('demands').add({
    title: title.trim(),
    description: description.trim(),
    deadline: deadline || '',
    priority: priority || 'normal',
    status: 'aberta',
    createdBy: myUid,
    createdByName: displayNameFor({ chatName: myChatName, email: auth.currentUser.email }),
    assignedTo: assignedToArr,
    assignedToNames: targets.map(t => displayNameFor(t)),
    createdAt: now,
    updatedAt: now,
    startedAt: null,
    completedAt: null,
    lastReadAt: { [myUid]: now },
    archived: {},
    pinned: {},
    checklist: [],
    recurrence: recurrenceFreq ? { freq: recurrenceFreq } : null
  }).then(ref => {
    logActivity('abriu uma demanda', title.trim());
    if(typeof pushNotifyDemand === 'function') pushNotifyDemand(ref.id);   // aviso com o app fechado para quem recebeu
    // abre a demanda recém-criada (se ainda não chegou na lista, volta para a lista)
    demandView = myDemands.find(x => x.id === ref.id) ? { type: 'detail', id: ref.id } : 'list';
    renderDemandModal();
  }).catch(err => alert('Erro ao criar demanda: ' + errMsg(err)));
}

function spawnRecurringDemand(d){
  const base = d.deadline ? new Date(d.deadline + 'T00:00:00') : new Date();
  if(d.recurrence.freq === 'weekly') base.setDate(base.getDate() + 7);
  else if(d.recurrence.freq === 'monthly') base.setMonth(base.getMonth() + 1);
  const newDeadline = base.toISOString().slice(0, 10);
  const now = firebase.firestore.FieldValue.serverTimestamp();
  db.collection('demands').add({
    title: d.title,
    description: d.description,
    deadline: newDeadline,
    priority: d.priority || 'normal',
    status: 'aberta',
    createdBy: myUid,
    createdByName: displayNameFor({ chatName: myChatName, email: auth.currentUser.email }),
    assignedTo: d.assignedTo || [],
    assignedToNames: d.assignedToNames || [],
    createdAt: now,
    updatedAt: now,
    startedAt: null,
    completedAt: null,
    lastReadAt: { [myUid]: now },
    archived: {},
    pinned: {},
    checklist: [],
    recurrence: d.recurrence
  }).then(() => logActivity('gerou a próxima ocorrência de', d.title)).catch(() => {});
}

function updateDemandStatus(demandId, status){
  const d = myDemands.find(x => x.id === demandId);
  const demandRef = db.collection('demands').doc(demandId);
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const patch = { status, updatedAt: now };
  if(status === 'em_andamento' && d && !d.startedAt) patch.startedAt = now;
  if(status === 'concluida') patch.completedAt = now;
  demandRef.update(patch).then(() => {
    logActivity('mudou o status da demanda para', statusLabel(status));
    demandRef.collection('history').add({
      status,
      changedBy: myUid,
      changedByName: displayNameFor({ chatName: myChatName, email: auth.currentUser.email }),
      changedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(() => {});
    if(status === 'concluida' && d && d.recurrence && d.recurrence.freq) spawnRecurringDemand(d);
  }).catch(err => alert('Erro ao mudar status: ' + errMsg(err)));
}

    dataAtendimento: d.startedAt ? d.startedAt.toDate().toISOString() : '',
    dataConclusao: d.completedAt ? d.completedAt.toDate().toISOString() : ''
  }));
  const blob = new Blob([JSON.stringify({ exportadoEm: new Date().toISOString(), demandas: data }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `demandas-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function dateInputValue(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function showDemandReportModal(){
  const root = document.getElementById('modalRoot');
  const hoje = new Date();
  root.innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal" style="max-width:420px;">
        <h3>Relatório de demandas</h3>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
          <button type="button" class="btn" data-quick="hoje">Hoje</button>
          <button type="button" class="btn" data-quick="semana">Esta semana</button>
          <button type="button" class="btn" data-quick="mes">Este mês</button>
          <button type="button" class="btn" data-quick="mesant">Mês anterior</button>
          <button type="button" class="btn" data-quick="tudo">Tudo</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
          <label style="flex:1;min-width:130px;font-size:12px;color:var(--ink-soft);">De<input id="repDe" type="date" /></label>
          <label style="flex:1;min-width:130px;font-size:12px;color:var(--ink-soft);">Até<input id="repAte" type="date" /></label>
        </div>
        <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Considerar a data de
          <select id="repBase" class="f-input"><option value="conclusao">Conclusão</option><option value="criacao">Criação</option></select></label>
        <label style="display:block;font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Situação
          <select id="repStatus" class="f-input"><option value="concluida">Concluídas</option><option value="todas">Todas</option><option value="abertas">Em aberto (abertas e em andamento)</option></select></label>
        <div class="login-error" id="repErr"></div>
        <div id="repCount" style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;"></div>
        <div class="actions">
          <button class="cancel" id="repCancel">Fechar</button>
          <button class="cancel" id="repXls">Exportar Excel</button>
          <button class="confirm" id="repPrint">Imprimir</button>
        </div>
      </div>
    </div>`;
  const $ = id => document.getElementById(id);
  const setRange = (a, b) => { $('repDe').value = dateInputValue(a); $('repAte').value = dateInputValue(b); update(); };
  const quick = {
    hoje: () => setRange(hoje, hoje),
    semana: () => { const i = new Date(hoje); i.setDate(hoje.getDate() - ((hoje.getDay() + 6) % 7)); setRange(i, hoje); },
    mes: () => setRange(new Date(hoje.getFullYear(), hoje.getMonth(), 1), hoje),
    mesant: () => setRange(new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1), new Date(hoje.getFullYear(), hoje.getMonth(), 0)),
    tudo: () => setRange(new Date(2020, 0, 1), hoje)
  };
  const lista = () => {
    const de = $('repDe').value, ate = $('repAte').value;
    if(!de || !ate) return { erro: 'Escolha as duas datas.' };
    const ini = new Date(de + 'T00:00:00').getTime(), fim = new Date(ate + 'T23:59:59.999').getTime();
    if(ini > fim) return { erro: 'A data inicial é depois da final.' };
    const base = $('repBase').value, st = $('repStatus').value;
    const itens = myDemands.filter(d => {
      if(st === 'concluida' && d.status !== 'concluida') return false;
      if(st === 'abertas' && !(d.status === 'aberta' || d.status === 'em_andamento')) return false;
      const t = base === 'conclusao' ? (d.completedAt ? d.completedAt.toMillis() : null) : (d.createdAt ? d.createdAt.toMillis() : null);
      return t !== null && t >= ini && t <= fim;
    }).sort((a, b) => {
      const ka = base === 'conclusao' ? (a.completedAt ? a.completedAt.toMillis() : 0) : (a.createdAt ? a.createdAt.toMillis() : 0);
      const kb = base === 'conclusao' ? (b.completedAt ? b.completedAt.toMillis() : 0) : (b.createdAt ? b.createdAt.toMillis() : 0);
      return ka - kb;
    });
    return { itens, de, ate, base, st };
  };
  const update = () => {
    const r = lista();
    $('repErr').textContent = r.erro || '';
    $('repCount').textContent = r.erro ? '' : `${r.itens.length} demanda(s) no período.`;
  };
  ['repDe', 'repAte', 'repBase', 'repStatus'].forEach(id => { $(id).onchange = update; });
  root.querySelectorAll('[data-quick]').forEach(b => { b.onclick = () => quick[b.getAttribute('data-quick')](); });
  quick.mes();
  const close = () => { root.innerHTML = ''; };
  $('repCancel').onclick = close;
  $('modalBg').onclick = e => { if(e.target.id === 'modalBg') close(); };
  const fmt = t => t ? t.toDate().toLocaleDateString('pt-BR') : '—';
  const br = s => s.split('-').reverse().join('/');
  const tituloRel = r => ({ concluida: 'Demandas concluídas', todas: 'Demandas', abertas: 'Demandas em aberto' }[r.st]) + ' — ' + br(r.de) + ' a ' + br(r.ate);
  $('repPrint').onclick = () => {
    const r = lista(); if(r.erro){ $('repErr').textContent = r.erro; return; }
    if(!r.itens.length){ $('repErr').textContent = 'Nenhuma demanda nesse período.'; return; }
    const resumo = {}; r.itens.forEach(d => { resumo[d.status] = (resumo[d.status] || 0) + 1; });
    const linhas = r.itens.map(d => `<tr>
      <td>${escapeHtml(d.title)}</td><td>${escapeHtml(d.createdByName || '—')}</td><td>${escapeHtml((d.assignedToNames || []).join(', '))}</td>
      <td>${escapeHtml(statusLabel(d.status))}</td><td>${fmt(d.createdAt)}</td><td>${d.deadline ? escapeHtml(formatDeadline(d.deadline)) : '—'}</td>
      <td>${fmt(d.startedAt)}</td><td>${fmt(d.completedAt)}</td><td>${escapeHtml(d.description || '')}</td></tr>`).join('');
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(tituloRel(r))}</title>
    <style>@page{size:A4 landscape;margin:12mm;}body{font-family:Arial,sans-serif;color:#222;margin:0;}h1{font-size:17px;margin:0 0 4px;}
    .sub{font-size:12px;color:#555;margin-bottom:10px;}table{width:100%;border-collapse:collapse;}
    th,td{border:1px solid #ccc;padding:5px 7px;font-size:11px;text-align:left;vertical-align:top;}th{background:#eee;}tr{page-break-inside:avoid;}</style></head><body>
    <h1>D Coração Home · ${escapeHtml(tituloRel(r))}</h1>
    <div class="sub">Pela data de ${r.base === 'conclusao' ? 'conclusão' : 'criação'} · ${r.itens.length} demanda(s) · ${Object.keys(resumo).map(k => escapeHtml(statusLabel(k)) + ': ' + resumo[k]).join(' · ')} · emitido em ${new Date().toLocaleDateString('pt-BR')}</div>
    <table><thead><tr><th>Título</th><th>Solicitante</th><th>Responsável</th><th>Situação</th><th>Criada</th><th>Prazo</th><th>Atendimento</th><th>Conclusão</th><th>Descrição</th></tr></thead><tbody>${linhas}</tbody></table>
    </body></html>`;
    const w = window.open('', '_blank');
    if(!w){ $('repErr').textContent = 'Permita pop-ups para imprimir.'; return; }
    w.document.write(html); w.document.close(); w.onload = () => w.print();
  };
  $('repXls').onclick = () => {
    const r = lista(); if(r.erro){ $('repErr').textContent = r.erro; return; }
    if(!r.itens.length){ $('repErr').textContent = 'Nenhuma demanda nesse período.'; return; }
    loadSheetJS().then(() => {
      const rows = r.itens.map(d => ({
        'Título': d.title, 'Solicitante': d.createdByName || '', 'Responsável(is)': (d.assignedToNames || []).join(', '),
        'Situação': statusLabel(d.status), 'Criada em': d.createdAt ? d.createdAt.toDate().toLocaleDateString('pt-BR') : '',
        'Prazo': d.deadline ? formatDeadline(d.deadline) : '', 'Data de atendimento': d.startedAt ? d.startedAt.toDate().toLocaleDateString('pt-BR') : '',
        'Data de conclusão': d.completedAt ? d.completedAt.toDate().toLocaleDateString('pt-BR') : '', 'Descrição': d.description
      }));
      const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Demandas');
      XLSX.writeFile(wb, `demandas-${r.de}-a-${r.ate}.xlsx`);
    }).catch(e => { $('repErr').textContent = e.message; });
  };
}

function loadSheetJS(){
  return new Promise((resolve, reject) => {
    if(window.XLSX){ resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Não foi possível carregar a biblioteca de Excel (verifique a internet).'));
    document.head.appendChild(script);
  });
}

}

function showActivityModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal" style="max-width:440px;">
        <h3>Atividade recente</h3>
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
          <select id="filterUser" style="flex:1;min-width:140px;font-size:12px;padding:7px 8px;border:1px solid var(--line);background:var(--paper-dim);color:var(--ink);border-radius:8px;">
            <option value="">Todos os usuários</option>
          </select>
          <input type="date" id="filterDate" style="flex:1;min-width:140px;font-size:12px;padding:7px 8px;border:1px solid var(--line);background:var(--paper-dim);color:var(--ink);border-radius:8px;" />
        </div>
        <div id="activityList" style="max-height:320px;overflow-y:auto;font-size:12px;color:var(--ink);">Carregando…</div>
        <div class="actions"><button class="cancel" id="closeActivity">Fechar</button></div>
      </div>
    </div>`;
  document.getElementById('closeActivity').onclick = () => root.innerHTML = '';
  document.getElementById('modalBg').onclick = e => { if(e.target.id === 'modalBg') root.innerHTML = ''; };

  let allEntries = [];

  function renderList(){
    const list = document.getElementById('activityList');
    if(!list) return;
    const userFilter = document.getElementById('filterUser').value;
    const dateFilter = document.getElementById('filterDate').value;
    const filtered = allEntries.filter(a => {
      if(userFilter && a.actorEmail !== userFilter) return false;
      if(dateFilter && a.dateKey !== dateFilter) return false;
      return true;
    });
    if(!filtered.length){ list.innerHTML = '<div style="color:var(--ink-soft);">Nenhuma atividade encontrada.</div>'; return; }
    list.innerHTML = filtered.map(a => `
      <div style="padding:7px 0;border-bottom:1px solid var(--paper-dim);">
        <b>${escapeHtml(a.actorEmail || '?')}</b> ${escapeHtml(a.action || '')} <i>${escapeHtml(a.detail || '')}</i>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);">${a.when}</div>
      </div>`).join('');
  }

  db.collection('activity').orderBy('timestamp', 'desc').limit(100).get().then(snap => {
    if(snap.empty){
      document.getElementById('activityList').innerHTML = '<div style="color:var(--ink-soft);">Nenhuma atividade registrada ainda.</div>';
      return;
    }
    allEntries = snap.docs.map(d => {
      const a = d.data();
      const date = a.timestamp ? a.timestamp.toDate() : null;
      return {
        actorEmail: a.actorEmail || '?',
        action: a.action || '',
        detail: a.detail || '',
        when: date ? date.toLocaleString('pt-BR') : '—',
        dateKey: date ? date.toISOString().slice(0, 10) : ''
      };
    });
    const users = [...new Set(allEntries.map(a => a.actorEmail))].sort();
    const sel = document.getElementById('filterUser');
    users.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u; opt.textContent = u;
      sel.appendChild(opt);
    });
    sel.onchange = renderList;
    document.getElementById('filterDate').onchange = renderList;
    renderList();
  }).catch(err => {
    const list = document.getElementById('activityList');
    if(list) list.innerHTML = 'Erro ao carregar: ' + errMsg(err);
  });
}

function isCategoryRestricted(cat){
  return (cat.allowedUsers && cat.allowedUsers.length > 0) || (cat.allowedGroups && cat.allowedGroups.length > 0);
}

function restrictionSummary(cat){
  const nu = (cat.allowedUsers || []).length;
  const ng = (cat.allowedGroups || []).length;
  if(!nu && !ng) return 'Visível para todos os usuários logados';
  const onlyAdm = (cat.allowedUsers || []).includes(SO_ADMIN);
  if(onlyAdm && nu === 1 && !ng) return 'Só administradores';
  const parts = [];
  if(nu - (onlyAdm ? 1 : 0)) parts.push(`${nu - (onlyAdm ? 1 : 0)} usuário(s)`);
  if(ng) parts.push(`${ng} grupo(s)`);
  return 'Restrita a ' + parts.join(' e ');
}

const AV_COLORS = ['#e17076', '#5fb06a', '#e0973c', '#4f9bd9', '#9a7fe0', '#e46aa3', '#3fb3b5', '#ef8a5b', '#8a6449', '#5b7ff0'];
function avColor(key){
  let h = 0; const s = String(key || '');
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
function initials(name){
  const parts = String(name || '?').replace(/@.*/, '').trim().split(/[\s._-]+/).filter(Boolean);
  if(!parts.length) return '?';
  const a = Array.from(parts[0])[0] || '';
  const b = parts.length > 1 ? (Array.from(parts[parts.length - 1])[0] || '') : '';
  return (a + b).toUpperCase();
}
function avatarHtml(name, key, opts){

function tsMs(t){ return t && typeof t.toMillis === 'function' ? t.toMillis() : 0; }
function dayKey(d){ return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(d){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((today - x) / 86400000);
  if(diff === 0) return 'Hoje';
  if(diff === 1) return 'Ontem';
  if(diff > 1 && diff < 7){ const w = x.toLocaleDateString('pt-BR', { weekday: 'long' }); return w.charAt(0).toUpperCase() + w.slice(1); }
  return x.toLocaleDateString('pt-BR');
}
function hhmm(d){ return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function listTime(ms){
  if(!ms) return '';
  const d = new Date(ms);
  const lab = dayLabel(d);
  if(lab === 'Hoje') return hhmm(d);
  if(lab === 'Ontem') return 'Ontem';
  if((Date.now() - ms) < 7 * 86400000) return d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

  return String(escaped).replace(/(https?:\/\/[^\s<"']+)/g, u => {
    const clean = u.replace(/[.,;:!?)]+$/, '');
    return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>${u.slice(clean.length)}`;
  });
}
function onActivate(el, fn){
  el.addEventListener('click', e => {
    const inner = e.target.closest('button, a, input, select, textarea, label');
    if(inner && inner !== el && el.contains(inner)) return;
    fn(e);
  });
  el.addEventListener('keydown', e => {
    if((e.key === 'Enter' || e.key === ' ') && e.target === el){ e.preventDefault(); fn(e); }
  });
}
function addLongPress(el, fn){
  let t = null, sx = 0, sy = 0;
  el.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    t = setTimeout(() => { t = null; try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){} fn(); }, 480);
  }, { passive: true });
  const cancel = () => { if(t){ clearTimeout(t); t = null; } };
  el.addEventListener('touchmove', e => {
    if(!t) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if(Math.abs(x - sx) > 10 || Math.abs(y - sy) > 10) cancel();
  }, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
}
function captureInputs(ids){
  const st = { vals: {}, focus: null, sel: null };
  ids.forEach(id => { const el = byId(id); if(el) st.vals[id] = el.value; });
  const a = document.activeElement;
  if(a && ids.includes(a.id)){ st.focus = a.id; try{ st.sel = [a.selectionStart, a.selectionEnd]; }catch(e){} }
  return st;
}
function restoreInputs(st){
  Object.keys(st.vals).forEach(id => { const el = byId(id); if(el) el.value = st.vals[id]; });
  if(st.focus){
    const el = byId(st.focus);
    if(el){ el.focus({ preventScroll: true }); if(st.sel) try{ el.setSelectionRange(st.sel[0], st.sel[1]); }catch(e){} }
  }
}

function openMenu(anchor, items, opts){
  closeMenu(); closeEmojiPanel();
  opts = opts || {};
  const list = items.filter(Boolean);
  const m = document.createElement('div');
  m.className = 'pop-menu'; m.id = 'popMenu'; m.setAttribute('role', 'menu');
  let html = '';
  if(opts.reactions){
    html += `<div class="pop-react">${REACTION_EMOJIS.map(e => `<button data-emo="${e}" class="${opts.reactions.current === e ? 'on' : ''}" aria-label="Reagir com ${e}">${e}</button>`).join('')}</div>`;
  }
  html += list.map((it, i) => `<button class="pop-item${it.danger ? ' danger' : ''}" data-i="${i}" role="menuitem">${it.icon || ''}<span>${escapeHtml(it.label)}</span></button>`).join('');
  m.innerHTML = html;
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left = r.right - mw;
  if(left < 8) left = r.left;
  left = Math.max(8, Math.min(left, vw - mw - 8));
  let top = r.bottom + 6;
  if(top + mh > vh - 8) top = r.top - mh - 6;
  if(top < 8) top = Math.max(8, (vh - mh) / 2);
  m.style.left = left + 'px'; m.style.top = top + 'px';
  m.querySelectorAll('[data-i]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); const it = list[Number(b.getAttribute('data-i'))]; closeMenu(); if(it && it.action) it.action(); };
  });
  m.querySelectorAll('[data-emo]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); const emo = b.getAttribute('data-emo'); closeMenu(); opts.reactions.onPick(emo); };
  });
  menuOpenedAt = Date.now();
  setTimeout(() => document.addEventListener('pointerdown', menuOutside, true), 0);
  if(!isTouch){ const first = m.querySelector('.pop-item'); if(first) first.focus({ preventScroll: true }); }
}
function menuOutside(e){ const m = byId('popMenu'); if(m && !m.contains(e.target)) closeMenu(); }
function closeMenu(){
  const m = byId('popMenu'); if(m) m.remove();
  document.removeEventListener('pointerdown', menuOutside, true);
}

  const r = anchor.getBoundingClientRect();
  const ph = p.offsetHeight, pw = p.offsetWidth;
  p.style.top = Math.max(8, r.top - ph - 8) + 'px';
  p.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pw - 8)) + 'px';
  p.querySelectorAll('[data-e]').forEach(b => {
    b.onmousedown = e => e.preventDefault(); // não tira o foco do campo no PC
    b.onclick = () => { insertAtCursor(ta, b.getAttribute('data-e')); if(isMobile()) closeEmojiPanel(); else ta.focus(); };
  });
  setTimeout(() => document.addEventListener('pointerdown', emojiOutside, true), 0);
}
function emojiOutside(e){
  const p = byId('emojiPop');
  if(p && !p.contains(e.target) && !e.target.closest('#emojiBtn, #demandEmojiBtn')) closeEmojiPanel();
}
function closeEmojiPanel(){
  const p = byId('emojiPop'); if(p) p.remove();
  document.removeEventListener('pointerdown', emojiOutside, true);
}

// NAVEGAÇÃO ENTRE SEÇÕES / TELA DE DETALHE
// =====================================================================
function applyShell(){
  const app = byId('app'); if(!app) return;
  app.setAttribute('data-section', section);
  app.classList.toggle('main-open', !!mainOpen);
  document.querySelectorAll('#rail .rail-btn[data-section]').forEach(b => {
    const on = b.getAttribute('data-section') === section;
    b.classList.toggle('active', on);
    if(on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}

// abre a tela de detalhe (no celular cobre a lista e cria um passo no histórico p/ o "voltar")
function openMain(){
  if(isMobile() && !(history.state && history.state.dcMain)){
    try{ history.pushState({ dcMain: true }, ''); } catch(e){}
  }
  mainOpen = true;
  applyShell();
}

// botão voltar da tela de detalhe
function goBack(){
  closeMenu(); closeEmojiPanel();
  if(isMobile() && history.state && history.state.dcMain && !backPending){
    backPending = true;
    try{ history.back(); } catch(e){ backPending = false; }
  }
  closeMainView();
}

window.addEventListener('popstate', () => {
  closeMenu(); closeEmojiPanel();
  if(backPending){
    backPending = false;
    if(mainOpen && isMobile()){ try{ history.pushState({ dcMain: true }, ''); } catch(e){} }
    return;
  }
  if(mainOpen) closeMainView();
});

function closeMainView(){
  mainOpen = false;
  if(section === 'chats'){
    if(unsubMessages){ unsubMessages(); unsubMessages = null; }
    chatView = null; editingMsgId = null;
    renderConversationList();
    renderEmptyMain();
  } else if(section === 'demands'){
    if(unsubDemandUpdates){ unsubDemandUpdates(); unsubDemandUpdates = null; }
    demandView = null;
    renderDemandsList();
    renderEmptyMain();
  } else if(section === 'sheets'){
    renderSheets(true);
  } else if(section === 'admin'){
    renderAdminList();
  } else if(section === 'settings'){
    renderSettingsList();
  } else if(section === 'requisicao'){
    reqView = null;
    renderReqList();
    renderEmptyMain();
  }
  applyShell();
}

function goSection(s){
  closeMenu(); closeEmojiPanel();
  if(s === 'admin' && !isAdmin) s = 'sheets';
  const list = byId('sideList');
  if(s === section && (!isMobile() || !mainOpen) && list && list.childElementCount){
    // tocar de novo na seção atual: volta ao topo da lista
    list.scrollTo({ top: 0, behavior: 'smooth' });
    if(s === 'chats' && chatSidebarMode !== 'list'){ chatSidebarMode = 'list'; renderSection(); }
    return;
  }
  if(section === 'chats' && s !== 'chats' && unsubMessages){ unsubMessages(); unsubMessages = null; }
  if(section === 'demands' && s !== 'demands' && unsubDemandUpdates){ unsubDemandUpdates(); unsubDemandUpdates = null; }
  const changed = section !== s;
  section = s;
  mainOpen = false;
  if(isMobile()){ chatView = null; demandView = null; editingMsgId = null; if(s !== 'requisicao') reqView = null; }
  if(s === 'chats'){ chatSidebarMode = 'list'; ensureNotificationPermission(); }
  if(s === 'demands' && changed && getMyOverdueDemands().length) playAlertSound();
  renderSection();
  if(changed && byId('sideList')) byId('sideList').scrollTop = 0;
}

function renderSection(){
  closeMenu();
  buildSidebar();
  mainKey = '';
  if(section === 'sheets'){ sheetsSig = ''; renderSheets(true); }
  else if(section === 'chats'){ renderConversationList(); renderChatModal(); }
  else if(section === 'demands'){ renderDemandsList(); renderDemandModal(); }
  else if(section === 'admin'){ renderAdminList(); renderAdminMain(); }
  else if(section === 'settings'){ renderSettingsList(); renderSettingsMain(); }
  else if(section === 'requisicao'){ renderReqList(); renderReqMain(); }
  updateSheetsDot();
  updateInstallBanner();
  applyShell();
}

// chamado pelos "ouvintes" do Firebase sempre que algum dado muda
function render(){
  updateSheetsDot();
  if(!byId('sideList')) return;
  if(section === 'sheets') renderSheets(false);
  else if(section === 'chats') refreshChatsUI();
  else if(section === 'admin') renderAdminMain();

      byId('chatsMenuBtn').onclick = e => openMenu(e.currentTarget, [
        { label: 'Nova conversa', icon: newChatSvg, action: showNewConvPicker },

function sheetsSignature(){
  return JSON.stringify([isAdmin, myUid, activeId, searchQuery, mainOpen, isMobile(), myGroups, myFavorites, myPinnedCats, myLastSeenCat,
    categories.map(c => [c.id, c.name, c.order, c.allowedUsers, c.allowedGroups, c.links.map(l => [l.id, l.title, l.url, l.order, l.createdAtMillis])])]);
}
function renderSheets(force){
  if(section !== 'sheets' || !byId('sideList')) return;
  const sig = sheetsSignature();
  if(!force && sig === sheetsSig) return;
  sheetsSig = sig;
  renderSheetsList();
  renderSheetsMain();
  updateSheetsDot();
}
function sheetSelectedVisible(){ return !isMobile() || mainOpen; }
function updateSheetsDot(){
  const dot = byId('sheetsDot'); if(!dot) return;
  const any = myUid && getVisibleCategories().some(c => categoryHasNew(c) && !(section === 'sheets' && c.id === activeId && sheetSelectedVisible()));
  dot.classList.toggle('hidden', !any);
}
function getFavoriteEntries(){
  const out = [];
  getVisibleCategories().forEach(cat => cat.links.forEach(l => { if(myFavorites.includes(cat.id + '_' + l.id)) out.push({ cat, link: l }); }));
  return out;
}

function catRowHtml(cat){
  const sel = sheetSelectedVisible();
  const active = cat.id === activeId && sel && !searchQuery;
  const pinned = myPinnedCats.includes(cat.id);
  const hasNew = categoryHasNew(cat) && !(cat.id === activeId && sel);
  const last = cat.links.reduce((m, l) => (!m || l.createdAtMillis > m.createdAtMillis) ? l : m, null);
  const n = cat.links.length;
  const sub = n ? `${n} planilha${n > 1 ? 's' : ''} · última: ${last.title}` : 'Nenhuma planilha ainda';
  return `<div class="row${active ? ' active' : ''}${hasNew ? ' unread' : ''}" role="button" tabindex="0" data-open-cat="${escapeAttr(cat.id)}">
    ${avatarHtml(cat.name, cat.id, { cls: 'square' })}
    <div class="row-main">
      <div class="row-top">
        <span class="row-title">${isCategoryRestricted(cat) ? `<span class="row-lock" title="Aba restrita">${lockSvg}</span>` : ''}<span>${escapeHtml(cat.name)}</span></span>
        ${hasNew ? '<span class="row-time hot">novo</span>' : ''}
      </div>
      <div class="row-bottom">
        <span class="row-sub"><span class="sub-txt">${escapeHtml(sub)}</span></span>
        <span class="row-meta">
          <button class="mini-icon${pinned ? ' on' : ''}" data-pin="${escapeAttr(cat.id)}" title="${pinned ? 'Desfixar aba' : 'Fixar aba no topo'}" aria-label="${pinned ? 'Desfixar aba' : 'Fixar aba no topo'}">${pinned ? pinFilledSvg : pinOutlineSvg}</button>

function linkResultRowHtml(cat, link){
  const key = cat.id + '_' + link.id;
  const fav = myFavorites.includes(key);
  const t = linkType(link.url);
  return `<div class="row" role="button" tabindex="0" data-open-url="${escapeAttr(link.url)}">
    <div class="avatar square" style="--av:${t.color}">${t.icon}</div>
    <div class="row-main">
      <div class="row-top"><span class="row-title"><span>${escapeHtml(link.title)}</span></span></div>
      <div class="row-bottom">
        <span class="row-sub"><span class="sub-txt">${escapeHtml(cat.name)} · ${escapeHtml(t.label)}</span></span>
        <span class="row-meta">
          <button class="mini-icon on${fav ? ' fav-on' : ''}" data-fav="${escapeAttr(key)}" title="${fav ? 'Remover dos favoritos' : 'Marcar como favorito'}">${fav ? starFilledSvg : starOutlineSvg}</button>
          <button class="mini-icon on" data-copy="${escapeAttr(link.url)}" title="Copiar link">${copySvg}</button>
        </span>
      </div>
    </div>

}

function renderSheetsList(){
  const list = byId('sideList'); if(!list) return;
  const prevScroll = list.scrollTop;
  const visibleCats = getVisibleCategories();
  let html = '';
  if(searchQuery){
    const catHits = visibleCats.filter(c => c.name.toLowerCase().includes(searchQuery));
    const linkHits = [];
    visibleCats.forEach(cat => cat.links.forEach(l => { if(l.title.toLowerCase().includes(searchQuery)) linkHits.push({ cat, link: l }); }));
    if(catHits.length) html += `<div class="list-section">Abas</div>` + catHits.map(catRowHtml).join('');
    html += `<div class="list-section">Planilhas · ${linkHits.length} encontrada(s)</div>`;
    html += linkHits.length
      ? linkHits.map(r => linkResultRowHtml(r.cat, r.link)).join('')
      : `<div class="list-empty">Nenhuma planilha encontrada para "${escapeHtml(searchQuery)}".</div>`;
  } else {
    // abas fixadas primeiro (mesma regra de antes)
    const strip = [...visibleCats].sort((a, b) => {
      const aPin = myPinnedCats.includes(a.id), bPin = myPinnedCats.includes(b.id);
      if(aPin !== bPin) return aPin ? -1 : 1;
      return 0;
    });
    const favs = getFavoriteEntries();
    if(favs.length){
      const active = activeId === FAV_ID && sheetSelectedVisible();
      html += `<div class="row${active ? ' active' : ''}" role="button" tabindex="0" data-open-cat="${FAV_ID}">
        <div class="avatar square" style="--av:var(--star)">${starFilledSvg}</div>
        <div class="row-main">
          <div class="row-top"><span class="row-title"><span>Favoritos</span></span></div>
          <div class="row-bottom"><span class="row-sub"><span class="sub-txt">Planilhas marcadas com estrela</span></span><span class="row-meta"><span class="count-pill">${favs.length}</span></span></div>
        </div>
      </div>`;
    }
    html += strip.length
      ? strip.map(catRowHtml).join('')
      : `<div class="list-empty">${isAdmin ? 'Nenhuma aba criada ainda.<br>Toque em <b>nova aba</b> para começar.' : 'Nenhuma aba disponível ainda.'}</div>`;
  }
  list.innerHTML = html;

  list.querySelectorAll('[data-open-cat]').forEach(row => onActivate(row, () => openCategory(row.getAttribute('data-open-cat'))));
  list.querySelectorAll('[data-open-url]').forEach(row => onActivate(row, () => window.open(row.getAttribute('data-open-url'), '_blank', 'noopener')));
  list.querySelectorAll('[data-pin]').forEach(b => { b.onclick = e => { e.stopPropagation(); togglePinCategory(b.getAttribute('data-pin')); }; });
  list.querySelectorAll('[data-fav]').forEach(b => {
    b.onclick = e => { e.stopPropagation(); const [catId, linkId] = b.getAttribute('data-fav').split('_'); toggleFavorite(catId, linkId); };
  });
  list.querySelectorAll('[data-copy]').forEach(b => { b.onclick = e => { e.stopPropagation(); copyLinkToClipboard(b.getAttribute('data-copy'), b); }; });
  list.scrollTop = prevScroll;
}

function openCategory(id){
  if(id !== FAV_ID){ sheetPrevSeen[id] = myLastSeenCat[id] || 0; markCategorySeen(id); }
  activeId = id;
  if(searchQuery){
    searchQuery = '';
    const s = byId('searchInput'); if(s) s.value = '';
  }
  openMain();
  renderSheets(true);
  const body = byId('linksScroll'); if(body) body.scrollTop = 0;
}

function bindLinkCards(scope, cat){
  scope.querySelectorAll('[data-fav]').forEach(btn => {
    btn.onclick = () => { const [catId, linkId] = btn.getAttribute('data-fav').split('_'); toggleFavorite(catId, linkId); };
  });
  scope.querySelectorAll('[data-copy]').forEach(btn => { btn.onclick = () => copyLinkToClipboard(btn.getAttribute('data-copy'), btn); });
  if(!cat) return;
  scope.querySelectorAll('[data-linkmenu]').forEach(btn => {
    btn.onclick = () => {
      const link = cat.links.find(l => l.id === btn.getAttribute('data-linkmenu'));

      openMenu(btn, [
        { label: 'Abrir', icon: externalSvg, action: () => window.open(link.url, '_blank', 'noopener') },
        { label: 'Editar link', icon: editSvg, action: () => showEditLinkModal(cat, link) },

        { label: 'Mover para baixo', icon: downSvg, action: () => moveLink(cat.id, link.id, 1) },

  });

  if(!visibleCats.length){ renderEmptyMain(); return; }
  const cat = visibleCats.find(c => c.id === activeId) || visibleCats[0];
  activeId = cat.id;
  const sameCat = mainKey === 'sheets:' + cat.id;
  const keep = sameCat ? captureInputs(['linkTitle', 'linkUrl']) : { vals: {} };
  const scrollKeep = sameCat && byId('linksScroll') ? byId('linksScroll').scrollTop : 0;
  const idx = visibleCats.indexOf(cat) + 1;
  const pinned = myPinnedCats.includes(cat.id);
  const sortedLinks = [...cat.links].sort((a, b) => {
    const aFav = myFavorites.includes(cat.id + '_' + a.id);
    const bFav = myFavorites.includes(cat.id + '_' + b.id);
    if(aFav !== bFav) return aFav ? -1 : 1;
    return a.order - b.order;
  });
  const prevSeen = sheetPrevSeen[cat.id] || 0;
  const n = cat.links.length;
  const sub = `${n} planilha${n === 1 ? '' : 's'} · ABA ${String(idx).padStart(2, '0')}${isAdmin ? ' · ' + restrictionSummary(cat) : ''}`;
  main.innerHTML = `
    <div class="pane-head">
      <button class="head-btn back-btn" id="mainBackBtn" title="Voltar" aria-label="Voltar">${backSvg}</button>
      ${avatarHtml(cat.name, cat.id, { cls: 'square sm' })}
      <div class="pane-titles">

// =====================================================================
// CONVERSAS
// =====================================================================
function convOther(c){
  const otherUid = (c.participants || []).find(p => p !== myUid) || myUid;
  const u = allUsers.find(x => x.uid === otherUid);
  return { otherUid, u, name: displayNameFor(u) };
}
function convUnread(c){ return (c.unread && c.unread[myUid]) || 0; }
function isTypingTs(t){ return !!(t && typeof t.toMillis === 'function' && (Date.now() - t.toMillis() < 4000)); }

function refreshChatsUI(){
  if(section !== 'chats') return;
  renderConversationList();
  if(chatView && chatView.type === 'thread' && mainKey === 'thread:' + chatView.convId) renderThreadHeader();
}

function renderChatChips(){
  const box = byId('sideChips'); if(!box) return;
  const active = myConversations.filter(c => !(c.archived && c.archived[myUid]));
  const nUnread = active.filter(c => convUnread(c)).length;
  const nArch = myConversations.length - active.length;
  const chips = [['all', 'Tudo'], ['unread', 'Não lidas' + (nUnread ? ' · ' + nUnread : '')], ['muted', 'Silenciadas'], ['archived', 'Arquivadas' + (nArch ? ' · ' + nArch : '')]];
  box.innerHTML = chips.map(([k, l]) => `<button class="chip${convFilter === k ? ' on' : ''}" data-chip="${k}">${escapeHtml(l)}</button>`).join('');
  box.querySelectorAll('[data-chip]').forEach(b => {
    b.onclick = () => { convFilter = b.getAttribute('data-chip'); showArchivedConvs = convFilter === 'archived'; renderConversationList(); };
  });
}

function renderConversationList(){
  if(section !== 'chats') return;
  const list = byId('sideList'); if(!list) return;
  const prevScroll = list.scrollTop;
  if(chatSidebarMode === 'new'){ renderContactPicker(list); return; }
  renderChatChips();
  const q = convSearchQuery.trim().toLowerCase();
  let anyTyping = false;
  const filtered = myConversations.filter(c => {
    const archived = c.archived && c.archived[myUid];
    const muted = c.muted && c.muted[myUid];
    if(convFilter === 'archived'){ if(!archived) return false; }
    else {
      if(archived) return false;
      if(convFilter === 'unread' && !convUnread(c)) return false;
      if(convFilter === 'muted' && !muted) return false;
    }
    if(q){
      const o = convOther(c);
      const hay = (o.name + ' ' + ((o.u && o.u.email) || '') + ' ' + (c.lastMessage || '')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(!filtered.length){
    const msg = q ? 'Nenhuma conversa encontrada.'
      : ({ archived: 'Nenhuma conversa arquivada.', unread: 'Nenhuma conversa não lida. 🎉', muted: 'Nenhuma conversa silenciada.' }[convFilter]
        || 'Nenhuma conversa ainda.<br>Toque em <b>nova conversa</b> para começar.');
    list.innerHTML = `<div class="list-empty">${msg}</div>`;
  } else {
    list.innerHTML = filtered.map(c => {
      const o = convOther(c);
      const presence = presenceLabel(o.u);
      const unread = convUnread(c);
      const muted = c.muted && c.muted[myUid];
      const typing = isTypingTs(c.typing && c.typing[o.otherUid]);
      if(typing) anyTyping = true;
      const lastMs = tsMs(c.lastMessageAt);
      const mineLast = c.lastSenderUid === myUid;
      const read = mineLast && lastMs && tsMs(c.lastReadAt && c.lastReadAt[o.otherUid]) >= lastMs;
      const ticks = mineLast ? `<span class="ticks${read ? ' read' : ''}">${read ? doubleCheckSvg : singleCheckSvg}</span>` : '';
      const active = chatView && chatView.type === 'thread' && chatView.convId === c.id && (!isMobile() || mainOpen);
      return `<div class="row${active ? ' active' : ''}${unread ? ' unread' : ''}" role="button" tabindex="0" data-open-conv="${escapeAttr(c.id)}" data-other-uid="${escapeAttr(o.otherUid)}">
        ${avatarHtml(o.name, o.otherUid, { online: presence === 'online' })}
        <div class="row-main">
          <div class="row-top"><span class="row-title"><span>${escapeHtml(o.name)}</span></span><span class="row-time${unread && !muted ? ' hot' : ''}">${escapeHtml(listTime(lastMs))}</span></div>
          <div class="row-bottom">
            <span class="row-sub${typing ? ' typing' : ''}">${typing ? 'digitando…' : `${ticks}<span class="sub-txt">${mineLast ? 'Você: ' : ''}${escapeHtml(c.lastMessage || '')}</span>`}</span>
            <span class="row-meta">${muted ? bellOffSvg : ''}${unread ? `<span class="count-badge${muted ? ' muted' : ''}">${unread > 99 ? '99+' : unread}</span>` : ''}</span>
          </div>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-open-conv]').forEach(row => onActivate(row, () => openThread(row.getAttribute('data-other-uid'), row.getAttribute('data-open-conv'))));
  }
  list.scrollTop = prevScroll;
  clearTimeout(listTypingTimer);
  if(anyTyping) listTypingTimer = setTimeout(renderConversationList, 4200);
}

function renderContactPicker(list){
  const q = ((byId('contactSearch') || {}).value || '').trim().toLowerCase();
  const others = allUsers.filter(u => u.uid !== myUid && !u.blocked)
    .filter(u => !q || (displayNameFor(u) + ' ' + u.email).toLowerCase().includes(q))
    .sort((a, b) => ((b.online === true) - (a.online === true)) || displayNameFor(a).toLowerCase().localeCompare(displayNameFor(b).toLowerCase()));
  if(!others.length){
    list.innerHTML = `<div class="list-empty">${q ? 'Ninguém encontrado.' : 'Nenhum outro usuário disponível.'}</div>`;
    return;
  }
  list.innerHTML = `<div class="list-section">Pessoas da equipe · ${others.length}</div>` + others.map(u => {
    const name = displayNameFor(u);
    const presence = presenceLabel(u);
    return `<div class="row" role="button" tabindex="0" data-pick-uid="${escapeAttr(u.uid)}">
      ${avatarHtml(name, u.uid, { online: presence === 'online' })}
      <div class="row-main">
        <div class="row-top"><span class="row-title"><span>${escapeHtml(name)}</span></span></div>
        <div class="row-bottom"><span class="row-sub${presence === 'online' ? ' online-txt' : ''}"><span class="sub-txt">${escapeHtml(presence || (name !== u.email ? u.email : ''))}</span></span></div>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-pick-uid]').forEach(row => onActivate(row, () => openThread(row.getAttribute('data-pick-uid'))));
}

function openThreadByConv(convId){

function openThread(otherUid, convId){
  if(!otherUid) return;
  const cid = convId || getConvId(myUid, otherUid);
  if(section !== 'chats') goSection('chats');
  else if(chatSidebarMode !== 'list'){ chatSidebarMode = 'list'; buildSidebar(); }
  if(!(chatView && chatView.type === 'thread' && chatView.convId === cid)){
    if(unsubMessages){ unsubMessages(); unsubMessages = null; }
    editingMsgId = null;
  }
  const u = allUsers.find(x => x.uid === otherUid);
  chatView = { type: 'thread', convId: cid, otherUid, otherName: displayNameFor(u) };
  openMain();
  renderChatModal();
}

// mantém o nome antigo: várias funções (silenciar, excluir conversa...) chamam renderChatModal()
function renderChatModal(){
  if(section !== 'chats') return;
  renderConversationList();
  const main = byId('mainPane'); if(!main) return;
  if(!chatView || chatView.type !== 'thread'){
    if(unsubMessages){ unsubMessages(); unsubMessages = null; }
    if(mainOpen && isMobile()){ goBack(); return; }
    mainOpen = false; applyShell();
    renderEmptyMain();
    return;
  }
  if(!chatView.otherUid){
    const c = myConversations.find(x => x.id === chatView.convId);
    chatView.otherUid = c ? ((c.participants || []).find(p => p !== myUid) || myUid) : null;
    if(!chatView.otherUid){ chatView = null; renderChatModal(); return; }
  }
  const key = 'thread:' + chatView.convId;
  if(mainKey === key && byId('msgThread')){ renderThreadHeader(); updateThreadDocUI(); return; }

  main.innerHTML = `
    <div class="pane-head" id="threadHead"></div>
    <div class="thread-search hidden" id="searchBar">${searchIconSvg}<input id="searchMsgInput" type="search" placeholder="Buscar nesta conversa…" autocomplete="off" /><button class="head-btn" id="closeSearchBtn" title="Fechar busca" aria-label="Fechar busca">${xSvg}</button></div>
    <div class="pane-body wallpaper" id="msgScroll"><div class="thread" id="msgThread"><div class="thread-hint">Carregando mensagens…</div></div></div>
    <div class="edit-bar hidden" id="editBar"><div class="edit-bar-txt"><b>Editando mensagem</b><span id="editBarPreview"></span></div><button class="head-btn" id="cancelEditBtn" title="Cancelar edição" aria-label="Cancelar edição">${xSvg}</button></div>
    <div class="composer">
      <button class="head-btn composer-btn" id="emojiBtn" type="button" title="Emojis" aria-label="Emojis">${smileSvg}</button>
      <textarea id="msgInput" rows="1" placeholder="Digite uma mensagem" enterkeyhint="${isTouch ? 'enter' : 'send'}" aria-label="Mensagem"></textarea>
      <button class="send-btn" id="sendMsgBtn" type="button" title="Enviar" aria-label="Enviar">${sendSvg}</button>
    </div>`;
  mainKey = key;
  renderThreadHeader();

  byId('closeSearchBtn').onclick = toggleThreadSearch;
  byId('searchMsgInput').oninput = e => filterThreadMessages(e.target.value);
  byId('cancelEditBtn').onclick = cancelEdit;
  const input = byId('msgInput');
  const send = () => {
    const text = input.value;
    if(!text.trim()) return;
    if(editingMsgId){ editMessage(chatView.convId, editingMsgId, text); cancelEdit(); }
    else sendMessage(chatView.convId, chatView.otherUid, text);
    input.value = ''; autoGrow(input);
    input.focus();
  };
  byId('sendMsgBtn').onclick = send;
  byId('emojiBtn').onclick = e => openEmojiPanel(e.currentTarget, input);
  input.onkeydown = e => {
    // PC: Enter envia (Shift+Enter pula linha). Celular: Enter pula linha e o botão envia (igual WhatsApp)
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && !isTouch){ e.preventDefault(); send(); }
    else if(e.key === 'Escape' && editingMsgId){ cancelEdit(); }
  };
  input.oninput = () => {
    autoGrow(input);
    if(editingMsgId || !input.value.trim()) return;
    // "digitando…" só em conversa que já existe (antes criava um documento de conversa incompleto)
    if(!myConversations.some(c => c.id === chatView.convId)) return;
    const now = Date.now();
    if(now - lastTypingWrite > 2000){
      lastTypingWrite = now;
      db.collection('conversations').doc(chatView.convId).set({
        typing: { [myUid]: firebase.firestore.FieldValue.serverTimestamp() }
      }, { merge: true }).catch(() => {});
    }
  };

  const conv = myConversations.find(c => c.id === chatView.convId);
  messagesListenFailed = null;
  if(conv && !conv._pending) listenMessages(chatView.convId);
  else if(!conv) byId('msgThread').innerHTML = `<div class="thread-hint">Nenhuma mensagem ainda.<br>Diga um oi para <b>${escapeHtml(chatView.otherName)}</b>! 👋</div>`;
  autoMarkOpenThreadRead();
  updateThreadDocUI();
  if(!isMobile()) input.focus();
}

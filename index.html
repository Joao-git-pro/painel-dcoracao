<title>Painel de Planilhas</title>
<!-- ===================================================================
  CONFIGURAÇÃO NECESSÁRIA ANTES DE USAR:
  1) Crie um projeto gratuito em https://console.firebase.google.com
  2) Ative "Authentication" > método "E-mail/senha"
  3) Ative "Firestore Database" (modo produção)
  4) Cole as regras de segurança fornecidas no guia
  5) Cole a configuração do seu projeto no objeto firebaseConfig abaixo
  6) Crie o(s) usuário(s) em Authentication > Users
  7) No Firestore, crie a coleção "admins" e um documento cujo ID seja
     o UID do usuário administrador (veja o guia para o passo a passo)

  VISUAL (v2): layout de mensageiro — barra de seções + lista + painel.
  No PC: barra lateral à esquerda. No celular: barra inferior e a tela de
  detalhe abre por cima da lista (o "voltar" do Android também funciona).
  Estilos: D Coração, WhatsApp, Telegram, Teams, Messenger e Discord
  (Ajustes > Aparência). A escolha fica salva só no aparelho (localStorage);
  nada novo é gravado no Firestore, então as regras de segurança NÃO mudam.
=================================================================== -->

<script>
  // aplica o tema antes de desenhar a página (evita "piscar" a cor errada)
  (function(){
    var skins = ['dcoracao','whatsapp','telegram','teams','messenger','discord'];
    var s = 'dcoracao', m = 'auto';
    try{ s = localStorage.getItem('dc_skin') || 'dcoracao'; m = localStorage.getItem('dc_mode') || 'auto'; }catch(e){}
    if(skins.indexOf(s) < 0) s = 'dcoracao';
    var dark = m === 'dark' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-skin', s);
    document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
  })();
</script>

  /* =================================================================
     BASE
     ================================================================= */
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; min-height:100vh;
  }
  button{font-family:inherit; color:inherit;}
  input, select, textarea{font-family:inherit; color:var(--ink);}
  .hidden{display:none !important;}
  svg{flex-shrink:0;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{overscroll-behavior-y:none;}
  button, a, .row, .chip, .rail-btn{touch-action:manipulation;}

  /* ---------- Login ---------- */
  .login-box{
    background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.08); padding:30px 26px 26px; max-width:360px; width:calc(100% - 32px); margin:10vh auto 40px;
  }
  .login-box h1{font-size:20px; color:var(--ink); font-weight:700; margin:0 0 2px;}
  .login-box .sub{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
  .login-box input[type="email"], .login-box input[type="password"]{
    width:100%; font-size:15px; padding:11px 13px; border:1px solid var(--line); background:var(--input-bg); color:var(--ink);
    margin-bottom:12px; border-radius:10px; outline:none;
  }
  .login-box input:focus{border-color:var(--accent);}
  .login-box .remember{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); margin:2px 0 16px; cursor:pointer;}
  .login-box .remember input{width:16px; height:16px; margin:0; accent-color:var(--accent);}
  .login-box button{
    width:100%; font-weight:700; font-size:15px; background:var(--accent); color:var(--accent-ink);
    border:none; padding:12px; cursor:pointer; border-radius:10px; transition:opacity .15s;
  }
  .login-box button:hover{opacity:.9;}
  .login-error{color:var(--danger); font-size:12.5px; margin-top:8px; min-height:14px;}

  /* =================================================================
     ESTRUTURA DO APP: rail | lista | painel
     ================================================================= */
  #app{
    position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh;
    display:grid; grid-template-columns:var(--rail-w) var(--side-w) minmax(0,1fr); grid-template-rows:minmax(0,1fr);
    overflow:hidden; background:var(--bg);
  }

  /* ---------- Barra de seções (rail) ---------- */
  .rail{
    grid-column:1; grid-row:1; background:var(--rail-bg); display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:12px 0 12px; border-right:1px solid var(--line); overflow-y:auto; scrollbar-width:none; z-index:2;
  }
  .rail::-webkit-scrollbar{display:none;}
  .rail-logo img{width:44px; height:44px; border-radius:12px; display:block; margin:0 0 12px; object-fit:cover;}
  .rail-btn{
    position:relative; width:72px; background:none; border:0; cursor:pointer; color:var(--rail-fg);
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border-radius:12px; outline:none;
  }
  .rail-btn:focus-visible .rail-ico{box-shadow:0 0 0 2px var(--accent);}
  .rail-ico{
    position:relative; width:46px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:18px;
    transition:background .15s, border-radius .2s, color .15s;
  }
  .rail-ico svg{width:22px; height:22px;}
  .rail-label{font-size:10.5px; font-weight:600; letter-spacing:.01em; display:var(--label-display, block);}
  .rail-btn:hover .rail-ico{background:var(--rail-active-bg);}
  .rail-btn.active{color:var(--rail-fg-active);}
  .rail-btn.active .rail-ico{background:var(--rail-active-bg);}
  .rail-btn.active::before{
    content:''; position:absolute; left:0; top:12px; width:3px; height:24px; border-radius:0 3px 3px 0; background:var(--rail-indicator);
  }
  .rail-badge{
    position:absolute; top:-4px; right:-3px; min-width:19px; height:19px; padding:0 5px; border-radius:10px;
    background:var(--badge-bg); color:var(--badge-ink); font-size:10.5px; font-weight:800; line-height:15px; text-align:center;
    border:2px solid var(--rail-bg);
  }
  .rail-dot{position:absolute; top:4px; right:7px; width:10px; height:10px; border-radius:50%; background:var(--badge-bg); border:2px solid var(--rail-bg);}
  .rail-spacer{flex:1;}
  .rail-avatar{
    width:34px; height:34px; border-radius:50%; background:var(--av, #8a6449); color:#fff; font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center; letter-spacing:.02em;
  }
  .rail-btn.active .rail-ico.rail-me{background:transparent;}
  .rail-btn.active .rail-avatar{box-shadow:0 0 0 2px var(--rail-bg), 0 0 0 4px var(--rail-fg-active);}

  /* Discord: ícones redondos que viram "quadradinho" quando ativos */
  html[data-skin="discord"] .rail-ico{width:48px; height:48px; border-radius:50%; background:var(--surface);}
  html[data-skin="discord"] .rail-btn:hover .rail-ico,
  html[data-skin="discord"] .rail-btn.active .rail-ico{border-radius:16px; background:var(--accent); color:#fff;}
  html[data-skin="discord"] .rail-btn.active .rail-ico.rail-me{background:transparent;}
  html[data-skin="discord"] .rail-btn.active::before{top:12px; width:4px; height:40px;}
  html[data-skin="discord"] .rail-btn{gap:0;}
  /* Teams: só a barrinha roxa e o ícone colorido */
  html[data-skin="teams"] .rail-btn:hover .rail-ico{background:transparent; color:var(--accent);}
  html[data-skin="teams"] .rail-btn.active::before{top:8px; height:44px;}

  /* ---------- Lista (coluna do meio) ---------- */
  .sidebar{
    grid-column:2; grid-row:1; background:var(--side-bg); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-width:0; min-height:0; position:relative;
  }
  .side-head{display:flex; align-items:center; gap:4px; padding:12px 10px 6px 18px; min-height:62px; flex-shrink:0;}
  .side-head h1{font-size:21px; font-weight:800; margin:0; flex:1; letter-spacing:-.01em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .side-head .side-back{margin-left:-10px;}
  .side-tools{padding:2px 12px 6px; flex-shrink:0;}
  .side-tools:empty{display:none;}
  .search-box{
    display:flex; align-items:center; gap:10px; background:var(--input-bg); border-radius:10px; padding:0 12px; height:38px;
    border:1px solid transparent; cursor:text;
  }
  .search-box:focus-within{border-color:var(--accent); background:var(--surface);}
  .search-box svg{width:16px; height:16px; color:var(--ink-soft);}
  .search-box input{flex:1; border:0; outline:0; background:transparent; font-size:14px; min-width:0; height:100%;}
  .search-box input::-webkit-search-decoration{-webkit-appearance:none;}
  .search-box.sm{height:34px; margin-bottom:8px;}
  .chips{display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none; align-items:center;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-size:12.5px; font-weight:600;
    padding:5px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:5px;
  }
  .chip svg{width:13px; height:13px;}
  .chip:hover{border-color:var(--accent);}
  .chip.on{background:var(--accent-soft); color:var(--accent-strong); border-color:transparent;}
  .side-list{flex:1; overflow-y:auto; min-height:0; padding:2px 0 90px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; overscroll-behavior:contain;}
  .list-section{font-size:11.5px; font-weight:800; color:var(--accent-strong); text-transform:uppercase; letter-spacing:.06em; padding:14px 20px 6px;}
  .list-empty{padding:30px 24px; text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.55;}
  .side-foot-note{font-size:11.5px; color:var(--ink-soft); padding:18px 22px 8px; line-height:1.5; text-align:center;}

  .row{
    display:flex; align-items:center; gap:12px; padding:9px 12px; margin:1px 6px; border-radius:10px;
    cursor:pointer; position:relative; outline:none; color:var(--ink);
  }
  .row:hover{background:var(--row-hover);}
  .row.active{background:var(--row-active);}
  .row:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);}
  .row-main{flex:1; min-width:0;}
  .row-top, .row-bottom{display:flex; align-items:center; gap:6px; min-width:0;}
  .row-title{flex:1; min-width:0; font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px;}
  .row-title > span:last-child{overflow:hidden; text-overflow:ellipsis;}
  .row-time{font-size:11.5px; color:var(--ink-soft); flex-shrink:0;}
  .row-time.hot{color:var(--badge-bg); font-weight:700;}
  .row-sub{flex:1; min-width:0; font-size:13px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; display:flex; align-items:center; gap:3px;}
  .row-sub .sub-txt{overflow:hidden; text-overflow:ellipsis;}
  .row-sub.typing{color:var(--accent-strong); font-style:italic;}
  .row-sub.online-txt{color:var(--online);}
  .row.unread .row-title{font-weight:700;}
  .row.unread .row-sub{color:var(--ink);}
  .row-meta{display:flex; align-items:center; gap:4px; flex-shrink:0; color:var(--ink-soft);}
  .row-meta > svg{width:15px; height:15px;}
  .row-lock{display:inline-flex; color:var(--ink-soft);}
  .row-star{display:inline-flex; color:var(--star);}
  .row-star svg{width:13px; height:13px;}
  .row-tags{display:flex; gap:5px; margin-top:5px; flex-wrap:wrap;}
  .row-ico{
    width:42px; height:42px; border-radius:12px; background:var(--accent-soft); color:var(--accent-strong);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .row-ico svg{width:20px; height:20px;}
  .row-ico.danger{background:rgba(193,80,61,.12); color:var(--danger);}
  .count-badge{
    min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--badge-bg); color:var(--badge-ink);
    font-size:11.5px; font-weight:800; display:inline-flex; align-items:center; justify-content:center;
  }
  .count-badge.muted{background:var(--ink-soft); color:var(--side-bg);}
  .count-badge.dot{min-width:10px; width:10px; height:10px; padding:0;}
  .count-pill{min-width:22px; height:20px; padding:0 7px; border-radius:10px; background:var(--surface-2); color:var(--ink-soft); font-size:11.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center;}
  .mini-icon{
    width:26px; height:26px; border:0; background:none; border-radius:50%; cursor:pointer; color:var(--ink-soft);
    display:inline-flex; align-items:center; justify-content:center; padding:0; opacity:0; transition:opacity .12s;
  }
  .mini-icon svg{width:14px !important; height:14px !important;}
  .mini-icon:hover{background:var(--surface-2); color:var(--ink);}
  .mini-icon.on, .row:hover .mini-icon, .row:focus-within .mini-icon{opacity:1;}
  .mini-icon.fav-on{color:var(--star); opacity:1;}
  @media (hover:none){ .mini-icon{opacity:.75;} }

  /* Telegram: conversa selecionada fica azul/roxa com texto branco */
  html[data-skin="telegram"] .row.active, html[data-skin="telegram"] .row.active .row-title{color:#fff;}
  html[data-skin="telegram"] .row.active .row-sub, html[data-skin="telegram"] .row.active .row-time,
  html[data-skin="telegram"] .row.active .row-meta, html[data-skin="telegram"] .row.active .row-sub.typing{color:rgba(255,255,255,.85);}
  html[data-skin="telegram"] .row.active .count-badge{background:#fff; color:var(--accent);}
  html[data-skin="telegram"] .row.active .count-pill{background:rgba(255,255,255,.22); color:#fff;}
  html[data-skin="telegram"] .row.active .row-ico{background:rgba(255,255,255,.2); color:#fff;}
  html[data-skin="teams"] .row.active{box-shadow:0 1px 3px rgba(0,0,0,.1);}

  /* ---------- Avatares ---------- */
  .avatar{
    width:48px; height:48px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:16px; background:var(--av, #8a6449); position:relative; letter-spacing:.02em; user-select:none;
  }
  .avatar svg{width:22px; height:22px;}
  .avatar.square{border-radius:14px;}
  .avatar.sm{width:40px; height:40px; font-size:14px;}
  .avatar.sm.square{border-radius:12px;}
  .avatar.sm svg{width:19px; height:19px;}
  .avatar.xs{width:28px; height:28px; font-size:11px;}
  .avatar.lg{width:84px; height:84px; font-size:30px;}
  .avatar .pres{position:absolute; right:0; bottom:0; width:13px; height:13px; border-radius:50%; background:var(--online); border:2px solid var(--side-bg);}
  .pane-head .avatar .pres{border-color:var(--head-bg);}
  html[data-skin="teams"] .avatar.square, html[data-skin="discord"] .avatar.square{border-radius:10px;}

  /* ---------- Painel (coluna da direita) ---------- */
  .main{grid-column:3; grid-row:1; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; background:var(--wall);}
  .pane-head{
    display:flex; align-items:center; gap:10px; padding:9px 12px 9px 16px; min-height:62px; background:var(--head-bg); color:var(--head-fg);
    border-bottom:1px solid var(--line); flex-shrink:0; z-index:2;
  }
  .pane-titles{flex:1; min-width:0;}
  .pane-title{font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px;}
  .pane-sub{font-size:12.5px; color:var(--head-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; min-height:15px;}
  .pane-sub.typing{color:var(--accent-strong); font-style:italic;}
  .pane-sub.online{color:var(--online);}
  .title-ico{display:inline-flex; color:var(--head-sub);}
  .title-ico svg{width:14px; height:14px;}
  .head-btn{
    width:40px; height:40px; border-radius:50%; border:0; background:none; cursor:pointer; color:inherit;
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; padding:0;
  }
  .side-head .head-btn{color:var(--ink-soft);}
  .head-btn:hover{background:var(--row-hover);}
  .head-btn:focus-visible{box-shadow:0 0 0 2px var(--accent); outline:none;}
  .head-btn svg{width:21px !important; height:21px !important;}
  .head-btn.on{color:var(--accent);}
  .head-btn.on.star{color:var(--star);}
  .head-btn.sm{width:34px; height:34px;}
  .head-btn.sm svg{width:18px !important; height:18px !important;}
  .back-btn{display:none !important; margin-left:-6px;}
  .pane-body{flex:1; overflow-y:auto; min-height:0; position:relative; scrollbar-width:thin; scrollbar-color:var(--line) transparent; overscroll-behavior:contain;}
  .pane-body:not(.wallpaper){background:var(--bg);}
  .wallpaper{background:var(--wall-pattern) 0 0 / 20px 20px, var(--wall);}
  .pad{padding:20px clamp(14px, 4%, 40px) 40px;}
  .sec-title{font-size:12.5px; font-weight:800; color:var(--accent-strong); text-transform:uppercase; letter-spacing:.06em; margin:22px 0 10px;}
  .sec-title:first-child{margin-top:4px;}

  /* tela inicial (nada selecionado) — estilo WhatsApp Web */
  .empty-main{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px;
    color:var(--ink-soft); gap:6px; background:var(--head-bg); position:relative;
  }
  .empty-main::after{content:''; position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--accent);}
  .empty-main img{width:96px; height:96px; border-radius:26px; margin-bottom:14px; box-shadow:0 10px 30px rgba(0,0,0,.12); object-fit:cover;}
  .empty-main h2{font-size:28px; font-weight:300; color:var(--ink); margin:0;}
  .empty-main p{max-width:440px; font-size:14px; line-height:1.55; margin:6px 0 0;}
  .empty-lock{font-size:12.5px; margin-top:34px; display:flex; gap:6px; align-items:center; max-width:460px; line-height:1.4;}
  .empty-lock svg{width:13px !important; height:13px !important;}

  /* ---------- Conversa (balões) ---------- */
  .thread{padding:12px clamp(10px, 6%, 72px) 18px; display:flex; flex-direction:column; min-height:100%; justify-content:flex-end;}
  .thread-hint{
    align-self:center; margin:auto 0; background:var(--surface); color:var(--ink-soft); font-size:13px; line-height:1.5;
    padding:10px 16px; border-radius:10px; box-shadow:var(--bubble-shadow); text-align:center; max-width:420px;
  }
  .day-sep{align-self:center; margin:12px 0 6px; position:sticky; top:8px; z-index:1;}
  .day-sep span{display:inline-block; font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--surface); padding:5px 12px; border-radius:8px; box-shadow:var(--bubble-shadow);}
  .msg{display:flex; flex-direction:column; max-width:min(76%, 600px); margin-top:8px; position:relative;}
  .msg.grouped{margin-top:2px;}
  .msg.mine{align-self:flex-end; align-items:flex-end;}
  .msg.theirs{align-self:flex-start; align-items:flex-start;}
  .bubble{
    position:relative; padding:6px 9px 8px; border-radius:var(--bubble-r); box-shadow:var(--bubble-shadow);
    font-size:14.3px; line-height:1.4; overflow-wrap:anywhere; min-width:70px;
  }
  .msg.mine .bubble{background:var(--out-bg); color:var(--out-ink); --bb:var(--out-solid);}
  .msg.theirs .bubble{background:var(--in-bg); color:var(--in-ink); --bb:var(--in-solid);}
  html[data-skin="messenger"] .msg.mine .bubble{background-attachment:fixed;}
  .msg-author{font-size:12.5px; font-weight:700; margin-bottom:2px;}
  .msg-text{white-space:pre-wrap;}
  .msg-text a{color:var(--link); text-decoration:underline;}
  .msg.mine .msg-text a{color:inherit;}
  .meta-spacer{display:inline-block; height:1px;}
  .msg-meta{position:absolute; right:9px; bottom:4px; font-size:11px; color:var(--in-meta); display:inline-flex; align-items:center; gap:3px; white-space:nowrap; line-height:1;}
  .msg.mine .msg-meta{color:var(--out-meta);}
  .msg-meta .edited{font-style:italic; margin-right:3px;}
  .deleted-txt{font-style:italic; opacity:.75; display:inline-flex; align-items:center; gap:5px;}
  .deleted-txt svg{width:14px; height:14px;}
  .ticks{display:inline-flex; color:var(--tick); margin-left:1px;}
  .ticks.read{color:var(--tick-read);}
  .ticks svg{width:16px; height:12px;}
  .row-sub .ticks svg{width:15px; height:11px;}
  .row-sub .ticks{color:var(--ink-soft);} .row-sub .ticks.read{color:var(--tick-list, var(--tick-read));}
  .msg-menu-btn{
    position:absolute; top:3px; right:3px; width:26px; height:22px; border:0; border-radius:6px; cursor:pointer; color:inherit; opacity:0;
    background:linear-gradient(to right, transparent, var(--bb) 40%); display:flex; align-items:center; justify-content:flex-end; padding:0 2px; transition:opacity .12s; z-index:1;
  }
  .msg-menu-btn svg{width:18px; height:18px;}
  .bubble:hover .msg-menu-btn, .msg-menu-btn:focus-visible{opacity:.85;}
  @media (hover:none){
    .msg-menu-btn{display:none;}
    .bubble{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  }
  .reactions{display:flex; gap:4px; margin-top:-5px; padding:0 8px; position:relative; z-index:1; flex-wrap:wrap;}
  .reaction{
    border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; font-size:13px; padding:1px 7px;
    cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.08); line-height:1.5;
  }
  .reaction.mine{border-color:var(--accent); background:var(--accent-soft);}

  /* "rabinho" dos balões (WhatsApp / D Coração / Telegram) */
  html[data-skin="whatsapp"] .msg.first .bubble::before, html[data-skin="dcoracao"] .msg.first .bubble::before, html[data-skin="telegram"] .msg.first .bubble::before{
    content:''; position:absolute; top:0; width:8px; height:13px; background:var(--bb);
  }
  html[data-skin="whatsapp"] .msg.mine.first .bubble, html[data-skin="dcoracao"] .msg.mine.first .bubble, html[data-skin="telegram"] .msg.mine.first .bubble{border-top-right-radius:0;}
  html[data-skin="whatsapp"] .msg.theirs.first .bubble, html[data-skin="dcoracao"] .msg.theirs.first .bubble, html[data-skin="telegram"] .msg.theirs.first .bubble{border-top-left-radius:0;}
  html[data-skin="whatsapp"] .msg.mine.first .bubble::before, html[data-skin="dcoracao"] .msg.mine.first .bubble::before, html[data-skin="telegram"] .msg.mine.first .bubble::before{right:-8px; clip-path:polygon(0 0, 100% 0, 0 100%);}
  html[data-skin="whatsapp"] .msg.theirs.first .bubble::before, html[data-skin="dcoracao"] .msg.theirs.first .bubble::before, html[data-skin="telegram"] .msg.theirs.first .bubble::before{left:-8px; clip-path:polygon(0 0, 100% 0, 100% 100%);}
  /* Messenger: balões agrupados mais "colados" */
  html[data-skin="messenger"] .msg.mine.grouped .bubble{border-top-right-radius:5px;}
  html[data-skin="messenger"] .msg.theirs.grouped .bubble{border-top-left-radius:5px;}

  /* ---------- Barra de digitação ---------- */
  .composer{
    display:flex; align-items:flex-end; gap:6px; padding:8px 12px; background:var(--head-bg); border-top:1px solid var(--line); flex-shrink:0;
    padding-bottom:calc(8px + env(safe-area-inset-bottom)); z-index:2;
  }
  .composer textarea, .composer input{
    flex:1; resize:none; border:0; outline:0; background:var(--field); border-radius:22px; padding:11px 16px;
    font-size:15px; line-height:1.35; max-height:140px; min-height:44px; min-width:0;
  }
  .composer .composer-btn{color:var(--ink-soft); width:44px; height:44px;}
  .send-btn{
    width:44px; height:44px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0; transition:transform .1s;
  }
  .send-btn:active{transform:scale(.92);}
  .send-btn svg{width:20px; height:20px;}
  html[data-skin="telegram"] .composer, html[data-skin="messenger"] .composer{background:transparent; border-top:0;}
  html[data-skin="telegram"] .composer textarea, html[data-skin="telegram"] .composer input{box-shadow:0 1px 2px rgba(0,0,0,.15); border-radius:14px;}
  html[data-skin="teams"] .composer textarea, html[data-skin="teams"] .composer input{border:1px solid var(--line); border-bottom:2px solid var(--accent); border-radius:6px;}
  html[data-skin="teams"] .send-btn, html[data-skin="messenger"] .send-btn{background:none; color:var(--accent);}
  html[data-skin="discord"] .composer{background:var(--head-bg); border-top:0;}
  html[data-skin="discord"] .composer textarea, html[data-skin="discord"] .composer input{border-radius:8px;}
  .edit-bar{
    display:flex; align-items:center; gap:10px; padding:8px 12px 8px 16px; background:var(--head-bg); border-top:1px solid var(--line); font-size:13px; flex-shrink:0;
  }
  .edit-bar-txt{flex:1; min-width:0; border-left:3px solid var(--accent); padding-left:10px; display:flex; flex-direction:column;}
  .edit-bar-txt b{color:var(--accent-strong); font-size:12.5px;}
  .edit-bar-txt span{color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .thread-search{display:flex; align-items:center; gap:8px; padding:6px 10px 6px 16px; background:var(--head-bg); border-bottom:1px solid var(--line); flex-shrink:0;}
  .thread-search > svg{width:16px; height:16px; color:var(--ink-soft);}
  .thread-search input{flex:1; border:0; outline:0; background:transparent; font-size:14px; height:36px; min-width:0;}

  /* ---------- Planilhas (links em "cartões" tipo documento) ---------- */
  .links{padding:16px clamp(10px, 4%, 48px) 28px; display:flex; flex-direction:column; gap:8px; max-width:920px; margin:0 auto;}
  .link-card{
    display:flex; align-items:center; gap:2px; background:var(--in-bg); color:var(--in-ink); border-radius:12px; box-shadow:var(--bubble-shadow);
    padding:5px 4px; border:1px solid transparent; transition:border-color .12s;
  }
  html[data-skin="messenger"] .link-card, html[data-skin="discord"] .link-card, html[data-skin="teams"] .link-card{border-color:var(--line);}
  .link-card:hover{border-color:var(--accent);}
  .link-main{flex:1; min-width:0; display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; padding:6px 6px; border-radius:8px; outline:none;}
  .link-main:focus-visible{box-shadow:0 0 0 2px var(--accent);}
  .file-ico{width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--fi, #0f9d58); color:#fff;}
  .file-ico svg{width:22px; height:22px;}
  .link-text{min-width:0; flex:1;}
  .link-title{display:block; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .link-sub{display:block; font-size:12px; color:var(--in-meta); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .new-tag{font-size:9.5px; font-weight:800; background:var(--badge-bg); color:var(--badge-ink); border-radius:4px; padding:1px 5px; margin-left:7px; vertical-align:2px; letter-spacing:.04em;}
  .card-btn{
    width:38px; height:38px; border-radius:50%; border:0; background:none; color:var(--in-meta); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; padding:0;
  }
  .card-btn:hover{background:var(--row-hover); color:var(--in-ink);}
  .card-btn svg{width:18px !important; height:18px !important;}
  .card-btn.fav-on{color:var(--star);}
  .empty-card{align-self:center; margin:40px auto; background:var(--surface); color:var(--ink-soft); padding:16px 20px; border-radius:12px; text-align:center; font-size:13.5px; line-height:1.5; box-shadow:var(--bubble-shadow); max-width:420px;}
  .add-link{flex-wrap:wrap; align-items:center;}
  .add-link input{flex:1 1 220px; height:44px; min-height:44px; padding:0 16px;}

  /* ---------- Demandas ---------- */
  .pill{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); white-space:nowrap; letter-spacing:.02em; display:inline-flex; align-items:center;}
  .pill.st-aberta{background:rgba(51,144,236,.14); color:#2a7bd0;}
  .pill.st-em_andamento{background:rgba(217,138,28,.16); color:#b46e0e;}
  .pill.st-concluida{background:rgba(46,158,91,.15); color:#23824a;}
  .pill.st-cancelada{background:rgba(120,120,120,.15); color:var(--ink-soft);}
  .pill.prio-urgente, .pill.danger{background:rgba(193,80,61,.14); color:var(--danger);}
  .pill.prio-baixa{opacity:.85;}
  .pill.warn{background:rgba(217,138,28,.16); color:#b46e0e;}
  html[data-mode="dark"] .pill.st-aberta{color:#7fb8f5;} html[data-mode="dark"] .pill.st-em_andamento, html[data-mode="dark"] .pill.warn{color:#f0b35a;}
  html[data-mode="dark"] .pill.st-concluida{color:#6fd39a;} html[data-mode="dark"] .pill.prio-urgente, html[data-mode="dark"] .pill.danger{color:#f08a76;}
  .info-card{
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    margin:14px auto 6px; max-width:720px; width:calc(100% - 24px); box-shadow:var(--bubble-shadow);
  }
  .info-meta{font-size:12.5px; color:var(--ink-soft); line-height:1.7;}
  .info-meta b{color:var(--ink);}
  .info-desc{font-size:14px; white-space:pre-wrap; margin:10px 0 4px; line-height:1.5; background:var(--surface-2); border-radius:10px; padding:10px 12px; overflow-wrap:anywhere;}
  .info-desc a{color:var(--link);}
  .info-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .f-label{font-size:11.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}
  .f-label.inline{display:inline-block; margin:0;}
  .f-hint{text-transform:none; letter-spacing:0; font-weight:500;}
  .select{font-size:13.5px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); outline:none;}
  .text-link{background:none; border:0; color:var(--accent-strong); font-size:12.5px; font-weight:700; cursor:pointer; text-decoration:underline; padding:0;}
  .history-box{font-size:12px; color:var(--ink-soft); background:var(--surface-2); border-radius:8px; padding:8px 10px; margin-top:8px; max-height:160px; overflow-y:auto; line-height:1.5;}
  .checklist-box{margin-top:12px; border-top:1px solid var(--line); padding-top:10px;}
  .checklist-row{display:flex; align-items:center; gap:9px; font-size:13.5px; padding:5px 2px; cursor:pointer; border-radius:6px;}
  .checklist-row input[type="checkbox"]{width:17px; height:17px; margin:0; accent-color:var(--accent); flex-shrink:0;}
  .checklist-add{display:flex; gap:6px; margin-top:6px; align-items:center;}
  .mini-input{flex:1; font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); outline:none; min-width:0;}
  .mini-input:focus{border-color:var(--accent);}

  .form-pane{max-width:640px; margin:0 auto; padding:18px clamp(14px, 4%, 32px) 40px; display:flex; flex-direction:column; gap:14px;}
  .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field-row .field{flex:1 1 180px;}
  .f-input{width:100%; font-size:14.5px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); outline:none;}
  textarea.f-input{resize:vertical; min-height:96px; line-height:1.45;}
  .f-input:focus{border-color:var(--accent);}
  .assignee-box{max-height:240px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface);}
  .assignee-row{display:flex; align-items:center; gap:10px; padding:8px 12px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--line);}
  .assignee-row:last-child{border-bottom:0;}
  .assignee-row:hover{background:var(--row-hover);}
  .assignee-row input{width:17px; height:17px; margin:0; accent-color:var(--accent); flex-shrink:0;}
  .check-line{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-soft); cursor:pointer;}
  .check-line input{width:17px; height:17px; margin:0; accent-color:var(--accent);}
  .form-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px;}
  .btn{height:42px; padding:0 18px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px; cursor:pointer;}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .btn:hover{opacity:.9;}

  /* ---------- Admin / Ajustes ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
  .stat-num{font-size:28px; font-weight:800; color:var(--ink); line-height:1.1;}
  .stat-label{font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
  .stat.warn .stat-num{color:var(--danger);}
  .stat.good .stat-num{color:var(--online);}
  .card-list{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:4px 0; overflow:hidden;}
  .card-list .row{margin:0 4px;}
  .profile-card{display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 16px 18px; text-align:center;}
  .profile-card .avatar{margin-bottom:8px;}
  .profile-name{font-size:19px; font-weight:800; color:var(--ink);}
  .profile-email{font-size:13px; color:var(--ink-soft); word-break:break-all;}
  .role-badge{
    font-size:10.5px; font-weight:800; text-transform:uppercase; padding:3px 10px; border-radius:99px; letter-spacing:.06em;
    background:var(--accent-soft); color:var(--accent-strong); margin-top:6px; display:inline-block;
  }
  .switch{width:42px; height:24px; border-radius:12px; background:var(--line); position:relative; flex-shrink:0; transition:background .15s;}
  .switch::after{content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on{background:var(--accent);}
  .switch.on::after{left:21px;}
  .skin-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px;}
  .skin-card{border:2px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; background:var(--surface); padding:0; text-align:left; color:var(--ink); transition:transform .1s, border-color .12s;}
  .skin-card:hover{transform:translateY(-2px);}
  .skin-card.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .skin-prev{height:92px; position:relative; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; padding:8px 10px;}
  .skin-prev .sp-bar{position:absolute; top:0; left:0; right:0; height:20px; border-bottom:1px solid rgba(0,0,0,.06);}
  .skin-prev .sp-b{height:15px; border-radius:8px; width:62%; box-shadow:0 1px 1px rgba(0,0,0,.12);}
  .skin-prev .sp-b.out{align-self:flex-end; width:52%;}
  .skin-name{padding:9px 11px 10px; font-size:14px; font-weight:800;}
  .skin-desc{font-size:11.5px; color:var(--ink-soft); font-weight:500; margin-top:1px;}
  .seg{display:inline-flex; background:var(--surface-2); border-radius:10px; padding:3px; gap:2px; flex-shrink:0;}
  .seg button{border:0; background:none; padding:7px 14px; border-radius:8px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .seg.seg-sm button{padding:4px 10px; font-size:12px;}
  .preview-chat{border-radius:14px; border:1px solid var(--line); overflow:hidden;}
  .preview-chat .thread{min-height:0; padding:10px 14px 14px;}
  .preview-chat .day-sep{position:static;}

  /* ---------- Botão flutuante (celular) ---------- */
  .fab{
    display:none; position:absolute; right:16px; bottom:16px; width:56px; height:56px; border-radius:16px; background:var(--accent); color:var(--accent-ink);
    border:0; box-shadow:0 6px 18px rgba(0,0,0,.25); align-items:center; justify-content:center; cursor:pointer; z-index:5; padding:0;
  }
  .fab svg{width:24px !important; height:24px !important;}
  html[data-skin="messenger"] .fab, html[data-skin="telegram"] .fab{border-radius:50%;}

  /* ---------- Menus suspensos e emojis ---------- */
  .pop-menu{
    position:fixed; z-index:600; min-width:210px; max-width:calc(100vw - 16px); background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 34px rgba(0,0,0,.22); padding:6px; animation:popIn .12s ease-out;
  }
  .pop-item{display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; padding:10px 12px; border-radius:8px; font-size:14px; cursor:pointer; text-align:left; color:inherit;}
  .pop-item:hover, .pop-item:focus-visible{background:var(--row-hover); outline:none;}
  .pop-item svg{width:18px !important; height:18px !important; color:var(--ink-soft);}
  .pop-item.danger, .pop-item.danger svg{color:var(--danger);}
  .pop-react{display:flex; gap:2px; padding:2px 2px 8px; border-bottom:1px solid var(--line); margin-bottom:4px; justify-content:space-between;}
  .pop-react button{font-size:23px; width:42px; height:42px; border-radius:50%; border:0; background:none; cursor:pointer; transition:transform .1s; padding:0;}
  .pop-react button:hover{transform:scale(1.15); background:var(--row-hover);}
  .pop-react button.on{background:var(--accent-soft);}
  .emoji-pop{
    position:fixed; z-index:600; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 34px rgba(0,0,0,.22);
    padding:8px; display:grid; grid-template-columns:repeat(8, 38px); gap:2px; animation:popIn .12s ease-out;
  }
  .emoji-pop button{font-size:23px; background:none; border:0; border-radius:8px; height:38px; cursor:pointer; padding:0;}
  .emoji-pop button:hover{background:var(--row-hover);}
  .snack{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%, 20px); background:#323232; color:#fff; font-size:13.5px; padding:10px 18px;
    border-radius:10px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:700; box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .snack.show{opacity:1; transform:translate(-50%, 0);}

  /* ---------- Aviso de permissão ---------- */
  .perm-banner{
    position:fixed; top:10px; left:50%; transform:translateX(-50%); width:min(680px, calc(100% - 20px)); z-index:650;
    background:#fdecea; border:1px solid var(--danger); color:#7a2a1f; border-radius:12px; padding:10px 12px; font-size:13px;
    display:flex; gap:10px; align-items:flex-start; line-height:1.4; box-shadow:0 8px 24px rgba(0,0,0,.15);
  }
  .perm-banner button{background:none; border:none; color:inherit; font-size:18px; cursor:pointer; line-height:1; padding:0 2px;}

  /* ---------- Janelas (modais das funções de admin, senha, etc.) ---------- */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.48); display:flex; align-items:center; justify-content:center; z-index:500; padding:16px; animation:fadeIn .15s ease-out;}
  .modal{
    background:var(--surface); color:var(--ink); padding:22px; max-width:380px; width:100%; border:1px solid var(--line); border-radius:16px;
    max-height:90vh; max-height:90dvh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.28); animation:popIn .15s ease-out;
  }
  .modal h3{color:var(--ink); margin:0 0 12px; font-size:17px; font-weight:800;}
  .modal input{width:100%; font-size:14px; padding:10px 11px; border:1px solid var(--line); background:var(--input-bg); color:var(--ink); margin-bottom:12px; border-radius:10px; outline:none;}
  .modal input:focus{border-color:var(--accent);}
  .modal input[type="checkbox"]{width:17px; height:17px; min-width:17px; flex:0 0 17px; margin:0; padding:0; border-radius:4px; vertical-align:middle; accent-color:var(--accent);}
  .modal select, .modal textarea{background:var(--input-bg) !important; color:var(--ink) !important; border-color:var(--line) !important;}
  .modal label.checklist-row, .modal label.assignee-row{display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 4px; cursor:pointer; border-radius:6px;}
  .modal label.assignee-row:hover{background:var(--row-hover);}
  .modal label.assignee-row span{flex:1; text-align:left;}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
  .modal .actions button{font-size:14px; font-weight:700; padding:10px 16px; border:none; cursor:pointer; border-radius:10px;}
  .modal .cancel{background:var(--surface-2); border:1px solid var(--line) !important; color:var(--ink);}
  .modal .confirm{background:var(--accent); color:var(--accent-ink);}
  .modal .confirm:hover{opacity:.9;}
  .modal .confirm:disabled{opacity:.55; cursor:default;}
  .mini-btn{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; cursor:pointer; font-family:inherit;}
  .mini-btn:hover{border-color:var(--accent); color:var(--accent-strong);}
  .mini-btn.danger{color:var(--danger);}
  .mini-btn.danger:hover{border-color:var(--danger); color:var(--danger);}
  .add-tab-btn{background:transparent; border:1px dashed var(--line); color:var(--ink-soft); font-size:13px; padding:10px 12px; cursor:pointer; border-radius:10px; text-align:left;}
  .add-tab-btn:hover{color:var(--accent); border-color:var(--accent);}
  .icon-btn{background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:4px; display:inline-flex;}
  .icon-btn:hover{color:var(--danger);}
  .icon-btn svg{width:15px; height:15px;}

  /* ---------- Avisos de nova mensagem (toast) ---------- */
  #msnToastContainer{position:fixed; bottom:84px; right:18px; z-index:550; display:flex; flex-direction:column; gap:10px; align-items:flex-end; pointer-events:none;}
  .msn-toast{
    pointer-events:auto; cursor:pointer; width:320px; max-width:calc(100vw - 36px); background:var(--surface); color:var(--ink); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.22); padding:11px 12px; display:flex; gap:10px; align-items:flex-start;
    animation:msnSlideIn .35s cubic-bezier(.2,1.4,.4,1) both;
  }
  .msn-toast.leaving{animation:msnSlideOut .25s ease-in forwards;}
  .msn-toast .msn-avatar{width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; flex-shrink:0;}
  .msn-toast .msn-body{flex:1; min-width:0;}
  .msn-toast .msn-name{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:2px;}
  .msn-toast .msn-text{font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .msn-toast .msn-close{background:none; border:none; color:var(--ink-soft); opacity:.6; cursor:pointer; font-size:14px; line-height:1; padding:2px; flex-shrink:0;}
  .msn-toast .msn-close:hover{opacity:1;}

  @keyframes msnSlideIn{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  @keyframes msnSlideOut{ from{transform:translateX(0); opacity:1;} to{transform:translateX(110%); opacity:0;} }
  @keyframes msnDown{ from{transform:translateY(-30px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  @keyframes popIn{ from{transform:scale(.96); opacity:0;} to{transform:none; opacity:1;} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes slideIn{ from{transform:translateX(28px); opacity:.4;} to{transform:none; opacity:1;} }
  @keyframes sheetUp{ from{transform:translateY(60px); opacity:.4;} to{transform:none; opacity:1;} }

  /* ---------- App instalável: convite, passo a passo, sem internet ---------- */
  .install-banner{
    display:flex; align-items:center; gap:12px; margin:4px 12px 8px; padding:10px 10px 10px 12px; border-radius:14px;
    background:var(--accent-soft); color:var(--ink); border:1px solid var(--line); flex-shrink:0;
  }
  .install-banner img{width:40px; height:40px; border-radius:10px; flex-shrink:0; object-fit:cover;}
  .install-banner .ib-txt{flex:1; min-width:0; font-size:12.5px; line-height:1.35; color:var(--ink-soft);}
  .install-banner .ib-txt b{display:block; color:var(--ink); font-size:13.5px;}
  .install-banner .btn{height:34px; padding:0 12px; font-size:13px;}
  .install-banner .head-btn{width:30px; height:30px; color:var(--ink-soft);}
  .install-banner .head-btn svg{width:16px !important; height:16px !important;}
  .install-link{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px; padding:10px; border-radius:10px;
    background:none; border:1px dashed var(--line); color:var(--accent-strong); font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .install-link svg{width:18px; height:18px;}
  .login-box .install-link{background:none; color:var(--accent-strong); font-weight:700; font-size:13.5px; padding:10px; border:1px dashed var(--line);}
  .steps{list-style:none; padding:0; margin:6px 0 14px; display:flex; flex-direction:column; gap:12px;}
  .steps li{display:flex; gap:12px; align-items:flex-start; font-size:14px; line-height:1.45; color:var(--ink);}
  .steps .n{
    width:26px; height:26px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
  }
  .steps .kbd{display:inline-flex; align-items:center; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:1px 7px; font-weight:700; white-space:nowrap;}
  .steps .kbd svg{width:15px; height:15px; color:var(--accent-strong);}
  .help-note{font-size:12.5px; color:var(--ink-soft); line-height:1.5; background:var(--surface-2); border-radius:10px; padding:9px 11px; margin-bottom:12px;}
  .offline-banner{
    position:fixed; top:calc(8px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:640;
    background:#323232; color:#fff; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px;
    box-shadow:0 6px 18px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px; max-width:calc(100% - 20px); text-align:center;
  }
  .offline-banner::before{content:''; width:8px; height:8px; border-radius:50%; background:#f5a623; flex-shrink:0;}

  /* =================================================================
     TABLET
     ================================================================= */
  @media (min-width:769px) and (max-width:1100px){
    #app{--rail-w:72px; --side-w:300px;}
    .rail-btn{width:66px;}
  }

  /* =================================================================
     CELULAR — barra inferior + tela de detalhe por cima da lista
     (também vale para celular deitado)
     ================================================================= */
  @media (max-width:768px), (pointer:coarse) and (max-height:520px){
    #app{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto;}
    .rail{
      grid-column:1; grid-row:2; flex-direction:row; justify-content:space-around; align-items:stretch;
      padding:4px 2px calc(4px + env(safe-area-inset-bottom)); border-right:0; border-top:1px solid var(--line); overflow:visible; gap:0;
    }
    .rail-logo, .rail-spacer{display:none;}
    .rail-btn{flex:1; width:auto; min-width:0; padding:5px 0 3px; gap:2px;}
    .rail-label{display:block !important; font-size:11px;}
    .rail-ico, html[data-skin="discord"] .rail-ico{width:58px; height:30px; border-radius:15px;}
    html[data-skin="discord"] .rail-ico{background:transparent;}
    html[data-skin="discord"] .rail-btn.active .rail-ico, html[data-skin="discord"] .rail-btn:hover .rail-ico{border-radius:15px;}
    .rail-btn.active::before{display:none;}
    html[data-skin="teams"] .rail-btn.active::before{display:block; left:30%; right:30%; top:0; width:auto; height:3px; border-radius:0 0 3px 3px;}
    .rail-avatar{width:28px; height:28px; font-size:11px;}
    .sidebar{grid-column:1; grid-row:1; border-right:0;}
    .main{grid-column:1; grid-row:1 / span 2; display:none;}
    #app.main-open .main{display:flex; animation:slideIn .2s ease-out;}
    #app.main-open .sidebar, #app.main-open .rail{display:none;}
    .back-btn{display:inline-flex !important;}
    .fab{display:flex;}
    .side-head .primary-action{display:none;}
    .side-head{padding:10px 6px 4px 16px; min-height:56px;}
    .side-head h1{font-size:22px;}
    .pane-head{padding:6px 6px 6px 8px; min-height:58px; gap:6px; padding-top:calc(6px + env(safe-area-inset-top));}
    .side-head{padding-top:calc(10px + env(safe-area-inset-top));}
    .msg{max-width:86%;}
    .thread{padding:10px 10px 14px;}
    .links{padding:12px 8px 24px;}
    .composer{padding:6px 6px; padding-bottom:calc(6px + env(safe-area-inset-bottom));}
    .add-link input#linkTitle{flex-basis:100%;}
    .empty-main{display:none;}
    .row{margin:0 4px; padding:9px 12px;}
    /* evita o zoom automático do iPhone ao tocar num campo */
    input, select, textarea{font-size:16px !important;}
    /* janelas viram "folha" que sobe do rodapé */
    .modal-bg{align-items:flex-end; padding:0;}
    .modal{max-width:100% !important; border-radius:20px 20px 0 0; max-height:92dvh; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); animation:sheetUp .22s ease-out; border-bottom:0;}
    .modal .actions button{flex:1; padding:12px 16px;}
    #msnToastContainer{top:calc(8px + env(safe-area-inset-top)); left:8px; right:8px; bottom:auto; align-items:stretch;}
    .msn-toast{width:auto; max-width:none; animation:msnDown .3s cubic-bezier(.2,1.2,.4,1) both;}
    .emoji-pop{grid-template-columns:repeat(8, 1fr); left:8px !important; right:8px; width:auto;}
    .stat-grid{grid-template-columns:repeat(2, 1fr);}
    .skin-grid{grid-template-columns:repeat(2, 1fr);}
    .snack{bottom:calc(84px + env(safe-area-inset-bottom));}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---- AJUSTE DE LEGIBILIDADE: contorno nos balões recebidos, textos pequenos maiores ---- */
  .msg.theirs .bubble{box-shadow:0 0 0 1px rgba(128,128,128,.28), var(--bubble-shadow);}
  .msg.theirs .bubble{box-shadow:0 0 0 1px color-mix(in srgb, var(--ink) 16%, transparent), var(--bubble-shadow);}
  .msg-meta{font-size:12px;}
  .bubble{font-size:15px; line-height:1.45;}
  .row-time{font-size:12px;}
  .row-sub{font-size:13.5px;}
  .deleted-txt{opacity:.92;}
  .day-sep span{border:1px solid var(--line); color:var(--ink-soft);}
  html[data-skin="telegram"] .row.active .row-sub, html[data-skin="telegram"] .row.active .row-time,
  html[data-skin="telegram"] .row.active .row-meta, html[data-skin="telegram"] .row.active .row-sub.typing{color:#fff;}

  /* ---- D Coração: contraste reforçado nas conversas ---- */
  html[data-skin="dcoracao"]{ --out-bg:#7a5539; --out-solid:#7a5539; --out-ink:#ffffff; --out-meta:#f3e4d6; --tick:#f3e4d6; --tick-read:#ffe9a8; }
  html[data-skin="dcoracao"][data-mode="dark"]{
    --ink:#fff6ec; --ink-soft:#d2c0ad; --head-sub:#d2c0ad;
    --out-bg:#d4a57a; --out-solid:#d4a57a; --out-ink:#1d1611; --out-meta:#4a3322; --tick:#4a3322; --tick-read:#07407f;
    --in-bg:#42352a; --in-solid:#42352a; --in-ink:#fff6ec; --in-meta:#d9c8b6; --link:#f2c999;
  }
  .bubble{font-size:15.5px;}

  /* =================================================================
     REQUISIÇÃO DE INSUMOS (almoxarifado) — usa as variáveis do tema
     ================================================================= */
  .pill.st-aprovada{background:rgba(138,100,73,.16); color:var(--accent-strong);}
  .pill.st-separada{background:rgba(120,90,200,.15); color:#6a4fc0;}
  html[data-mode="dark"] .pill.st-separada{color:#b9a6f5;}
  .pill.on{background:var(--accent); color:var(--accent-ink);}
  .req-disp{font-size:12px; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink); white-space:nowrap;}
  .req-disp.low{background:rgba(193,80,61,.14); color:var(--danger);}
  .req-steps{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 2px;}
  .req-table{width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .req-table th{font-size:11.5px; text-align:left; color:var(--ink-soft); padding:8px 10px; text-transform:uppercase; letter-spacing:.04em; background:var(--surface-2);}
  .req-table td{padding:8px 10px; border-top:1px solid var(--line); vertical-align:middle;}
  .req-table td.n, .req-table th.n{text-align:right;}
  .req-table .f-input{width:84px; padding:6px 8px;}
  .req-scroll{overflow-x:auto;}
  .req-cart-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line);}
  .req-cart-row:last-child{border-bottom:0;}
  .req-cart-row .rc-main{flex:1; min-width:0;}
  .rc-name{font-size:14.5px; font-weight:600;}
  .rc-sub{font-size:12px; color:var(--ink-soft);}
  .rc-qty{width:82px !important; flex-shrink:0;}
  .rc-un{font-size:12.5px; color:var(--ink-soft); min-width:28px;}
  .req-hist-row{font-size:12.5px; color:var(--ink-soft); padding:3px 0;}
  .req-bar{height:12px; border-radius:6px; background:var(--surface-2); overflow:hidden;}
  .req-bar > i{display:block; height:100%; background:var(--accent); border-radius:6px;}
  .req-bar > i.sel{background:var(--ink);}
  .req-bar-row{display:flex; flex-direction:column; gap:5px; padding:6px 0; cursor:pointer;}
  .req-bar-top{display:flex; justify-content:space-between; font-size:14px;}
  .req-acts{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .req-note{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .req-err{font-size:13px; font-weight:700; color:var(--danger); border-left:4px solid var(--danger); padding-left:10px;}
  .req-foto{width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--surface-2); flex-shrink:0;}
  #reqSetorBox{padding:6px 0 2px;}
  #reqSetorBox select{width:100%;}
</style>
</head>

// mensagem amigável: "Missing or insufficient permissions" não diz nada para quem usa o painel
function errMsg(err){
  const raw = (err && err.message) ? err.message : String(err);
  if((err && err.code === 'permission-denied') || /insufficient permissions/i.test(raw)){
    return 'Sem permissão para esta ação. Pode ser conta bloqueada ou regras do Firestore desatualizadas — avise o administrador.';
  }
  return raw;
}

// falhas de leitura em tempo real (listeners) deixavam a tela vazia sem explicação;
// agora aparece um aviso fixo no topo (uma vez por assunto)
const permIssues = new Set();
function reportListenError(label, err){
  console.error('Erro ao carregar ' + label, err);
  if(err && err.code === 'permission-denied'){
    permIssues.add(label);
    renderPermBanner();
  }
}
function clearPermIssues(){
  permIssues.clear();
  renderPermBanner();
}
function renderPermBanner(){
  const el = document.getElementById('permBanner');
  if(!el) return;
  if(!permIssues.size){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  const what = [...permIssues].join(', ');
  const hint = isAdmin
    ? 'Confira se as regras do Firestore foram publicadas na versão mais recente (Firebase → Firestore Database → Regras).'
    : 'Avise o administrador — o acesso desta conta precisa ser verificado.';
  el.innerHTML = `<div style="flex:1;"><b>Sem permissão para carregar: ${escapeHtml(what)}.</b><br>${escapeHtml(hint)}</div><button id="permBannerClose" title="Fechar aviso">&times;</button>`;
  el.classList.remove('hidden');
  document.getElementById('permBannerClose').onclick = () => { permIssues.clear(); renderPermBanner(); };
}

// ---------- AUTH ----------
document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  doLogin();
});

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const remember = document.getElementById('rememberMe').checked;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
  const persistence = remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;
  auth.setPersistence(persistence)
    .then(() => auth.signInWithEmailAndPassword(email, pass))
    .catch(err => {
      errEl.textContent = traduzErro(err.code);
    });
}

function traduzErro(code){
  const map = {
    'auth/invalid-email':'E-mail inválido.',
    'auth/user-not-found':'Usuário não encontrado.',
    'auth/wrong-password':'Senha incorreta.',
    'auth/invalid-credential':'E-mail ou senha incorretos.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.',
    'auth/weak-password':'Senha fraca: use pelo menos 6 caracteres.',
    'auth/network-request-failed':'Sem conexão com a internet. Tente de novo.'
  };
  return map[code] || 'Não foi possível entrar. Verifique os dados.';
}

    document.getElementById('app').classList.add('hidden');
    return;
  }
  myUid = user.uid;
  if(typeof pushSetupSoon === 'function') pushSetupSoon();

  // registra/atualiza o próprio usuário na coleção "users" (permite que o admin o encontre depois)
  db.collection('users').doc(user.uid).set({
    email: user.email,
    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(err => reportListenError('seu cadastro', err));

  let adminCheckOk = true;
  try{
    const adminDoc = await db.collection('admins').doc(user.uid).get();
    isAdmin = adminDoc.exists;
  } catch(e){
    isAdmin = false;
    adminCheckOk = false;
  }

  if(!isAdmin){
    try{
      const ownDoc = await db.collection('users').doc(user.uid).get();
      if(ownDoc.exists && ownDoc.data().blocked === true){
        document.getElementById('loginError').textContent = 'Sua conta foi bloqueada. Fale com o administrador.';
        await auth.signOut();
        return;

  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('railAdminBtn').classList.toggle('hidden', !isAdmin);
  updateMyNameUI();

  // se esta pessoa virar (ou deixar de ser) administrador com o painel aberto, recarrega para valer a nova permissão
  if(unsubMyAdmin) unsubMyAdmin();
  if(adminCheckOk){
    unsubMyAdmin = db.collection('admins').doc(user.uid).onSnapshot(doc => {
      if(doc.exists === isAdmin) return;
      try{
        // trava anti-loop: no máximo um recarregamento a cada 15 segundos
        const last = Number(sessionStorage.getItem('adminReloadAt') || 0);
        if(Date.now() - last < 15000) return;
        sessionStorage.setItem('adminReloadAt', String(Date.now()));
      } catch(e){}
      alert('Suas permissões de acesso foram alteradas. A página será recarregada.');
      location.reload();
    }, () => {});
  }

  if(unsubMyUser) unsubMyUser();
  unsubMyUser = db.collection('users').doc(user.uid).onSnapshot(doc => {
    const data = doc.data() || {};
    if(!isAdmin && data.blocked === true){
      document.getElementById('loginError').textContent = 'Sua conta foi bloqueada. Fale com o administrador.';
      auth.signOut();
      return;
    }
    myGroups = Array.isArray(data.groups) ? data.groups : [];
    syncLinkListeners();
    myFavorites = data.favorites || [];
    myPinnedCats = data.pinnedCats || [];
    myLastSeenCat = data.lastSeenCat || {};
    myChatName = data.chatName || '';
    updateMyNameUI();
    const shouldForce = data.mustChangePassword === true;
    if(shouldForce && !mustChangePassword) showForcePasswordModal();
    mustChangePassword = shouldForce;
    render();
  }, err => reportListenError('seu cadastro', err));

  if(isAdmin){ listenUsers(); listenGroups(); }
  else listenUsersDirectory();
  listenConversations();
  listenDemands();
  listenCategories();
  listenRequisicao();
  startPresence();
});

function mapUserDoc(d){
  const x = d.data();
  return {
    uid: d.id,
    email: x.email || '(sem e-mail)',
    blocked: x.blocked === true,
    chatName: x.chatName || '',
    online: x.online === true,
    lastSeen: x.lastSeen ? x.lastSeen.toMillis() : null,
    lastLogin: x.lastLogin ? x.lastLogin.toMillis() : null,
    groups: Array.isArray(x.groups) ? x.groups : []
  };
}

function usersSignature(list){
  return JSON.stringify(list.map(u => [u.uid, u.email, u.blocked, u.chatName, u.groups, u.lastLogin]).sort());
}

// handlers guardados para não empilhar um novo ouvinte a cada login (sair e entrar de novo várias vezes)
let presenceBeat = null;
let presenceUnload = null;
function startPresence(){
  if(presenceInterval) clearInterval(presenceInterval);
  if(presenceBeat) document.removeEventListener('visibilitychange', presenceBeat);
  if(presenceUnload) window.removeEventListener('beforeunload', presenceUnload);
  const beat = () => {
    if(!myUid) return;
    const online = document.visibilityState === 'visible';
    db.collection('users').doc(myUid).set({
      online, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(() => {});
  };
  presenceBeat = beat;
  presenceUnload = () => {
    if(myUid) db.collection('users').doc(myUid).set({ online: false }, { merge: true });
  };
  beat();
  presenceInterval = setInterval(beat, 25000);
  document.addEventListener('visibilitychange', presenceBeat);
  window.addEventListener('beforeunload', presenceUnload);
}

function presenceLabel(u){
  if(!u || u.uid === myUid) return '';
  if(u.online) return 'online';
  if(u.lastSeen){
    const diffMin = Math.round((Date.now() - u.lastSeen) / 60000);
    if(diffMin < 1) return 'visto agora';
    if(diffMin < 60) return `visto há ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if(diffH < 24) return `visto há ${diffH}h`;
    return `visto há ${Math.round(diffH / 24)}d`;
  }
  return '';
}

function listenUsers(){
  if(unsubUsers) unsubUsers();
  unsubUsers = db.collection('users').onSnapshot(snap => {
    allUsers = snap.docs.map(mapUserDoc);
    // redesenha as janelas abertas de grupos/usuários só quando algo relevante mudou
    // (online/visto mudam a cada poucos segundos e não devem piscar a tela do admin)
    const sig = usersSignature(allUsers);
    if(sig !== usersSig){
      usersSig = sig;
      renderGroupsList();
      if(document.getElementById('usersMgmtList')) renderUsersMgmtList(lastAdminUids);
    }
    render();
  }, err => reportListenError('usuários', err));
}

// ---------- FIRESTORE LISTENERS ----------
function listenCategories(){
  if(unsubCats) unsubCats();
  unsubCats = db.collection('categories').orderBy('createdAt', 'asc').onSnapshot(snap => {
    const newCats = [];
    snap.forEach(doc => {
      const existing = categories.find(c => c.id === doc.id);
      newCats.push({
        id: doc.id,
        name: doc.data().name,
        order: doc.data().order || 0,
        allowedUsers: doc.data().allowedUsers || [],
        allowedGroups: doc.data().allowedGroups || [],
        links: existing ? existing.links : []
      });
    });
    newCats.sort((a, b) => a.order - b.order);
    categories = newCats;
    // no celular a lista aparece primeiro: só marca como "vista" a aba que realmente foi aberta
    if(!activeId && categories.length){ activeId = categories[0].id; if(!isMobile()) markCategorySeen(activeId); }
    if(activeId && activeId !== FAV_ID && !categories.find(c => c.id === activeId)){
      activeId = categories.length ? categories[0].id : null;
    }
    syncLinkListeners();
    render();
  }, err => reportListenError('abas', err));
}

// a pessoa vê a aba se: é admin; OU a aba não tem restrição nenhuma (nem pessoas nem grupos);
// OU ela está na lista de pessoas; OU pertence a algum dos grupos liberados.
// (mesma lógica das regras do Firestore — se mudar aqui, mudar lá)
const SO_ADMIN = '__so_admin__'; // marcador gravado em allowedUsers: ninguém casa com ele, então só admin enxerga a aba
function canSeeCategory(cat){
  if(isAdmin) return true;
  const users = cat.allowedUsers || [];
  const groups = cat.allowedGroups || [];
  if(!users.length && !groups.length) return true;
  if(users.includes(myUid)) return true;
  return groups.some(g => myGroups.includes(g));
}

// só escuta os links das abas que a pessoa pode ver — as demais seriam recusadas pelo Firestore
// (e apareceriam como falso erro de permissão)
function syncLinkListeners(){
  const visibleIds = new Set(categories.filter(canSeeCategory).map(c => c.id));
  Object.keys(linkUnsubs).forEach(id => {
    if(!visibleIds.has(id)){
      linkUnsubs[id]();
      delete linkUnsubs[id];
      const cat = categories.find(c => c.id === id);
      if(cat) cat.links = [];
    }
  });
  visibleIds.forEach(id => {
    if(!linkUnsubs[id]) listenLinks(id);
  });
}

function listenLinks(catId){
  linkUnsubs[catId] = db.collection('categories').doc(catId).collection('links')
    .orderBy('createdAt', 'asc')
    .onSnapshot(snap => {
      const cat = categories.find(c => c.id === catId);
      if(!cat) return;
      const links = snap.docs.map(d => ({ id: d.id, title: d.data().title, url: d.data().url, order: d.data().order || 0, createdAtMillis: d.data().createdAt ? d.data().createdAt.toMillis() : Date.now() }));
      links.sort((a, b) => a.order - b.order);
      cat.links = links;
      render();
    }, err => {
      reportListenError('links', err);
      // libera para uma nova tentativa na próxima atualização das abas
      if(linkUnsubs[catId]){ try{ linkUnsubs[catId](); } catch(e){} delete linkUnsubs[catId]; }
    });
}

function addCategory(name){

  db.collection('categories').add({

    allowedUsers: [SO_ADMIN],
    allowedGroups: [],
    order: maxOrder + 1,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  })
    .then(doc => { activeId = doc.id; logActivity('criou a aba', name.trim()); })
    .catch(err => alert('Erro ao criar aba: ' + errMsg(err)));
}

function renameCategory(catId, newName){

  const oldName = cat ? cat.name : catId;
  db.collection('categories').doc(catId).update({ name: newName.trim() })
    .then(() => logActivity('renomeou a aba', `${oldName} → ${newName.trim()}`))

}

async function deleteCategory(catId){
  const cat = categories.find(c => c.id === catId);
  try{
    const linksSnap = await db.collection('categories').doc(catId).collection('links').get();
    const batch = db.batch();
    linksSnap.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection('categories').doc(catId));
    await batch.commit();
    logActivity('excluiu a aba', cat ? cat.name : catId);
  } catch(err){
    alert('Erro ao excluir aba: ' + errMsg(err));
  }
}

function moveCategory(catId, direction){
  const sorted = [...categories].sort((a,b) => a.order - b.order);
  const idx = sorted.findIndex(c => c.id === catId);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= sorted.length) return;
  const a = sorted[idx], b = sorted[swapIdx];
  const batch = db.batch();
  batch.update(db.collection('categories').doc(a.id), { order: b.order });
  batch.update(db.collection('categories').doc(b.id), { order: a.order });
  batch.commit().catch(err => alert('Erro ao reordenar: ' + errMsg(err)));
}

function setCategoryAccess(catId, uids, gids){

function addLink(catId, title, url){

  db.collection('categories').doc(catId).collection('links').add({
    title: title.trim(), url: finalUrl, order: maxOrder + 1, createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => logActivity('adicionou o link', title.trim()))

function deleteLink(catId, linkId){

function moveLink(catId, linkId, direction){
  const cat = categories.find(c => c.id === catId);
  if(!cat) return;
  const sorted = [...cat.links].sort((a,b) => a.order - b.order);
  const idx = sorted.findIndex(l => l.id === linkId);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= sorted.length) return;
  const a = sorted[idx], b = sorted[swapIdx];

  batch.update(linksRef.doc(a.id), { order: b.order });

function copyLinkToClipboard(url, btn){
  const done = () => {
    if(!btn) return;
    const original = btn.innerHTML;
    btn.innerHTML = checkSvg;
    btn.style.color = 'var(--teal)';
    setTimeout(() => { btn.innerHTML = original; btn.style.color = ''; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else {
    fallbackCopy(url, done);
  }
}

function fallbackCopy(url, cb){
  const ta = document.createElement('textarea');
  ta.value = url;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); cb(); } catch(e){ alert('Não foi possível copiar automaticamente.'); }
  document.body.removeChild(ta);
}

async function exportBackup(){
  try{
    const abas = categories.map(c => ({
      nome: c.name,
      ordem: c.order,
      restritaA: c.allowedUsers,
      restritaAGrupos: (c.allowedGroups || []).map(id => (allGroups.find(g => g.id === id) || {}).name || id),
      links: [...c.links].sort((a,b) => a.order - b.order).map(l => ({ titulo: l.title, url: l.url, ordem: l.order }))
    }));
    const adm = new Set((await db.collection('admins').get()).docs.map(d => d.id));
    const gname = Object.fromEntries(allGroups.map(g => [g.id, g.name]));
    const usuarios = allUsers.map(u => ({
      email: u.email, nome: u.chatName || '', bloqueado: u.blocked, admin: adm.has(u.uid),
      grupos: (u.groups || []).map(id => gname[id] || id)
    }));
    const blob = new Blob([JSON.stringify({ exportadoEm: new Date().toISOString(), abas, usuarios }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-painel-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    logActivity('exportou', 'backup do painel');
  }catch(e){ alert('Erro ao exportar: ' + errMsg(e)); }
}

async function importAbas(abas){
  const novas = abas.filter(a => a && a.nome && !categories.some(c => c.name === a.nome));
  const nLinks = novas.reduce((n, a) => n + (a.links || []).length, 0);
  if(!novas.length) return 'Abas: nada novo (todas já existem).';
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  let ord = categories.reduce((m, c) => Math.max(m, c.order || 0), 0);
  for(const a of novas){
    const batch = db.batch();
    const ref = db.collection('categories').doc();
    batch.set(ref, { name: String(a.nome).trim(), allowedUsers: [SO_ADMIN], allowedGroups: [], order: ++ord, createdAt: ts });
    (a.links || []).forEach((l, i) => {
      batch.set(ref.collection('links').doc(), { title: String(l.titulo || '').trim(), url: String(l.url || '').trim(), order: (typeof l.ordem === 'number' ? l.ordem : i), createdAt: ts });
    });
    await batch.commit();
  }
  return 'Abas: ' + novas.length + ' criada(s) com ' + nLinks + ' link(s).';
}

async function importUsuarios(lista, pass){
  const jaTem = new Set(allUsers.map(u => (u.email || '').toLowerCase()));
  const novos = lista.filter(u => u && u.email && !jaTem.has(String(u.email).toLowerCase()));
  if(!novos.length) return 'Usuários: nada novo (todos já existem).';
  const gid = {}; allGroups.forEach(g => { gid[g.name] = g.id; });
  let ok = 0; const falhas = [];
  for(const u of novos){
    try{
      const nomes = Array.isArray(u.grupos) ? u.grupos : [];
      for(const n of nomes){
        if(!gid[n]){ const r = await db.collection('groups').add({ name: n, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); gid[n] = r.id; }
      }
      const cred = await secondaryAuth.createUserWithEmailAndPassword(String(u.email).trim(), pass);
      const uid = cred.user.uid;
      const doc = { email: cred.user.email || u.email, mustChangePassword: true, groups: nomes.map(n => gid[n]), createdAt: firebase.firestore.FieldValue.serverTimestamp() };
      if(u.nome) doc.chatName = u.nome;
      await db.collection('users').doc(uid).set(doc, { merge: true });
      if(u.admin) await db.collection('admins').doc(uid).set({ email: doc.email, promotedBy: myUid, promotedAt: firebase.firestore.FieldValue.serverTimestamp() });
      if(u.bloqueado) await db.collection('users').doc(uid).set({ blocked: true }, { merge: true });
      try{ await secondaryAuth.signOut(); }catch(e){}
      ok++;
    }catch(err){ falhas.push(u.email + ': ' + errMsg(err)); try{ await secondaryAuth.signOut(); }catch(e){} }
  }
  return 'Usuários: ' + ok + ' conta(s) criada(s) com a senha temporária "' + pass + '".' + (falhas.length ? '\nFalharam:\n' + falhas.join('\n') : '');
}

function restoreBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d;
      try{ d = JSON.parse(rd.result); }catch(e){ alert('Arquivo inválido. Use um arquivo gerado por "Backup".'); return; }
      const abas = Array.isArray(d.abas) ? d.abas : null;
      const usuarios = Array.isArray(d.usuarios) ? d.usuarios : null;
      if(!abas && !usuarios){ alert('Esse arquivo não tem abas nem usuários.'); return; }
      const novosU = usuarios ? usuarios.filter(u => u && u.email && !allUsers.some(x => (x.email || '').toLowerCase() === String(u.email).toLowerCase())).length : 0;
      let pass = '';
      if(novosU){
        pass = prompt('Restaurar backup: ' + (abas ? abas.length + ' aba(s) e ' : '') + novosU + ' pessoa(s) nova(s).\nDefina UMA senha temporária para as pessoas (mín. 6 caracteres). Cada uma troca no primeiro acesso:');
        if(pass === null) return;
        if(pass.length < 6){ alert('A senha precisa ter pelo menos 6 caracteres.'); return; }
      } else if(!confirm('Restaurar as abas e links deste backup? (o que já existe é ignorado)')) return;
      const out = [];
      try{
        if(abas) out.push(await importAbas(abas));
        if(usuarios) out.push(await importUsuarios(usuarios, pass));
        logActivity('restaurou', 'backup do painel');
      }catch(err){ out.push('Erro: ' + errMsg(err)); }
      alert(out.join('\n'));
    };
    rd.readAsText(f);
  };
  inp.click();
}

function showInviteModal(){
  const root = document.getElementById('modalRoot');
  const groupRows = allGroups.length ? `
        <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 2px;">Grupos de acesso (opcional)</div>

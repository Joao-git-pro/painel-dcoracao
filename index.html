  if(show) inp.focus();
  else { inp.value = ''; filterThreadMessages(''); }
}

function startEditMessage(msgId, text){
  const bar = byId('editBar'), inp = byId('msgInput');
  if(!bar || !inp) return;
  editingMsgId = msgId;
  bar.classList.remove('hidden');
  byId('editBarPreview').textContent = text;
  inp.value = text; autoGrow(inp);
  inp.focus();
}
function cancelEdit(){
  editingMsgId = null;
  const bar = byId('editBar'); if(bar) bar.classList.add('hidden');
  const inp = byId('msgInput'); if(inp){ inp.value = ''; autoGrow(inp); }
}

function updateThreadDocUI(){
  if(!chatView || chatView.type !== 'thread') return;
  const conv = myConversations.find(c => c.id === chatView.convId);
  const sub = byId('threadSub');
  if(sub){
    const typing = isTypingTs(conv && conv.typing && conv.typing[chatView.otherUid]);
    const u = allUsers.find(x => x.uid === chatView.otherUid);
    const presence = presenceLabel(u);
    sub.textContent = typing ? 'digitando…' : (presence || (u && u.email !== displayNameFor(u) ? u.email : ''));
    sub.classList.toggle('typing', typing);
    sub.classList.toggle('online', !typing && presence === 'online');
    clearTimeout(typingTimer);
    if(typing) typingTimer = setTimeout(updateThreadDocUI, 4200);
  }
  // ✓ enviado · ✓✓ visto (quando a outra pessoa abriu a conversa depois da mensagem)
  const lastRead = tsMs(conv && conv.lastReadAt && conv.lastReadAt[chatView.otherUid]);
  document.querySelectorAll('#msgThread .ticks[data-ticktime]').forEach(el => {
    const ms = Number(el.getAttribute('data-ticktime')) || 0;
    const read = ms > 0 && lastRead >= ms;
    el.classList.toggle('read', read);
    el.innerHTML = !ms ? clockSvg : (read ? doubleCheckSvg : singleCheckSvg);
    el.title = !ms ? 'Enviando…' : (read ? 'Visto' : 'Enviado');
  });
}

// marca como lida a conversa que está aberta na tela (antes só marcava ao abrir)
function autoMarkOpenThreadRead(){
  if(section !== 'chats' || !chatView || chatView.type !== 'thread') return;
  if(isMobile() && !mainOpen) return;
  if(document.visibilityState !== 'visible') return;
  const conv = myConversations.find(c => c.id === chatView.convId);
  if(!conv || !(convUnread(conv) > 0)) return;
  const now = Date.now();
  if(now - (lastReadWrite[conv.id] || 0) < 1500) return;
  lastReadWrite[conv.id] = now;
  markConversationRead(conv.id);
}

function listenMessages(convId){
  if(unsubMessages) unsubMessages();
  let firstLoad = true, prevCount = 0;
  unsubMessages = db.collection('conversations').doc(convId).collection('messages')
    .orderBy('createdAt', 'asc')
    .limitToLast(200)
    .onSnapshot(snap => {
      const thread = byId('msgThread'), scroller = byId('msgScroll');
      if(!thread || !scroller || !chatView || chatView.type !== 'thread' || chatView.convId !== convId) return;
      const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
      const docs = snap.docs;
      let html = '', lastDay = '', prevSender = null;
      docs.forEach(d => {
        const m = d.data();
        const mine = m.senderUid === myUid;
        const date = m.createdAt ? m.createdAt.toDate() : new Date();
        const dk = dayKey(date);
        if(dk !== lastDay){ html += `<div class="day-sep"><span>${escapeHtml(dayLabel(date))}</span></div>`; lastDay = dk; prevSender = null; }
        const first = prevSender !== m.senderUid; prevSender = m.senderUid;
        const when = m.createdAt ? hhmm(date) : '';
        const ms = m.createdAt ? m.createdAt.toMillis() : 0;
        const reactions = m.reactions || {};
        const grouped = {};
        Object.keys(reactions).forEach(uid => { grouped[reactions[uid]] = (grouped[reactions[uid]] || 0) + 1; });
        const reactionsHtml = Object.keys(grouped).length
          ? `<div class="reactions">${Object.keys(grouped).map(emo => `<button class="reaction${reactions[myUid] === emo ? ' mine' : ''}" data-reactbadge="${d.id}|${emo}" title="Reagir com ${emo}">${emo}${grouped[emo] > 1 ? ' ' + grouped[emo] : ''}</button>`).join('')}</div>` : '';
        const ticks = mine ? `<span class="ticks" data-ticktime="${ms}">${ms ? singleCheckSvg : clockSvg}</span>` : '';
        const edited = m.edited && !m.deleted;
        const spacerW = 40 + (mine ? 20 : 0) + (edited ? 46 : 0);
        const body = m.deleted
          ? `<span class="deleted-txt">${banSvg}${escapeHtml(m.text || 'Mensagem apagada')}</span>`
          : linkify(escapeHtml(m.text || ''));
        html += `<div class="msg ${mine ? 'mine' : 'theirs'} ${first ? 'first' : 'grouped'}" data-msgid="${d.id}" data-text="${escapeAttr((m.text || '').toLowerCase())}">
          <div class="bubble">
            ${!m.deleted ? `<button class="msg-menu-btn" data-msgmenu="${d.id}" title="Opções da mensagem" aria-label="Opções da mensagem">${chevDownSvg}</button>` : ''}
            <div class="msg-text">${body}<span class="meta-spacer" style="width:${spacerW}px"></span></div>
            <span class="msg-meta">${edited ? '<span class="edited">editada</span>' : ''}${when}${ticks}</span>
          </div>
          ${reactionsHtml}
        </div>`;
      });
      thread.innerHTML = html || `<div class="thread-hint">Nenhuma mensagem ainda.<br>Diga um oi para <b>${escapeHtml(chatView.otherName || '')}</b>! 👋</div>`;
      const last = docs[docs.length - 1];
      const newMine = last && last.data().senderUid === myUid && docs.length > prevCount;
      if(firstLoad || nearBottom || newMine) scroller.scrollTop = scroller.scrollHeight;
      firstLoad = false; prevCount = docs.length;
      bindThreadHandlers(convId, docs);
      const sInp = byId('searchMsgInput');
      if(sInp && sInp.value) filterThreadMessages(sInp.value);
      updateThreadDocUI();
    }, err => {
      messagesListenFailed = convId;
      unsubMessages = null;
      reportListenError('mensagens', err);
    });
}

function bindThreadHandlers(convId, docs){
  const thread = byId('msgThread'); if(!thread) return;
  const findMsg = id => docs.find(d => d.id === id);
  thread.querySelectorAll('[data-reactbadge]').forEach(btn => {
    btn.onclick = () => {
      const [msgId, emo] = btn.getAttribute('data-reactbadge').split('|');
      const msg = findMsg(msgId);
      const already = msg && msg.data().reactions && msg.data().reactions[myUid] === emo;
      reactToMessage(convId, msgId, emo, already);
    };
  });
  thread.querySelectorAll('[data-msgmenu]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); openMsgMenu(btn, convId, btn.getAttribute('data-msgmenu'), docs); };
  });
  thread.querySelectorAll('.msg[data-msgid]').forEach(row => {
    const id = row.getAttribute('data-msgid');
    const msg = findMsg(id);
    if(!msg || msg.data().deleted) return;
    const bubble = row.querySelector('.bubble');
    bubble.addEventListener('contextmenu', e => { if(e.target.closest('a')) return; e.preventDefault(); openMsgMenu(bubble, convId, id, docs); });
    addLongPress(bubble, () => openMsgMenu(bubble, convId, id, docs));
    bubble.addEventListener('dblclick', e => { if(isTouch || e.target.closest('a')) return; const m = msg.data(); const cur = m.reactions && m.reactions[myUid]; reactToMessage(convId, id, '👍', cur === '👍'); });
  });
}

function openMsgMenu(anchor, convId, msgId, docs){
  const d = docs.find(x => x.id === msgId); if(!d) return;
  const m = d.data(); if(m.deleted) return;
  const mine = m.senderUid === myUid;
  const myReact = m.reactions && m.reactions[myUid];
  openMenu(anchor, [
    { label: 'Copiar texto', icon: copySvg, action: () => copyText(m.text || '') },
    mine ? { label: 'Editar', icon: editSvg, action: () => startEditMessage(msgId, m.text || '') } : null,
    mine ? { label: 'Apagar', icon: trashSvg, danger: true, action: () => { if(confirm('Apagar esta mensagem?')) deleteMessage(convId, msgId); } } : null
  ], { reactions: { current: myReact, onPick: emo => reactToMessage(convId, msgId, emo, myReact === emo) } });
}

function renderDemandChips(){
  const box = byId('sideChips'); if(!box) return;
  const st = [['', 'Todas'], ['aberta', 'Abertas'], ['em_andamento', 'Em andamento'], ['concluida', 'Concluídas'], ['cancelada', 'Canceladas']];
  let html = '';
  if(isAdmin){
    html += `<div class="seg seg-sm" role="group" aria-label="Escopo"><button data-scope="mine" class="${demandScopeFilter === 'mine' ? 'on' : ''}">Minhas</button><button data-scope="all" class="${demandScopeFilter === 'all' ? 'on' : ''}">De todos</button></div>`;
  }
  html += st.map(([k, l]) => `<button class="chip${demandStatusFilter === k ? ' on' : ''}" data-st="${k}">${l}</button>`).join('');
  html += `<button class="chip${showArchivedDemands ? ' on' : ''}" data-arch="1">${archiveSvg}Arquivadas</button>`;
  box.innerHTML = html;
  box.querySelectorAll('[data-scope]').forEach(b => { b.onclick = () => { demandScopeFilter = b.getAttribute('data-scope'); renderDemandsList(); }; });
  box.querySelectorAll('[data-st]').forEach(b => { b.onclick = () => { demandStatusFilter = b.getAttribute('data-st'); renderDemandsList(); }; });
  box.querySelectorAll('[data-arch]').forEach(b => { b.onclick = () => { showArchivedDemands = !showArchivedDemands; renderDemandsList(); }; });
}

function renderDemandRow(d){
  const lr = d.lastReadAt && d.lastReadAt[myUid] ? d.lastReadAt[myUid].toMillis() : 0;
  const up = d.updatedAt ? d.updatedAt.toMillis() : 0;
  const unread = up > lr;
  const overdue = isDemandOverdue(d);
  const dueSoon = isDemandDueSoon(d);
  const pinned = d.pinned && d.pinned[myUid];
  const whoLine = isAdmin
    ? `${d.createdByName || '—'} → ${(d.assignedToNames || []).join(', ') || '—'}`
    : (d.createdBy === myUid ? ((d.assignedTo || []).length === 1 && d.assignedTo[0] === myUid ? 'para mim' : `para ${(d.assignedToNames || []).join(', ') || '—'}`) : `de ${d.createdByName || '—'}`);
  const iCreated = d.createdBy === myUid;
  const avName = iCreated ? ((d.assignedToNames || [])[0] || '?') : (d.createdByName || '?');
  const avKey = iCreated ? ((d.assignedTo || [])[0] || avName) : (d.createdBy || avName);
  const prazo = d.deadline ? formatDeadline(d.deadline) : 'sem prazo';
  const active = demandView && demandView.type === 'detail' && demandView.id === d.id && (!isMobile() || mainOpen);
  const flag = overdue ? '<span class="pill danger">VENCIDA</span>' : (dueSoon ? '<span class="pill warn">vence em breve</span>' : '');
  return `<div class="row${active ? ' active' : ''}${unread ? ' unread' : ''}" role="button" tabindex="0" data-open-demand="${escapeAttr(d.id)}">
    ${avatarHtml(avName, avKey)}
    <div class="row-main">
      <div class="row-top">
        <span class="row-title">${pinned ? `<span class="row-star">${starFilledSvg}</span>` : ''}<span>${escapeHtml(d.title)}</span></span>
        <span class="row-time${unread ? ' hot' : ''}">${escapeHtml(listTime(up))}</span>
      </div>
      <div class="row-bottom">
        <span class="row-sub"><span class="sub-txt">${escapeHtml(whoLine)} · prazo ${escapeHtml(prazo)}</span></span>
        <span class="row-meta">${unread ? '<span class="count-badge dot" title="Atualização não lida"></span>' : ''}</span>
      </div>
      <div class="row-tags">
        <span class="pill st-${escapeAttr(d.status)}">${statusLabel(d.status)}</span>
        <span class="pill prio-${escapeAttr(d.priority || 'normal')}">${priorityLabel(d.priority)}</span>
        ${flag}
      </div>
    </div>
  </div>`;
}

function renderDemandsList(){
  if(section !== 'demands') return;
  const list = byId('sideList'); if(!list) return;
  const prevScroll = list.scrollTop;
  renderDemandChips();
  const filtered = myDemands.filter(demandMatchesFilters);
  if(!filtered.length){
    list.innerHTML = `<div class="list-empty">${showArchivedDemands ? 'Nenhuma demanda arquivada.' : 'Nenhuma demanda encontrada.'}</div>`;
  } else if(demandBoardView){
    const groups = ['aberta', 'em_andamento', 'concluida', 'cancelada'];
    list.innerHTML = groups.map(g => {
      const items = filtered.filter(d => d.status === g);
      if(!items.length) return '';
      return `<div class="list-section">${statusLabel(g)} · ${items.length}</div>` + items.map(renderDemandRow).join('');
    }).join('');
  } else {
    list.innerHTML = filtered.map(renderDemandRow).join('');
  }
  list.querySelectorAll('[data-open-demand]').forEach(row => onActivate(row, () => openDemand(row.getAttribute('data-open-demand'))));
  list.scrollTop = prevScroll;
}

function openDemand(id){
  if(!(demandView && demandView.type === 'detail' && demandView.id === id)){
    if(unsubDemandUpdates){ unsubDemandUpdates(); unsubDemandUpdates = null; }
    demandHistoryOpen = false;
  }
  demandView = { type: 'detail', id };
  openMain();
  renderDemandModal();
}

// mantém o nome antigo: criar/excluir/fixar/reatribuir chamam renderDemandModal()
function renderDemandModal(){
  if(section !== 'demands') return;
  renderDemandsList();

  if(demandView && demandView.type === 'reassign'){
    const id = demandView.id;
    demandView = { type: 'detail', id };
    renderDemandDetail(main);
    showReassignModal(id);
    return;
  }
  if(demandView === 'new'){ renderNewDemandForm(main); return; }

  mainOpen = false; applyShell();
  renderEmptyMain();
}

function refreshDemandDetail(){
  if(section !== 'demands' || !demandView || demandView.type !== 'detail') return;
  const d = myDemands.find(x => x.id === demandView.id);
  if(!d || mainKey !== 'demand:' + d.id) return;
  renderDemandHead(d);
  const sig = JSON.stringify([d.title, d.description, d.status, d.priority, d.deadline, d.createdByName, d.assignedToNames, d.checklist, d.recurrence, isAdmin, isDemandOverdue(d), isDemandDueSoon(d)]);
  if(sig === demandInfoSig) return;
  demandInfoSig = sig;
  renderDemandInfo(d);
}

function listenDemandUpdates(demandId){
  if(unsubDemandUpdates) unsubDemandUpdates();
  let firstLoad = true, prevCount = 0;
  unsubDemandUpdates = db.collection('demands').doc(demandId).collection('updates')
    .orderBy('createdAt', 'asc')
    .limitToLast(200)
    .onSnapshot(snap => {
      const thread = byId('demandUpdates'), scroller = byId('demandScroll');
      if(!thread || !scroller || !demandView || demandView.id !== demandId) return;
      const nearBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
      const docs = snap.docs;
      let html = '', lastDay = '', prevAuthor = null;
      docs.forEach(dd => {
        const m = dd.data();
        const mine = m.authorUid === myUid;
        const canDel = !m.deleted && (mine || isAdmin);
        const date = m.createdAt ? m.createdAt.toDate() : new Date();
        const dk = dayKey(date);
        if(dk !== lastDay){ html += `<div class="day-sep"><span>${escapeHtml(dayLabel(date))}</span></div>`; lastDay = dk; prevAuthor = null; }
        const first = prevAuthor !== m.authorUid; prevAuthor = m.authorUid;
        const when = m.createdAt ? hhmm(date) : '';
        html += `<div class="msg ${mine ? 'mine' : 'theirs'} ${first ? 'first' : 'grouped'}" data-updid="${dd.id}" data-candel="${canDel ? '1' : ''}">
          <div class="bubble">
            ${!m.deleted ? `<button class="msg-menu-btn" data-updmenu="${dd.id}" title="Opções" aria-label="Opções da mensagem">${chevDownSvg}</button>` : ''}
            ${!mine && first ? `<div class="msg-author" style="color:${avColor(m.authorUid || m.authorName)}">${escapeHtml(m.authorName || '—')}</div>` : ''}
            <div class="msg-text">${m.deleted ? `<span class="deleted-txt">${banSvg}${escapeHtml(m.text)}</span>` : linkify(escapeHtml(m.text || ''))}<span class="meta-spacer" style="width:40px"></span></div>
            <span class="msg-meta">${when}</span>
          </div>
        </div>`;
      });
      thread.innerHTML = html || `<div class="thread-hint">Nenhuma atualização ainda.<br>Escreva abaixo para conversar sobre esta demanda.</div>`;
      const last = docs[docs.length - 1];
      const newMine = last && last.data().authorUid === myUid && docs.length > prevCount;
      if((firstLoad && docs.length) || nearBottom || newMine) scroller.scrollTop = scroller.scrollHeight;
      firstLoad = false; prevCount = docs.length;
      const openUpdMenu = (anchor, id) => {
        const doc = docs.find(x => x.id === id); if(!doc) return;
        const m = doc.data(); if(m.deleted) return;
        const canDel = m.authorUid === myUid || isAdmin;
        openMenu(anchor, [
          { label: 'Copiar texto', icon: copySvg, action: () => copyText(m.text || '') },
          canDel ? { label: 'Apagar', icon: trashSvg, danger: true, action: () => { if(confirm('Apagar esta mensagem?')) deleteDemandUpdate(demandId, id); } } : null
        ]);
      };
      thread.querySelectorAll('[data-updmenu]').forEach(btn => { btn.onclick = e => { e.stopPropagation(); openUpdMenu(btn, btn.getAttribute('data-updmenu')); }; });
      thread.querySelectorAll('.msg[data-updid]').forEach(row => {
        const id = row.getAttribute('data-updid');
        const bubble = row.querySelector('.bubble');
        bubble.addEventListener('contextmenu', e => { if(e.target.closest('a')) return; e.preventDefault(); openUpdMenu(bubble, id); });
        addLongPress(bubble, () => openUpdMenu(bubble, id));
      });
    }, err => reportListenError('mensagens da demanda', err));
}

function autoMarkOpenDemandRead(){
  if(section !== 'demands' || !demandView || demandView.type !== 'detail') return;
  if(isMobile() && !mainOpen) return;
  if(document.visibilityState !== 'visible') return;
  const d = myDemands.find(x => x.id === demandView.id); if(!d) return;
  if(!(tsMs(d.updatedAt) > tsMs(d.lastReadAt && d.lastReadAt[myUid]))) return;
  const k = 'd_' + d.id, now = Date.now();
  if(now - (lastReadWrite[k] || 0) < 4000) return;
  lastReadWrite[k] = now;
  markDemandRead(d.id);
}

async function restringirTodasAbas(){
  const abertas = categories.filter(c => !(c.allowedUsers || []).length && !(c.allowedGroups || []).length);
  if(!abertas.length){ alert('Todas as abas já têm restrição.'); return; }
  if(!confirm(`${abertas.length} aba(s) hoje visíveis para todos vão passar a ser só de administradores:\n\n- ${abertas.map(c => c.name).join('\n- ')}\n\nDepois, libere cada aba para quem precisa (ícone de pessoas dentro da aba, ou Grupos de acesso). Continuar?`)) return;
  try{
    for(let i = 0; i < abertas.length; i += 400){
      const batch = db.batch();
      abertas.slice(i, i + 400).forEach(c => batch.update(db.collection('categories').doc(c.id), { allowedUsers: [SO_ADMIN] }));
      await batch.commit();
    }
    logActivity('restringiu todas as abas sem restrição', abertas.length + ' aba(s)');
    alert('Pronto: ' + abertas.length + ' aba(s) agora são só de administradores.');
  } catch(e){ alert('Erro ao restringir abas: ' + errMsg(e)); }
}

// =====================================================================
// NOTIFICAÇÕES COM O APP FECHADO (push)
// O aparelho se registra no Firebase Cloud Messaging; quando alguém envia uma
// mensagem, o painel avisa o servidor (Apps Script) e ele manda o push.
// Precisa de push-config.js preenchido (chave VAPID + endereço do Apps Script).
// Sem isso, tudo continua como antes (avisos só com o painel aberto).
// =====================================================================
const PUSH = window.PUSH_CONFIG || {};
let pushState = 'off';          // off | ok | erro | naoconfigurado | naosuportado
let pushBusy = false;
function pushConfigured(){ return !!(PUSH.vapidKey && PUSH.scriptUrl); }
function pushSupported(){
  try{
    return canUsePWA() && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window &&
      typeof firebase.messaging === 'function' && (!firebase.messaging.isSupported || firebase.messaging.isSupported());
  }catch(e){ return false; }
}
// chamada ao servidor: sem esperar resposta (o Apps Script não libera CORS para leitura)
async function pushCall(payload){
  const user = auth.currentUser;
  if(!user || !PUSH.scriptUrl) return;
  const idToken = await user.getIdToken();
  await fetch(PUSH.scriptUrl, {
    method: 'POST', mode: 'no-cors', keepalive: true,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ idToken }, payload))
  });
}
async function pushSetup(){
  if(pushBusy) return;
  if(!pushConfigured()){ pushState = 'naoconfigurado'; return; }
  if(!pushSupported()){ pushState = 'naosuportado'; return; }
  if(!myUid || !('Notification' in window) || Notification.permission !== 'granted') return;
  pushBusy = true;
  try{
    const reg = swReg || await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({ vapidKey: PUSH.vapidKey, serviceWorkerRegistration: reg });
    if(!token){ pushState = 'erro'; return; }
    let antigo = null; try{ antigo = localStorage.getItem('dc_push_token'); }catch(e){}
    let quem = null; try{ quem = localStorage.getItem('dc_push_uid'); }catch(e){}
    // só avisa o servidor quando o token ou o usuário mudou (e de vez em quando, para renovar)
    let ultimo = 0; try{ ultimo = +localStorage.getItem('dc_push_at') || 0; }catch(e){}
    if(token !== antigo || quem !== myUid || Date.now() - ultimo > 6 * 24 * 3600 * 1000){
      await pushCall({ action: 'registrar', fcmToken: token });
      try{ localStorage.setItem('dc_push_token', token); localStorage.setItem('dc_push_uid', myUid); localStorage.setItem('dc_push_at', String(Date.now())); }catch(e){}
    }
    pushState = 'ok';
  }catch(err){
    pushState = 'erro';
    console.info('Push desativado: ' + ((err && err.message) || err));
  }finally{
    pushBusy = false;
    if(section === 'settings' && myUid) renderSettingsList();
  }
}
let pushTimer = null;
function pushSetupSoon(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushSetup, 600); }
function pushNotifyMessage(convId){
  if(!pushConfigured()) return;
  pushCall({ action: 'msg', convId }).catch(() => {});
}
// demanda nova: o servidor (Apps Script, action 'demanda') manda o push para quem foi marcado
function pushNotifyDemand(demandId){
  if(!pushConfigured()) return;
  pushCall({ action: 'demanda', demandId }).catch(() => {});
}
// ao sair, tira este aparelho da lista (para o próximo usuário do mesmo celular não receber os avisos do anterior)
function pushUnregisterAndSignOut(){
  let token = null; try{ token = localStorage.getItem('dc_push_token'); }catch(e){}
  const sair = () => { try{ localStorage.removeItem('dc_push_uid'); }catch(e){} auth.signOut(); };
  if(!token || !pushConfigured()){ sair(); return; }
  Promise.race([pushCall({ action: 'desregistrar', fcmToken: token }), new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(sair);
}
function pushStateLabel(){
  if(pushState === 'ok') return 'Ativadas — também chegam com o app fechado';
  if(pushState === 'erro') return 'Ativadas neste navegador (aviso com app fechado indisponível agora)';
  return 'Ativadas neste navegador';
}

function registerSW(){
  if(!('serviceWorker' in navigator) || !canUsePWA()) return;
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data || {};
    if(d.type !== 'abrir') return;
    if(d.convId){
      if(myUid && myConversations.some(c => c.id === d.convId)) openThreadByConv(d.convId);
      else pendingDeepLink = { conv: d.convId };
    } else if(d.section && myUid) goSection(d.section);
  });
  const go = () => navigator.serviceWorker.register('sw.js')
    .then(reg => { swReg = reg; pushSetupSoon(); })
    .catch(err => console.info('App instalável desativado: sw.js não está publicado ao lado do index.html (' + ((err && err.message) || err) + ')'));
  if(document.readyState === 'complete') go(); else window.addEventListener('load', go);
}

let reqAprov = {};

function isAlmox(){ return isAdmin || (reqCfg.uids || []).includes(myUid); }
function reqMySetor(){ return isAlmox() ? '' : (appSetorUsers[myUid] || ''); }
function reqSetores(){ return (appSetores && appSetores.length) ? appSetores : REQ_SETORES_PADRAO; }
function reqProd(id){ return reqProducts.find(p => p.id === id); }
function reqDisp(p){ return (p.saldo || 0) - (p.reservado || 0); }
function reqLow(p){ return p.ativo !== false && reqDisp(p) < (p.estoqueMin || 0); }
function reqNum(n){ return 'REQ-' + String(n || 0).padStart(4, '0'); }
function reqMoney(v){ return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function reqMyName(){ return myChatName || (auth.currentUser && auth.currentUser.email) || 'Alguém'; }
function reqErr(e){ return (e && e.message) ? e.message : 'Não foi possível concluir. Tente de novo.'; }

function reqSeenSet(id, st){ const s = reqSeenGet(); if(s[id] === st) return; s[id] = st; try{ localStorage.setItem('dc_req_seen', JSON.stringify(s)); }catch(e){} }
function reqStamp(status){
  return {
    atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    atualizadoPor: myUid,
    historico: firebase.firestore.FieldValue.arrayUnion({ status, por: reqMyName(), em: Date.now() })
  };

// ---------- OUVINTES ----------
function listenRequisicao(){
  stopRequisicao();
  reqFirst = { p: true, r: true };
  unsubReqC = db.collection('almox_config').doc('geral').onSnapshot(doc => {
    const d = doc.data() || {};
    reqCfg = { uids: Array.isArray(d.uids) ? d.uids : [] };
    reqEnsureData();
    reqRefresh();
  }, err => reportListenError('almoxarifado (configuração)', err));
  unsubSetores = db.collection('config').doc('setores').onSnapshot(doc => {
    const d = doc.data() || {};
    appSetores = Array.isArray(d.lista) ? d.lista : null;
    appSetorUsers = d.porUsuario || {};
    reqEnsureData();
    reqRefresh();
  }, err => reportListenError('setores', err));
  unsubReqP = db.collection('almox_produtos').onSnapshot(snap => {
    reqProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(!reqFirst.p && isAlmox()){
      reqProducts.forEach(p => {
        const was = reqDispCache[p.id];
        if(was !== undefined && was >= (p.estoqueMin || 0) && reqLow(p)){
          reqAlert('Estoque abaixo do mínimo', `${p.descricao}: restam ${reqDisp(p)} ${p.unidade || ''} (mínimo ${p.estoqueMin || 0})`, null);
        }
      });
    }
    reqDispCache = {};
    reqProducts.forEach(p => { reqDispCache[p.id] = reqDisp(p); });
    reqFirst.p = false;
    reqRefresh();
  }, err => reportListenError('almoxarifado (produtos)', err));
  reqEnsureData();
}

function reqEnsureData(){
  const m = isAlmox();
  const modeKey = m + '|' + reqMySetor();
  if(reqAlmoxMode === modeKey) return;
  reqAlmoxMode = modeKey;
  if(unsubReqR){ unsubReqR(); unsubReqR = null; }
  if(unsubReqM){ unsubReqM(); unsubReqM = null; }
  reqFirst.r = true;
  const q = m
    ? db.collection('almox_requisicoes').orderBy('criadoEm', 'desc').limit(400)
    : (reqMySetor()
        ? db.collection('almox_requisicoes').where('setor', '==', reqMySetor())
        : db.collection('almox_requisicoes').where('criadoPor', '==', myUid));
  unsubReqR = q.onSnapshot(snap => {
    reqList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(!reqFirst.r){
      snap.docChanges().forEach(ch => {
        if(ch.doc.metadata.hasPendingWrites) return;
        const r = { id: ch.doc.id, ...ch.doc.data() };
        if(ch.type === 'added' && m && r.criadoPor !== myUid){
          reqAlert('Nova requisição ' + reqNum(r.numero), `${r.setor}${r.urgencia === 'urgente' ? ' · URGENTE' : ''} · ${(r.itens || []).length} item(ns)`, r.id);
        } else if(ch.type === 'modified'){
          const prev = reqStatusCache[r.id];
          if(prev && prev !== r.status && r.atualizadoPor !== myUid){
            if(r.criadoPor === myUid){
              const txt = {
                aprovada: 'Aprovada. A quantidade foi reservada para o seu setor.',
                separada: 'Separada. Pode retirar no almoxarifado.',
                entregue: 'Entregue.',
                recusada: 'Recusada' + (r.motivo ? ': ' + r.motivo : '.'),
                em_analise: 'O almoxarifado começou a analisar.'
              }[r.status];
              if(txt) reqAlert(reqNum(r.numero), txt, r.id);
            } else if(m && r.status === 'cancelada'){
              reqAlert(reqNum(r.numero) + ' cancelada', 'Cancelada pelo solicitante (' + (r.criadoPorNome || '—') + ').', r.id);
            }
          }
        }
      });
    }
    reqStatusCache = {};
    reqList.forEach(r => { reqStatusCache[r.id] = r.status; });
    reqFirst.r = false;
    reqRefresh();
  }, err => reportListenError('requisições', err));
  if(m){
    unsubReqM = db.collection('almox_movimentos').orderBy('data', 'desc').limit(500).onSnapshot(snap => {
      reqMoves = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      reqRefresh();
    }, err => reportListenError('movimentações do almoxarifado', err));
  }
}

function stopRequisicao(){
  [unsubReqC, unsubReqP, unsubReqR, unsubReqM, unsubSetores].forEach(u => { if(u) u(); });
  unsubReqC = unsubReqP = unsubReqR = unsubReqM = unsubSetores = null; appSetores = null; appSetorUsers = {};
  reqProducts = []; reqList = []; reqMoves = []; reqCfg = { uids: [] };
  reqAlmoxMode = null; reqView = null; reqCart = []; reqMode = 'fila';
  reqStatusCache = {}; reqDispCache = {}; reqAprov = {};
  const b = byId('reqBadge'); if(b) b.style.display = 'none';
}

function reqUpdateBadge(){
  const b = byId('reqBadge'); if(!b) return;
  let n = 0;
  if(isAlmox()) n = reqList.filter(r => r.status === 'aberta').length;
  else {
    const seen = reqSeenGet();
    n = reqList.filter(r => r.criadoPor === myUid && ['aprovada', 'separada', 'entregue', 'recusada'].includes(r.status) && seen[r.id] !== r.status).length;
  }
  if(n > 0){ b.style.display = 'inline-block'; b.textContent = n > 99 ? '99+' : n; } else b.style.display = 'none';
}

function reqRefresh(){
  reqUpdateBadge();
  if(section !== 'requisicao' || !byId('sideList')) return;
  renderReqList();
  if(!reqView) return;
  if(['req', 'prod', 'rel'].includes(reqView.type)){
    const sig = JSON.stringify([reqView, reqList, reqProducts, reqMoves, reqPeriod, reqSetorFilter, isAlmox()]);
    if(sig !== reqMainSig) renderReqMain();
  }
}

// ---------- ALERTAS (aviso na tela + notificação do sistema + som) ----------
function reqAlert(titulo, texto, reqId){
  try{ if(soundsOn()) playMessageSound(); }catch(e){}
  const container = byId('msnToastContainer');
  if(container){
    while(container.children.length >= 4) container.removeChild(container.firstChild);
    const toast = document.createElement('div');
    toast.className = 'msn-toast';
    toast.innerHTML = `
      <div class="msn-avatar">${reqBoxSvg}</div>
      <div class="msn-body"><div class="msn-name">${escapeHtml(titulo)}</div><div class="msn-text">${escapeHtml(texto)}</div></div>
      <button class="msn-close" title="Fechar">✕</button>`;
    const remove = () => { toast.classList.add('leaving'); setTimeout(() => toast.remove(), 260); };
    toast.querySelector('.msn-close').onclick = e => { e.stopPropagation(); remove(); };
    toast.onclick = () => {
      remove();
      reqMode = reqId ? 'fila' : 'estoque';
      goSection('requisicao');
      if(reqId) openReq(reqId);
    };
    container.appendChild(toast);
    setTimeout(remove, 7000);
  }
  if('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible'){
    const opts = { body: texto, tag: 'req-' + (reqId || 'estoque'), renotify: true, icon: 'icons/icon-192.png', badge: 'icons/badge-96.png', data: { section: 'requisicao' } };
    try{
      if(swReg && swReg.showNotification) swReg.showNotification(titulo, opts).catch(() => {});
      else new Notification(titulo, opts);
    }catch(e){}
  }
}

  }
  if(isAdmin){
    items.push({ label: 'Quem atende as requisições', icon: shieldSvg, action: showReqConfigModal });
    items.push({ label: 'Setores e centros de custo', icon: reqBoxSvg, action: showSetoresModal });
  }
  if('Notification' in window && Notification.permission === 'default'){
    items.push({ label: 'Ativar notificações', icon: bellSvg, action: () => { try{ Notification.requestPermission().then(pushSetupSoon); }catch(e){} } });
  }
  return items.length ? items : [{ label: 'Nova requisição', icon: plusSvg, action: reqStartNew }];
}

function reqStartNew(){
  reqMode = 'catalogo';
  reqView = { type: 'cart' };
  openMain();
  renderReqList();
  renderReqMain();
}

function renderReqChips(){
  const box = byId('sideChips'); if(!box) return;
  const modes = [['fila', 'Requisições'], ['catalogo', 'Catálogo']];
  if(isAlmox()){ modes.push(['estoque', 'Estoque']); modes.push(['relatorio', 'Relatório']); }
  if(!modes.some(m => m[0] === reqMode)) reqMode = 'fila';
  box.innerHTML = modes.map(([k, l]) => `<button class="chip${reqMode === k ? ' on' : ''}" data-m="${k}">${l}${k === 'catalogo' && reqCart.length ? ' · ' + reqCart.length : ''}</button>`).join('');
  box.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => {
    reqMode = b.getAttribute('data-m');
    reqView = reqMode === 'catalogo' ? { type: 'cart' } : (reqMode === 'relatorio' ? { type: 'rel' } : null);
    renderReqList(); renderReqMain();
  }; });
  const box2 = byId('sideChips2');
  if(box2){
    if(reqMode === 'fila'){
      const st = [['', 'Todas'], ['aberta', 'Abertas'], ['em_analise', 'Em análise'], ['aprovada', 'Aprovadas'], ['separada', 'Separadas'], ['entregue', 'Entregues'], ['encerradas', 'Encerradas']];
      box2.innerHTML = st.map(([k, l]) => `<button class="chip${reqStatusFilter === k ? ' on' : ''}" data-st="${k}">${l}</button>`).join('');
      box2.querySelectorAll('[data-st]').forEach(b => { b.onclick = () => { reqStatusFilter = b.getAttribute('data-st'); renderReqList(); }; });
    } else box2.innerHTML = '';

      byId('reqSetorSel').onchange = e => { reqSetorFilter = e.target.value; renderReqList(); if(reqView && reqView.type === 'rel') renderReqMain(); };
    } else sb.innerHTML = '';
  }

function reqVisible(){
  const q = reqSearch;
  const open = ['aberta', 'em_analise'];
  return reqList.filter(r => {
    if(reqSetorFilter && r.setor !== reqSetorFilter) return false;
    if(reqStatusFilter === 'encerradas'){ if(!['recusada', 'cancelada'].includes(r.status)) return false; }
    else if(reqStatusFilter && r.status !== reqStatusFilter) return false;
    if(q && !(reqNum(r.numero) + ' ' + r.setor + ' ' + (r.criadoPorNome || '') + ' ' + (r.itens || []).map(i => i.descricao).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const pa = (open.includes(a.status) && a.urgencia === 'urgente') ? 0 : 1;
    const pb = (open.includes(b.status) && b.urgencia === 'urgente') ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return (tsMs(b.criadoEm) || Date.now()) - (tsMs(a.criadoEm) || Date.now());
  });
}

function reqFilaHtml(){
  const rows = reqVisible();
  if(!rows.length) return `<div class="list-empty">${isAlmox() ? 'Nenhuma requisição encontrada.' : 'Você ainda não fez requisições.<br>Toque em + para pedir insumos ao almoxarifado.'}</div>`;
  return rows.map(r => {
    const active = reqView && reqView.type === 'req' && reqView.id === r.id && (!isMobile() || mainOpen);
    const t = tsMs(r.criadoEm) || Date.now();
    return `<div class="row${active ? ' active' : ''}" role="button" tabindex="0" data-req-open="${escapeAttr(r.id)}">
      <div class="row-ico${r.urgencia === 'urgente' && ['aberta', 'em_analise'].includes(r.status) ? ' danger' : ''}">${reqBoxSvg}</div>
      <div class="row-main">
        <div class="row-top"><span class="row-title"><span>${escapeHtml(reqNum(r.numero))} · ${escapeHtml(r.setor || '')}</span></span><span class="row-time">${escapeHtml(listTime(t))}</span></div>
        <div class="row-bottom"><span class="row-sub"><span class="sub-txt">${(r.itens || []).length} item(ns) · ${escapeHtml(r.criadoPorNome || '—')}</span></span></div>
        <div class="row-tags">${reqPill(r.status)}${r.urgencia === 'urgente' ? '<span class="pill danger">URGENTE</span>' : ''}</div>
      </div></div>`;
  }).join('');
}

function reqCatalogHtml(){
  const q = reqSearch;
  const prods = reqProducts.filter(p => p.ativo !== false && (!q || ((p.codigo || '') + ' ' + (p.descricao || '') + ' ' + (p.categoria || '')).toLowerCase().includes(q)))
    .sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || (a.descricao || '').localeCompare(b.descricao || ''));
  if(!prods.length) return `<div class="list-empty">${reqProducts.length ? 'Nenhum produto encontrado.' : 'Nenhum produto cadastrado ainda.'}</div>`;
  let cat = null, html = '';

    if((p.categoria || 'Sem categoria') !== cat){ cat = p.categoria || 'Sem categoria'; html += `<div class="list-section">${escapeHtml(cat)}</div>`; }
    const inCart = reqCart.find(c => c.id === p.id);
    html += `<div class="row" role="button" tabindex="0" data-req-add="${escapeAttr(p.id)}">
      ${p.foto ? `<img class="req-foto" src="${escapeAttr(p.foto)}" alt="" style="width:42px;height:42px;">` : `<div class="row-ico">${reqBoxSvg}</div>`}

        <div class="row-top"><span class="row-title"><span>${escapeHtml(p.descricao || '')}</span></span><span class="req-disp${reqLow(p) ? ' low' : ''}">${reqDisp(p)} ${escapeHtml(p.unidade || '')}</span></div>
        <div class="row-bottom"><span class="row-sub"><span class="sub-txt">${escapeHtml(p.codigo || '')}${p.localizacao ? ' · ' + escapeHtml(p.localizacao) : ''}${inCart ? ' · na requisição: ' + inCart.qty : ''}</span></span></div>
      </div></div>`;

  return html;
}

function reqEstoqueHtml(){

    .sort((a, b) => (reqLow(b) ? 1 : 0) - (reqLow(a) ? 1 : 0) || (a.descricao || '').localeCompare(b.descricao || ''));

        <div class="row-bottom"><span class="row-sub"><span class="sub-txt">${escapeHtml(p.codigo || '')} · saldo ${p.saldo || 0} · reservado ${p.reservado || 0} · mín. ${p.estoqueMin || 0}</span></span></div>
        ${p.ativo === false ? '<div class="row-tags"><span class="pill">Inativo</span></div>' : (reqLow(p) ? '<div class="row-tags"><span class="pill danger">Abaixo do mínimo</span></div>' : '')}

function reqRelSetoresHtml(){
  const nomes = ['', ...reqSetores().map(s => s.nome)];
  return nomes.map(n => `<div class="row${reqSetorFilter === n ? ' active' : ''}" role="button" tabindex="0" data-req-setor="${escapeAttr(n)}">
    <div class="row-ico">${chartSvg}</div>
    <div class="row-main"><div class="row-top"><span class="row-title"><span>${n ? escapeHtml(n) : 'Todos os setores'}</span></span></div></div></div>`).join('');

function renderReqList(){
  if(section !== 'requisicao') return;
  const list = byId('sideList'); if(!list) return;
  const prev = list.scrollTop;
  renderReqChips();
  list.innerHTML = reqMode === 'fila' ? reqFilaHtml() : reqMode === 'catalogo' ? reqCatalogHtml() : reqMode === 'estoque' ? reqEstoqueHtml() : reqRelSetoresHtml();
  list.querySelectorAll('[data-req-open]').forEach(r => onActivate(r, () => openReq(r.getAttribute('data-req-open'))));
  list.querySelectorAll('[data-req-add]').forEach(r => onActivate(r, () => reqAddToCart(r.getAttribute('data-req-add'))));
  list.querySelectorAll('[data-req-prod]').forEach(r => onActivate(r, () => openReqProd(r.getAttribute('data-req-prod'))));
  list.querySelectorAll('[data-req-setor]').forEach(r => onActivate(r, () => {
    reqSetorFilter = r.getAttribute('data-req-setor'); reqView = { type: 'rel' }; openMain(); renderReqList(); renderReqMain();
  }));
  list.scrollTop = prev;
}

// ---------- PAINEL PRINCIPAL ----------
function renderReqMain(){
  if(section !== 'requisicao') return;
  const main = byId('mainPane'); if(!main) return;
  reqMainSig = JSON.stringify([reqView, reqList, reqProducts, reqMoves, reqPeriod, reqSetorFilter, isAlmox()]);
  mainKey = 'req:' + JSON.stringify(reqView);
  if(!reqView){ renderEmptyMain(); return; }
  if(reqView.type === 'cart') return renderReqCart(main);
  if(reqView.type === 'req'){
    const r = reqList.find(x => x.id === reqView.id);
    if(!r){ reqView = null; renderEmptyMain(); return; }
    return renderReqDetail(main, r);
  }
  if(reqView.type === 'prod'){
    const p = reqProd(reqView.id);
    if(!p){ reqView = null; renderEmptyMain(); return; }
    return renderReqProd(main, p);
  }
  if(reqView.type === 'prodform') return renderReqProdForm(main, reqProd(reqView.id));
  if(reqView.type === 'rel') return renderReqReport(main);
}

function reqHead(icon, title, sub, extra){

    <div class="row-ico" style="width:38px;height:38px;">${icon}</div>
    <div class="pane-titles"><div class="pane-title"><span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(title)}</span></div><div class="pane-sub">${sub}</div></div>
    ${extra || ''}</div>`;
}
function reqBindBack(){ const b = byId('reqBack'); if(b) b.onclick = goBack; }

function openReq(id){
  reqView = { type: 'req', id };
  const r = reqList.find(x => x.id === id);
  if(r && r.criadoPor === myUid) reqSeenSet(id, r.status);
  openMain();
  renderReqList();
  renderReqMain();
  reqUpdateBadge();
}
function openReqProd(id){ reqView = { type: 'prod', id }; openMain(); renderReqList(); renderReqMain(); }
function openReqProdForm(id){ reqMode = 'estoque'; reqView = { type: 'prodform', id }; goSection('requisicao'); openMain(); renderReqList(); renderReqMain(); }

// ----- carrinho / nova requisição -----
function reqAddToCart(pid){
  const p = reqProd(pid); if(!p) return;
  const ex = reqCart.find(c => c.id === pid);
  if(ex) ex.qty += 1; else reqCart.push({ id: pid, qty: 1 });
  showSnack('Adicionado: ' + p.descricao);
  reqView = { type: 'cart' };
  renderReqList();
  if(!isMobile() || mainOpen) renderReqMain();
}

function renderReqCart(main){
  const fixo = reqMySetor();
  if(fixo) reqForm.setor = fixo;
  else if(!reqForm.setor || !reqSetores().some(s => s.nome === reqForm.setor)) reqForm.setor = getPref('dc_req_setor', '') || reqSetores()[0].nome;
  const items = reqCart.map(c => ({ c, p: reqProd(c.id) })).filter(x => x.p);
  main.innerHTML = reqHead(reqCartSvg, 'Nova requisição', `${items.length} item(ns) · o saldo só é reservado quando o almoxarifado aprovar`) + `
    <div class="pane-body"><div class="form-pane">
      ${items.length ? `<div class="card-list">${items.map(({ c, p }) => `
        <div class="req-cart-row">
          <div class="rc-main"><div class="rc-name">${escapeHtml(p.descricao)}</div><div class="rc-sub">${escapeHtml(p.codigo || '')} · disponível ${reqDisp(p)} ${escapeHtml(p.unidade || '')}</div></div>
          <input type="number" min="1" step="1" class="f-input rc-qty" data-qid="${escapeAttr(p.id)}" value="${c.qty}" aria-label="Quantidade de ${escapeAttr(p.descricao)}" />
          <span class="rc-un">${escapeHtml(p.unidade || '')}</span>
          <button class="head-btn sm" data-rm="${escapeAttr(p.id)}" title="Remover" aria-label="Remover">${xSvg}</button>
        </div>`).join('')}</div>`
      : `<div class="list-empty">Nenhum item ainda.<br>${isMobile() ? 'Volte e toque' : 'Toque'} em um produto do catálogo para adicionar.</div>`}
      <div class="field-row">
        <div class="field"><label class="f-label" for="rqSetor">Setor (centro de custo)${fixo ? ' · definido pelo administrador' : ''}</label>
          <select id="rqSetor" class="f-input"${fixo ? ' disabled' : ''}>${(fixo ? reqSetores().filter(x => x.nome === fixo) : reqSetores()).map(s => `<option value="${escapeAttr(s.nome)}"${s.nome === reqForm.setor ? ' selected' : ''}>${escapeHtml(s.nome)}${s.cc ? ' · ' + escapeHtml(s.cc) : ''}</option>`).join('')}</select></div>
        <div class="field"><label class="f-label" for="rqUrg">Urgência</label>
          <select id="rqUrg" class="f-input"><option value="normal"${reqForm.urgencia === 'normal' ? ' selected' : ''}>Normal</option><option value="urgente"${reqForm.urgencia === 'urgente' ? ' selected' : ''}>Urgente</option></select></div>
      </div>
      <div class="field"><label class="f-label" for="rqJust">Justificativa</label>
        <textarea id="rqJust" class="f-input" rows="3" placeholder="Para que será usado?">${escapeHtml(reqForm.just)}</textarea></div>
      <div class="req-err" id="rqErr" style="display:${reqForm.erro ? 'block' : 'none'}">${escapeHtml(reqForm.erro)}</div>
      <div class="req-note">Se pedir mais do que há disponível, o almoxarifado pode aprovar só uma parte. A baixa no estoque acontece na entrega.</div>
      <div class="form-actions"><button class="btn" id="rqClear" type="button">Limpar</button><button class="btn primary" id="rqSend" type="button">Enviar requisição</button></div>
    </div></div>`;
  reqBindBack();
  main.querySelectorAll('[data-qid]').forEach(inp => { inp.oninput = () => {
    const c = reqCart.find(x => x.id === inp.getAttribute('data-qid')); if(c) c.qty = Math.max(1, Math.floor(+inp.value || 1));
    renderReqChips();
  }; });
  main.querySelectorAll('[data-rm]').forEach(b => { b.onclick = () => { reqCart = reqCart.filter(c => c.id !== b.getAttribute('data-rm')); renderReqList(); renderReqMain(); }; });
  byId('rqSetor').onchange = e => { reqForm.setor = e.target.value; setPref('dc_req_setor', reqForm.setor); };
  byId('rqUrg').onchange = e => { reqForm.urgencia = e.target.value; };
  byId('rqJust').oninput = e => { reqForm.just = e.target.value; };
  byId('rqClear').onclick = () => { reqCart = []; reqForm.just = ''; reqForm.erro = ''; renderReqList(); renderReqMain(); };
  byId('rqSend').onclick = reqSubmit;
}

async function reqSubmit(){
  const itens = reqCart.map(c => ({ c, p: reqProd(c.id) })).filter(x => x.p && x.c.qty > 0).map(({ c, p }) => ({
    produtoId: p.id, codigo: p.codigo || '', descricao: p.descricao || '', unidade: p.unidade || '', pedido: c.qty, aprovada: 0, entregue: 0
  }));
  if(!itens.length){ reqForm.erro = 'Adicione ao menos um item.'; renderReqMain(); return; }
  const setor = reqSetores().find(s => s.nome === reqForm.setor) || reqSetores()[0];
  const btn = byId('rqSend'); if(btn) btn.disabled = true;
  let newId = null;
  try{
    await db.runTransaction(async tx => {
      const cref = db.collection('almox_config').doc('contador');
      const cs = await tx.get(cref);
      const n = (cs.exists && cs.data().proximo) || 1;
      const rref = db.collection('almox_requisicoes').doc();
      tx.set(cref, { proximo: n + 1 });
      tx.set(rref, {
        numero: n, status: 'aberta', setor: setor.nome, centroCusto: setor.cc || '', urgencia: reqForm.urgencia,
        justificativa: (reqForm.just || '').trim(), itens, criadoPor: myUid, criadoPorNome: reqMyName(),
        criadoEm: firebase.firestore.FieldValue.serverTimestamp(), atualizadoEm: firebase.firestore.FieldValue.serverTimestamp(),
        atualizadoPor: myUid, historico: [{ status: 'aberta', por: reqMyName(), em: Date.now() }]
      });
      newId = rref.id;
    });
    reqCart = []; reqForm.just = ''; reqForm.erro = '';
    reqPushNotify(newId, 'nova');
    showSnack('Requisição enviada ao almoxarifado.');
    reqMode = 'fila';
    reqView = { type: 'req', id: newId };
    renderReqList(); renderReqMain();
  }catch(e){
    reqForm.erro = reqErr(e); renderReqMain();
  }
}

// ----- detalhe da requisição -----
function renderReqDetail(main, r){
  const almox = isAlmox();
  const editing = almox && r.status === 'em_analise';
  const idx = REQ_FLOW.indexOf(r.status);
  const steps = idx >= 0 ? REQ_FLOW.map((s, k) => `<span class="pill${k <= idx ? ' on' : ''}">${REQ_STATUS[s].label}</span>`).join('') : reqPill(r.status);
  const rows = (r.itens || []).map(it => {
    const p = reqProd(it.produtoId); const disp = p ? reqDisp(p) : 0;
    let ap;
    if(editing){
      const max = Math.max(0, Math.min(it.pedido, disp)); const key = r.id + '|' + it.produtoId;
      const v = reqAprov[key] !== undefined ? reqAprov[key] : max;
      ap = `<input type="number" class="f-input req-ap" min="0" max="${max}" data-pid="${escapeAttr(it.produtoId)}" value="${v}" aria-label="Quantidade a aprovar" />`;
    } else ap = String(it.aprovada || 0);
    return `<tr><td>${escapeHtml(it.descricao)}<div class="rc-sub">${escapeHtml(it.codigo || '')}</div></td>
      <td class="n">${it.pedido} ${escapeHtml(it.unidade || '')}</td>${almox ? `<td class="n">${disp}</td>` : ''}
      <td class="n">${ap}</td><td class="n">${it.entregue || 0}</td></tr>`;
  }).join('');
  const hist = (r.historico || []).slice().reverse().map(h => `<div class="req-hist-row"><b>${escapeHtml((REQ_STATUS[h.status] || { label: h.status }).label)}</b> · ${escapeHtml(h.por || '')} · ${escapeHtml(fmtDateTime(h.em))}</div>`).join('');
  let acts = '';
  if(almox && r.status === 'aberta') acts += '<button class="btn primary" id="rqIniciar" type="button">Iniciar análise</button>';
  if(editing) acts += '<button class="btn" id="rqRecusar" type="button">Recusar</button><button class="btn primary" id="rqAprovar" type="button">Aprovar</button>';
  if(almox && r.status === 'aprovada') acts += '<button class="btn primary" id="rqSeparar" type="button">Marcar como separada</button><button class="btn" id="rqLiberar" type="button">Cancelar e liberar reserva</button>';
  if(almox && r.status === 'separada') acts += '<button class="btn primary" id="rqEntregar" type="button">Confirmar entrega e dar baixa</button>';
  if(!almox && r.criadoPor === myUid && r.status === 'aberta') acts += '<button class="btn" id="rqCancelar" type="button">Cancelar requisição</button>';
  const printBtn = almox ? `<button class="head-btn" id="rqPrint" title="Imprimir para assinatura" aria-label="Imprimir para assinatura">${printSvg}</button>` : '';
  main.innerHTML = reqHead(reqBoxSvg, reqNum(r.numero) + ' · ' + (r.setor || ''), escapeHtml((REQ_STATUS[r.status] || { label: r.status }).label) + (r.urgencia === 'urgente' ? ' · URGENTE' : ''), printBtn) + `
    <div class="pane-body"><div class="form-pane">
      <div class="req-steps">${steps}</div>
      <div class="req-note">Solicitante: <b>${escapeHtml(r.criadoPorNome || '—')}</b> · Centro de custo: <b>${escapeHtml(r.setor || '')}${r.centroCusto ? ' (' + escapeHtml(r.centroCusto) + ')' : ''}</b> · Aberta em ${escapeHtml(fmtDateTime(tsMs(r.criadoEm) || Date.now()))}</div>
      ${r.justificativa ? `<div class="req-note"><b>Justificativa:</b> ${escapeHtml(r.justificativa)}</div>` : ''}
      ${r.status === 'recusada' && r.motivo ? `<div class="req-err">Recusada: ${escapeHtml(r.motivo)}</div>` : ''}
      <div class="req-scroll"><table class="req-table"><thead><tr><th>Item</th><th class="n">Pedido</th>${almox ? '<th class="n">Disp.</th>' : ''}<th class="n">${editing ? 'Aprovar' : 'Aprovada'}</th><th class="n">Entregue</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${editing ? `<div class="req-note">Aprovando menos do que o pedido, o restante fica sem atendimento nesta requisição. Ao aprovar, a quantidade fica reservada; a baixa só acontece na entrega.</div>
        <div class="field"><label class="f-label" for="rqMotivo">Motivo (obrigatório para recusar)</label><textarea id="rqMotivo" class="f-input" rows="2"></textarea></div>` : ''}
      <div class="req-err" id="rqErr" style="display:none"></div>
      ${acts ? `<div class="req-acts">${acts}</div>` : ''}
      ${hist ? `<div class="sec-title">Histórico</div>${hist}` : ''}
    </div></div>`;
  reqBindBack();
  const bind = (id, fn) => { const el = byId(id); if(el) el.onclick = fn; };
  main.querySelectorAll('.req-ap').forEach(inp => { inp.oninput = () => { reqAprov[r.id + '|' + inp.getAttribute('data-pid')] = Math.max(0, Math.floor(+inp.value || 0)); }; });
  bind('rqPrint', () => printReqSheet(r.id));
  bind('rqIniciar', () => reqSimple(r.id, 'em_analise', ['aberta']));
  bind('rqSeparar', () => reqSimple(r.id, 'separada', ['aprovada']));
  bind('rqCancelar', () => reqSimple(r.id, 'cancelada', ['aberta']));
  bind('rqAprovar', () => reqApprove(r.id));
  bind('rqRecusar', () => reqRefuse(r.id));
  bind('rqLiberar', () => reqReleaseCancel(r.id));
  bind('rqEntregar', () => reqDeliver(r.id));
}

function reqShowErr(msg){ const el = byId('rqErr'); if(el){ el.textContent = msg; el.style.display = 'block'; } else showSnack(msg); }

async function reqSimple(id, status, from){
  try{
    await db.runTransaction(async tx => {
      const ref = db.collection('almox_requisicoes').doc(id); const s = await tx.get(ref);
      if(!s.exists || !from.includes(s.data().status)) throw new Error('O status desta requisição mudou. Atualize a tela.');
      tx.update(ref, { status, ...reqStamp(status) });
    });
    reqPushNotify(id, status);
  }catch(e){ reqShowErr(reqErr(e)); }
}

async function reqApprove(id){
  const qty = {};
  document.querySelectorAll('.req-ap').forEach(el => { qty[el.getAttribute('data-pid')] = Math.max(0, Math.floor(+el.value || 0)); });
  try{
    await db.runTransaction(async tx => {
      const rref = db.collection('almox_requisicoes').doc(id);
      const rs = await tx.get(rref); const cur = rs.data();
      if(!cur || !['aberta', 'em_analise'].includes(cur.status)) throw new Error('Esta requisição já foi tratada por outra pessoa.');
      const prefs = cur.itens.map(it => db.collection('almox_produtos').doc(it.produtoId));
      const snaps = await Promise.all(prefs.map(p => tx.get(p)));
      let total = 0, parcial = false;
      const itens = cur.itens.map((it, i) => {
        const p = snaps[i].data() || {}; const disp = (p.saldo || 0) - (p.reservado || 0);
        const ap = Math.min(qty[it.produtoId] || 0, it.pedido);
        if(ap > disp) throw new Error(`${it.descricao}: só há ${disp} disponível.`);
        total += ap; if(ap < it.pedido) parcial = true;
        return { ...it, aprovada: ap };
      });
      if(!total) throw new Error('Nenhum item aprovado. Use Recusar e informe o motivo.');
      itens.forEach((it, i) => { if(it.aprovada > 0) tx.update(prefs[i], { reservado: ((snaps[i].data().reservado) || 0) + it.aprovada }); });
      tx.update(rref, { status: 'aprovada', parcial, itens, ...reqStamp('aprovada') });
    });
    reqPushNotify(id, 'aprovada');
  }catch(e){ reqShowErr(reqErr(e)); }
}

async function reqRefuse(id){
  const motivo = ((byId('rqMotivo') || {}).value || '').trim();
  if(!motivo){ reqShowErr('Informe o motivo da recusa.'); return; }
  try{
    await db.runTransaction(async tx => {
      const ref = db.collection('almox_requisicoes').doc(id); const s = await tx.get(ref);
      if(!s.exists || !['aberta', 'em_analise'].includes(s.data().status)) throw new Error('O status desta requisição mudou. Atualize a tela.');
      tx.update(ref, { status: 'recusada', motivo, ...reqStamp('recusada') });
    });
    reqPushNotify(id, 'recusada');
  }catch(e){ reqShowErr(reqErr(e)); }
}

async function reqReleaseCancel(id){
  if(!confirm('Cancelar esta requisição e liberar a quantidade reservada?')) return;
  try{
    await db.runTransaction(async tx => {
      const rref = db.collection('almox_requisicoes').doc(id); const rs = await tx.get(rref); const cur = rs.data();
      if(!cur || cur.status !== 'aprovada') throw new Error('O status desta requisição mudou. Atualize a tela.');
      const prefs = cur.itens.map(it => db.collection('almox_produtos').doc(it.produtoId));
      const snaps = await Promise.all(prefs.map(p => tx.get(p)));
      cur.itens.forEach((it, i) => { if(it.aprovada > 0) tx.update(prefs[i], { reservado: Math.max(0, ((snaps[i].data() || {}).reservado || 0) - it.aprovada) }); });
      tx.update(rref, { status: 'cancelada', ...reqStamp('cancelada') });
    });
    reqPushNotify(id, 'cancelada');
  }catch(e){ reqShowErr(reqErr(e)); }
}

async function reqDeliver(id){
  try{
    await db.runTransaction(async tx => {
      const rref = db.collection('almox_requisicoes').doc(id); const rs = await tx.get(rref); const cur = rs.data();
      if(!cur || cur.status !== 'separada') throw new Error('O status desta requisição mudou. Atualize a tela.');
      const prefs = cur.itens.map(it => db.collection('almox_produtos').doc(it.produtoId));
      const snaps = await Promise.all(prefs.map(p => tx.get(p)));
      const itens = cur.itens.map((it, i) => {
        const p = snaps[i].data() || {};
        if((p.saldo || 0) < it.aprovada) throw new Error(`${it.descricao}: saldo insuficiente (${p.saldo || 0}). Lance uma entrada ou ajuste antes.`);
        return { ...it, entregue: it.aprovada, custoUnit: p.custo || 0 };
      });
      itens.forEach((it, i) => {
        if(!it.entregue) return;
        const p = snaps[i].data();
        const novoSaldo = (p.saldo || 0) - it.entregue;
        tx.update(prefs[i], { saldo: novoSaldo, reservado: Math.max(0, (p.reservado || 0) - it.entregue) });
        tx.set(db.collection('almox_movimentos').doc(), {
          tipo: 'saida', produtoId: it.produtoId, codigo: it.codigo, descricao: it.descricao, qtd: it.entregue, saldoApos: novoSaldo,
          reqId: id, reqNum: cur.numero, setor: cur.setor, obs: '', data: firebase.firestore.FieldValue.serverTimestamp(), por: myUid, porNome: reqMyName()
        });
      });
      tx.update(rref, { status: 'entregue', itens, entregueEm: firebase.firestore.FieldValue.serverTimestamp(), ...reqStamp('entregue') });
    });
    reqPushNotify(id, 'entregue');
  }catch(e){ reqShowErr(reqErr(e)); }
}

// ----- relatório por setor -----
function reqReportData(){
  const now = new Date(); let from = 0, to = Infinity;
  if(reqPeriod === 'mes') from = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  else if(reqPeriod === 'anterior'){ from = new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime(); to = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); }
  else if(reqPeriod === '90') from = Date.now() - 90 * 86400000;
  const del = reqList.filter(r => r.status === 'entregue').filter(r => { const t = tsMs(r.entregueEm) || tsMs(r.atualizadoEm); return t >= from && t < to; });
  const custoItem = it => (it.entregue || 0) * (it.custoUnit || (reqProd(it.produtoId) || {}).custo || 0);
  const porSetor = {};
  reqSetores().forEach(s => { porSetor[s.nome] = 0; });
  del.forEach(r => { porSetor[r.setor] = (porSetor[r.setor] || 0) + (r.itens || []).reduce((a, it) => a + custoItem(it), 0); });
  const agg = {};
  del.filter(r => !reqSetorFilter || r.setor === reqSetorFilter).forEach(r => (r.itens || []).forEach(it => {
    const a = agg[it.produtoId] || (agg[it.produtoId] = { nome: it.descricao, un: it.unidade, qtd: 0, valor: 0 });
    a.qtd += it.entregue || 0; a.valor += custoItem(it);
  }));
  const produtos = Object.values(agg).filter(a => a.qtd > 0).sort((a, b) => b.valor - a.valor);
  const total = produtos.reduce((a, p) => a + p.valor, 0);
  return { porSetor: Object.entries(porSetor).sort((a, b) => b[1] - a[1]), produtos, total, qtdReq: del.length };
}
const REQ_PERIODOS = [['mes', 'Mês atual'], ['anterior', 'Mês anterior'], ['90', 'Últimos 90 dias'], ['tudo', 'Tudo']];

    td{border-bottom:1px solid #ccc;padding:6px 8px;} .n{text-align:right;}
    .sig{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:70px;font-size:12.5px;} .sig div{border-top:1px solid #222;padding-top:5px;}
    .box{border:1px solid #999;padding:8px 10px;font-size:12.5px;margin:8px 0;}
  </style></head><body>${bodyHtml}</body></html>`;
  const w = window.open('', '_blank');
  if(!w){ showSnack('Permita pop-ups para imprimir.'); return; }

  w.onload = () => w.print();
}

    <textarea id="stTxt" class="f-input" rows="6" style="margin-bottom:12px;">${escapeHtml(txt)}</textarea>

    <div class="req-err" id="stErr" style="display:none;margin-bottom:10px;"></div>

  };
}

// ----- importar produtos da planilha (aba ESTOQUE INSUMOS) -----
function reqNorm(t){ return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function reqParseNum(v){
  let t = String(v == null ? '' : v).replace(/R\$/g, '').replace(/\s/g, '');
  if(!t || t === '-') return 0;
  const neg = /^\(.*\)$/.test(t) || t.startsWith('-');
  t = t.replace(/[()\-]/g, '');
  if(t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = parseFloat(t);
  return isNaN(n) ? 0 : (neg ? -n : n);
}
function reqParseTable(text){
  const first = text.split('\n')[0] || '';
  const sep = first.includes('\t') ? '\t' : ((first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"' && text[i + 1] === '"'){ cur += '"'; i++; } else if(ch === '"') q = false; else cur += ch; }
    else if(ch === '"') q = true;
    else if(ch === sep){ row.push(cur); cur = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if(row.some(c => c.trim())) rows.push(row); row = []; }
    else cur += ch;
  }
  row.push(cur); if(row.some(c => c.trim())) rows.push(row);
  return rows;
}
function reqBuildImport(text){
  const rows = reqParseTable(text);
  if(rows.length < 2) return { erro: 'Não encontrei linhas. Cole a aba com o cabeçalho (Insumo, Cor, Categoria, Unidade…).' };
  const head = rows[0].map(reqNorm);
  const col = f => head.findIndex(f);
  const ix = {
    nome: col(h => h === 'insumo' || h === 'produto' || h === 'descricao'), cor: col(h => h === 'cor'), cat: col(h => h === 'categoria'),
    un: col(h => h === 'unidade'), min: col(h => h.startsWith('estoque min')), saldo: col(h => h.startsWith('saldo')), custo: col(h => h.startsWith('custo'))
  };
  if(ix.nome < 0) return { erro: 'Não achei a coluna "Insumo" no cabeçalho.' };
  const byName = {}; reqProducts.forEach(p => { byName[reqNorm(p.descricao)] = p; });
  let seq = reqProducts.reduce((m, p) => { const k = /^INS-(\d+)$/.exec(p.codigo || ''); return k ? Math.max(m, +k[1]) : m; }, 0);
  const itens = [], vistos = {}; let negativos = 0;
  rows.slice(1).forEach(r => {
    const nome = (r[ix.nome] || '').trim(); if(!nome) return;
    const cor = ix.cor >= 0 ? (r[ix.cor] || '').trim() : '';
    const descricao = nome + (cor ? ' ' + cor : '');
    const k = reqNorm(descricao); if(vistos[k]) return; vistos[k] = 1;
    let un = ix.un >= 0 ? (r[ix.un] || '').trim() : 'un'; if(!un) un = 'un'; if(/^(un|m|kg|l|cx|pct|rolo)$/i.test(un)) un = un.toLowerCase();
    let saldo = ix.saldo >= 0 ? Math.round(reqParseNum(r[ix.saldo])) : 0;
    if(saldo < 0){ negativos++; saldo = 0; }
    const ex = byName[k];
    itens.push({
      ex, descricao, categoria: ix.cat >= 0 ? (r[ix.cat] || '').trim() : '', unidade: un,
      estoqueMin: ix.min >= 0 ? Math.max(0, Math.round(reqParseNum(r[ix.min]))) : 0, saldo,
      custo: ix.custo >= 0 ? Math.max(0, reqParseNum(r[ix.custo])) : 0,
      codigo: ex ? ex.codigo : 'INS-' + String(++seq).padStart(3, '0')
    });
  });
  if(!itens.length) return { erro: 'Nenhum insumo encontrado.' };
  return { itens, negativos, novos: itens.filter(i => !i.ex).length, existentes: itens.filter(i => i.ex).length };
}

function showReqImportModal(){
  if(!isAlmox()) return;
  const root = byId('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal" style="max-width:520px;max-height:90vh;overflow:auto;">
    <h3>Importar da planilha</h3>
    <div class="req-note" style="margin-bottom:8px;">Na planilha, abra a aba <b>ESTOQUE INSUMOS</b>, selecione as colunas com o cabeçalho, copie e cole abaixo. Também aceita um arquivo CSV exportado da aba. Produtos já cadastrados são atualizados pelo nome.</div>
    <input id="imFile" type="file" accept=".csv,.tsv,.txt" style="margin-bottom:8px;" />
    <textarea id="imTxt" class="f-input" rows="6" placeholder="Insumo   Cor   Categoria   Unidade   Estoque mínimo   Saldo atual   Status   Custo unit. (R$)…"></textarea>
    <label class="assignee-row" style="margin:10px 0;"><input type="checkbox" id="imSaldo" /><span>Também ajustar o saldo dos produtos já cadastrados ao da planilha (gera movimentação de ajuste). Produtos novos entram sempre com o saldo da planilha.</span></label>
    <div class="req-note" id="imPrev" style="margin-bottom:8px;"></div>
    <div class="req-err" id="imErr" style="display:none;margin-bottom:10px;"></div>
    <div class="actions"><button class="cancel" id="imCancel">Cancelar</button><button class="confirm" id="imOk" disabled>Importar</button></div></div></div>`;
  let plano = null;
  const analisar = () => {
    const t = byId('imTxt').value; const prev = byId('imPrev'), ok = byId('imOk'); byId('imErr').style.display = 'none';
    if(!t.trim()){ prev.textContent = ''; ok.disabled = true; plano = null; return; }
    plano = reqBuildImport(t);
    if(plano.erro){ prev.textContent = ''; const e = byId('imErr'); e.textContent = plano.erro; e.style.display = 'block'; ok.disabled = true; plano = null; return; }
    prev.innerHTML = `<b>${plano.novos}</b> novo(s) · <b>${plano.existentes}</b> para atualizar${plano.negativos ? ` · ${plano.negativos} com saldo negativo na planilha (entram com 0)` : ''}.`;
    ok.disabled = false;
  };
  byId('imTxt').oninput = analisar;
  byId('imFile').onchange = e => { const f = e.target.files && e.target.files[0]; if(!f) return; const fr = new FileReader(); fr.onload = () => { byId('imTxt').value = String(fr.result || ''); analisar(); }; fr.readAsText(f, 'utf-8'); };
  byId('imCancel').onclick = () => { root.innerHTML = ''; };
  byId('modalBg').onclick = e => { if(e.target.id === 'modalBg') root.innerHTML = ''; };
  byId('imOk').onclick = async () => {
    if(!plano) return;
    const ajustar = byId('imSaldo').checked; const ok = byId('imOk'); ok.disabled = true; ok.textContent = 'Importando…';
    const ts = firebase.firestore.FieldValue.serverTimestamp(); let feitos = 0, pulados = 0;
    try{
      for(let i = 0; i < plano.itens.length; i += 150){
        const batch = db.batch();
        plano.itens.slice(i, i + 150).forEach(it => {
          const base = { codigo: it.codigo, descricao: it.descricao, categoria: it.categoria, unidade: it.unidade, estoqueMin: it.estoqueMin };
          const mov = (ref, delta, saldoApos) => batch.set(db.collection('almox_movimentos').doc(), {
            tipo: delta >= 0 && !it.ex ? 'entrada' : 'ajuste', produtoId: ref.id, codigo: it.codigo, descricao: it.descricao, qtd: delta, saldoApos,
            obs: 'Importação da planilha ESTOQUE INSUMOS', data: ts, por: myUid, porNome: reqMyName() });
          if(!it.ex){
            const ref = db.collection('almox_produtos').doc();
            batch.set(ref, { ...base, custo: it.custo, saldo: it.saldo, reservado: 0, localizacao: '', foto: '', ativo: true, criadoEm: ts });
            if(it.saldo > 0) mov(ref, it.saldo, it.saldo);
          } else {
            const ref = db.collection('almox_produtos').doc(it.ex.id);
            const upd = { ...base }; if(it.custo > 0) upd.custo = it.custo;
            if(ajustar && it.saldo !== (it.ex.saldo || 0)){
              if(it.saldo < (it.ex.reservado || 0)) pulados++;
              else { upd.saldo = it.saldo; mov(ref, it.saldo - (it.ex.saldo || 0), it.saldo); }
            }
            batch.update(ref, upd);
          }
          feitos++;
        });
        await batch.commit();
      }
      root.innerHTML = '';
      showSnack(`Importação concluída: ${feitos} produto(s).` + (pulados ? ` ${pulados} sem ajuste de saldo (menor que o reservado).` : ''));
    }catch(e){ const er = byId('imErr'); er.textContent = reqErr(e); er.style.display = 'block'; ok.disabled = false; ok.textContent = 'Importar'; }
  };
}
